<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minhas Finanças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #f3f4f9;
  --surface: #ffffff;
  --surface-2: #f6f7fb;
  --border: #e6e8f0;
  --grid: #eceef5;
  --text: #12131a;
  --text-2: #4b4f63;
  --muted: #868b9f;
  --accent: #5b4ef0;
  --accent-soft: rgba(91, 78, 240, .10);
  --hero: linear-gradient(135deg, #5b4ef0 0%, #3a6fe0 55%, #2a9fd6 100%);
  --s1: #2a78d6;
  --s2: #eb6834;
  --good: #12805c;
  --warn: #b77a00;
  --crit: #d93a3a;
  --radius: 16px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 6px 20px rgba(16, 24, 40, .06);
  --header-bg: rgba(243, 244, 249, .82);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0c0e15; --surface: #151823; --surface-2: #1b1f2d; --border: #252a3a; --grid: #212636;
    --text: #eef0f7; --text-2: #b7bccd; --muted: #7d8397;
    --accent: #8278ff; --accent-soft: rgba(130, 120, 255, .16);
    --hero: linear-gradient(135deg, #4a3fd6 0%, #2d5cc4 55%, #1f86b8 100%);
    --s1: #3987e5; --s2: #d95926;
    --good: #3fbf7f; --warn: #e0a520; --crit: #f07070;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .25);
    --header-bg: rgba(12, 14, 21, .8);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0c0e15; --surface: #151823; --surface-2: #1b1f2d; --border: #252a3a; --grid: #212636;
  --text: #eef0f7; --text-2: #b7bccd; --muted: #7d8397;
  --accent: #8278ff; --accent-soft: rgba(130, 120, 255, .16);
  --hero: linear-gradient(135deg, #4a3fd6 0%, #2d5cc4 55%, #1f86b8 100%);
  --s1: #3987e5; --s2: #d95926;
  --good: #3fbf7f; --warn: #e0a520; --crit: #f07070;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .25);
  --header-bg: rgba(12, 14, 21, .8);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* topo */
.topo { position: sticky; top: 0; z-index: 10; background: var(--header-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
header { max-width: 1080px; margin: 0 auto; padding: 14px 16px 10px; display: flex; align-items: center; gap: 12px; }
.logo { width: 36px; height: 36px; border-radius: 11px; background: var(--hero); color: #fff; display: grid; place-items: center; box-shadow: 0 4px 12px rgba(91, 78, 240, .35); }
header h1 { font-size: 18px; font-weight: 700; letter-spacing: -.01em; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
nav .curto { display: none; }
#sync-st { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
#mes { border-radius: 99px; padding: 7px 14px; font-weight: 600; background: var(--surface); }
nav { max-width: 1080px; margin: 0 auto; padding: 0 12px 10px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav button { display: flex; align-items: center; gap: 7px; background: none; border: 0; padding: 8px 14px; border-radius: 99px; color: var(--text-2); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s; }
nav button:hover { background: var(--surface-2); color: var(--text); }
nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 40px; }

/* cartões de conteúdo */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
.card h2 { font-size: 15px; font-weight: 650; margin: 0 0 14px; letter-spacing: -.005em; display: flex; align-items: center; gap: 8px; }
.card h2 .sub { font-weight: 500; color: var(--muted); font-size: 13px; }
.hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); display: flex; gap: 12px; align-items: flex-start; }
.tile .ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 13%, transparent); flex: none; }
.tile .lbl { color: var(--text-2); font-size: 13px; font-weight: 500; }
.tile .val { font-size: 22px; font-weight: 700; margin-top: 1px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

/* destaque do mês */
.hero { background: var(--hero); color: #fff; border-radius: 20px; padding: 24px; margin-bottom: 16px; box-shadow: 0 10px 30px rgba(58, 80, 220, .28); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; background: rgba(255, 255, 255, .08); }
.hero .lbl { font-size: 14px; opacity: .85; font-weight: 500; }
.hero .big { font-size: 38px; font-weight: 750; letter-spacing: -.03em; margin: 2px 0 16px; font-variant-numeric: tabular-nums; }
.hero .stats { display: flex; gap: 10px; flex-wrap: wrap; position: relative; z-index: 1; }
.hero .stat { background: rgba(255, 255, 255, .14); border-radius: 12px; padding: 10px 14px; min-width: 150px; display: flex; gap: 10px; align-items: center; }
.hero .stat small { display: block; font-size: 12px; opacity: .8; }
.hero .stat b { font-size: 16px; font-variant-numeric: tabular-nums; }
.hero .orc { margin-top: 16px; position: relative; z-index: 1; font-size: 13px; }
.hero .orc .bar { height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .22); margin-top: 6px; overflow: hidden; }
.hero .orc .bar i { display: block; height: 100%; border-radius: 99px; background: #fff; }

/* formulários */
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.row label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 500; color: var(--text-2); flex: 1 1 140px; }
input, select { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; min-width: 0; transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input[type=range] { padding: 0; accent-color: var(--accent); box-shadow: none; }
input[type=checkbox] { accent-color: var(--accent); }
.btn { font: inherit; font-weight: 600; font-size: 14px; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 10px; padding: 9px 16px; cursor: pointer; transition: transform .1s, box-shadow .15s, background .15s; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: transparent; color: #fff; box-shadow: 0 4px 12px rgba(91, 78, 240, .3); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
button.link { border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; font-size: 13px; padding: 4px 6px; border-radius: 6px; }
button.link:hover { color: var(--crit); background: var(--surface-2); }
a { color: var(--accent); }

/* tabelas */
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--grid); font-size: 14px; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
tbody tr { transition: background .12s; }
tbody tr:hover { background: var(--surface-2); }
td.num, th.num { text-align: right; white-space: nowrap; }
.tbl-wrap { overflow-x: auto; margin: 0 -10px; }
.pos { color: var(--good); }
.neg { color: var(--crit); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--border); border-radius: 99px; padding: 1px 9px; white-space: nowrap; vertical-align: 1px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

/* filtro por cartão */
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.chip { display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 14px; font-weight: 550; padding: 7px 14px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); cursor: pointer; box-shadow: var(--shadow); transition: all .15s; }
.chip:hover { color: var(--text); }
.chip.on { background: var(--text); color: var(--surface); border-color: var(--text); }

/* resumo por cartão */
.cartao-row { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 10px 8px; border-radius: 12px; cursor: pointer; transition: background .12s; }
.cartao-row:hover { background: var(--surface-2); }
.cartao-ico { width: 34px; height: 24px; border-radius: 6px; background: var(--c); display: grid; place-items: center; color: #fff; }
.cartao-ico svg.i { width: 15px; height: 15px; }
.cartao-row .nome { font-weight: 600; font-size: 14px; }
.cartao-row .mini { height: 6px; border-radius: 99px; background: var(--grid); margin-top: 6px; overflow: hidden; }
.cartao-row .mini i { display: block; height: 100%; border-radius: 99px; background: var(--c); }
.cartao-row .amt { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
.cartao-row .amt small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }

/* categorias */
.cat-row { display: grid; grid-template-columns: minmax(90px, 150px) 1fr auto; gap: 14px; align-items: center; padding: 8px 0; }
.cat-row .name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { position: relative; height: 8px; background: var(--grid); border-radius: 99px; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--s1); }
.limit { position: absolute; top: -4px; bottom: -4px; width: 2px; border-radius: 2px; background: var(--text-2); }
.cat-row .amt { font-size: 13px; color: var(--text-2); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.status { font-size: 12px; font-weight: 650; }
.status.warn { color: var(--warn); }
.status.crit { color: var(--crit); }

/* gráficos */
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; font-size: 13px; box-shadow: var(--shadow); white-space: nowrap; display: none; z-index: 2; }
.tip b { display: block; margin-bottom: 2px; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--text-2); margin-bottom: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.empty { color: var(--muted); text-align: center; padding: 28px 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid2 > .card { margin-bottom: 0; }
.grid2 { margin-bottom: 16px; }

/* importação de fatura */
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 2px; gap: 2px; }
.seg button { font: inherit; font-size: 13px; font-weight: 550; border: 0; background: none; color: var(--text-2); padding: 5px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--accent); color: #fff; box-shadow: 0 2px 6px rgba(91, 78, 240, .3); }
.seg button.on.nao { background: var(--text-2); color: var(--surface); box-shadow: none; }
tr.pendente td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
tr.ignorado td { color: var(--muted); }
.sec-title td { background: var(--surface-2); font-weight: 650; font-size: 13px; color: var(--text-2); }
.barra-imp { position: sticky; bottom: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; box-shadow: 0 8px 30px rgba(16, 24, 40, .16); }
.barra-imp .tot { font-size: 20px; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

dialog#dlg { border: 1px solid var(--border); border-radius: 20px; padding: 24px; background: var(--surface); color: var(--text); width: min(560px, calc(100vw - 32px)); box-shadow: 0 24px 60px rgba(0, 0, 0, .3); }
dialog#dlg::backdrop { background: rgba(10, 12, 20, .45); backdrop-filter: blur(3px); }
dialog#dlg h2 { font-size: 17px; margin: 0 0 16px; display: flex; align-items: center; gap: 8px; }
td.num button.link svg.i { width: 15px; height: 15px; vertical-align: -3px; }
@media (max-width: 720px) {
  .grid2 { grid-template-columns: 1fr; gap: 0; margin-bottom: 0; }
  .grid2 > .card { margin-bottom: 16px; }
  .cat-row { grid-template-columns: 90px 1fr; }
  .cat-row .amt { grid-column: 1 / -1; text-align: left; }
  .hero .big { font-size: 32px; }
  .hero .stat { flex: 1 1 130px; min-width: 0; }
  .card { padding: 16px; }
  /* navegação embaixo, como app (o blur do topo prenderia a barra fixa dentro dele) */
  .topo { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--bg); }
  nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; max-width: none; margin: 0; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); background: var(--header-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--border); justify-content: space-between; gap: 0; }
  nav button { flex: 1; flex-direction: column; gap: 3px; padding: 6px 2px; font-size: 10px; border-radius: 12px; min-width: 0; }
  nav button span { overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  nav .longo { display: none; }
  nav .curto { display: inline; }
  header h1 { font-size: 17px; }
  #mes { padding: 6px 8px; font-size: 13px; }
  main { padding-bottom: 96px; }
  .barra-imp { bottom: 76px; }
  #sync-st { display: none; }
}
</style>
</head>
<body>
<div class="topo">
  <header>
    <div class="logo" id="logo"></div>
    <h1>Minhas Finanças</h1>
    <span id="sync-st"></span>
    <select id="mes" aria-label="Mês"></select>
  </header>
  <nav id="tabs"></nav>
</div>
<main id="app"></main>
<dialog id="dlg"></dialog>
<datalist id="cats"></datalist>

<script>
const KEY = 'financas.v1';
const CATS_PADRAO = ['Moradia', 'Alimentação', 'Mercado', 'Transporte', 'Saúde', 'Academia', 'Celular', 'Pets', 'Educação', 'Lazer', 'Compras', 'Assinaturas', 'Encargos', 'Outros', 'Salário', 'Freelance'];

const fmt = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });

const ICONES = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  lista: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  repete: '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
  alvo: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  grafico: '<path d="m3 17 6-6 4 4 8-8"/><path d="M14 7h7v7"/>',
  envia: '<path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/>',
  dados: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  carteira: '<path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/><path d="M21 9h-6a3 3 0 0 0 0 6h6z"/>',
  cartao: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
  pix: '<path d="M12 3 3 12l9 9 9-9z"/><path d="m8 12 4-4 4 4-4 4z"/>',
  sobe: '<path d="M7 17 17 7M9 7h8v8"/>',
  desce: '<path d="M7 7l10 10M17 9v8H9"/>',
  pizza: '<path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>',
  lapis: '<path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>',
};
const ico = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONES[n]}</svg>`;
// [id, nome, ícone, nome curto da barra do celular]
const ABAS = [['visao', 'Visão geral', 'home', 'Início'], ['lanc', 'Lançamentos', 'lista', 'Lançar'], ['fixos', 'Fixos', 'repete', 'Fixos'],
  ['orc', 'Orçamento', 'alvo', 'Limites'], ['proj', 'Projeção', 'grafico', 'Projeção'], ['fatura', 'Importar fatura', 'envia', 'Fatura'], ['dados', 'Dados', 'dados', 'Dados']];

// Cartões: cada lançamento pode ter um cartão (importados da fatura já vêm com o banco).
// Sem cartão = Pix, débito ou dinheiro.
const SEM_CARTAO = '';
const FIXAS = '#fixas';   // itens fixos sem cartão (aluguel, contas em boleto/débito automático)
const CORES_CARTAO = { 'Itaú': '#ec7000', 'Santander': '#d93a3a', 'Nubank': '#8a3ffc', 'Bradesco': '#cc2c74' };
const CORES_EXTRA = ['#2a78d6', '#1baf7a', '#c98500', '#6250d6'];
const corCartao = c => !c ? '#8a8fa3' : c === FIXAS ? '#1baf7a' : CORES_CARTAO[c] || CORES_EXTRA[[...c].reduce((a, ch) => a + ch.charCodeAt(0), 0) % CORES_EXTRA.length];
const nomeCartao = c => c === FIXAS ? 'Contas fixas' : c || 'Pix / débito';
const grupoCartao = i => i.cartao || (i.fixo ? FIXAS : SEM_CARTAO);
const tagCartao = c => `<span class="tag"><span class="dot" style="background:${corCartao(c)}"></span>${esc(nomeCartao(c))}</span>`;
let cartaoSel = null;   // null = todos
function cartoesUsados() {
  const set = new Set();
  S.lanc.concat(S.fixos).forEach(i => { if (i.cartao) set.add(i.cartao); });
  return [...set].sort();
}
// com um cartão selecionado, só despesas: receita (salário etc.) não é gasto de cartão nenhum
const filtraCartao = itens => cartaoSel === null ? itens : itens.filter(i => i.tipo === 'despesa' && grupoCartao(i) === cartaoSel);
function chipsCartao() {
  const cs = cartoesUsados();
  if (!cs.length) return '';
  const chip = (v, txt, cor) => `<button class="chip ${cartaoSel === v ? 'on' : ''}" data-cartao="${v === null ? '*' : esc(v)}">${cor ? `<span class="dot" style="background:${cor}"></span>` : ''}${txt}</button>`;
  return `<div class="chips">${chip(null, 'Todos')}${cs.map(c => chip(c, esc(c), corCartao(c))).join('')}${S.fixos.some(f => f.tipo === 'despesa' && !f.cartao) ? chip(FIXAS, 'Contas fixas', corCartao(FIXAS)) : ''}${chip(SEM_CARTAO, 'Pix / débito', corCartao(SEM_CARTAO))}</div>`;
}
const opcoesCartao = (atual = SEM_CARTAO) => [SEM_CARTAO, ...new Set([...cartoesUsados(), ...Object.keys(LEITORES)])]
  .map(c => `<option value="${esc(c)}" ${c === atual ? 'selected' : ''}>${esc(nomeCartao(c))}</option>`).join('');
function tile(lbl, val, icone, cor, extra = '') {
  return `<div class="tile"><div class="ico" style="--c:${cor}">${ico(icone)}</div><div><div class="lbl">${lbl}</div><div class="val">${val}</div>${extra}</div></div>`;
}
const fmtCurto = v => Math.abs(v) >= 1000 ? 'R$ ' + (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil' : fmt.format(v);
const NOMES_MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const hoje = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const mesAtual = () => hoje().slice(0, 7);
const addMes = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const nomeMes = ym => { const [y, m] = ym.split('-'); return NOMES_MES[m - 1] + '/' + y.slice(2); };
const num = v => { const n = parseFloat(String(v).replace(/\./g, '').replace(',', '.')); return isFinite(n) ? n : 0; };

// ---------- estado ----------
function novoEstado() {
  // regras: o que você marcou para cada estabelecimento nas faturas, para pré-marcar na próxima
  return { saldoAtual: 0, lanc: [], fixos: [], orc: {}, cats: CATS_PADRAO.slice(), ajuste: 0, horizonte: 12, regras: {}, faturas: [], diasFechamento: {}, diasVencimento: {}, cartaoDiaUtil: {} };
}
// Ajusta dados salvos por versões antigas do app.
function normalizar(d) {
  const s = Object.assign(novoEstado(), d);
  // a primeira versão do importador só lia Santander e não gravava o cartão
  s.lanc.forEach(l => { if (l.origem === 'fatura' && !l.cartao) l.cartao = 'Santander'; });
  return s;
}
function carregar() {
  try { const r = localStorage.getItem(KEY); if (r) return normalizar(JSON.parse(r)); } catch (e) {}
  return novoEstado();
}
let S = carregar();
let aba = 'visao';
let mesSel = mesAtual();

function gravarLocal() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}
function salvar() {
  S.atualizado = Date.now();
  gravarLocal();
  agendarEnvio();
  render();
}

// ---------- sincronização (arquivo dados.json num repositório privado do GitHub) ----------
const SYNC_KEY = 'financas.sync';
let sync = (() => { try { return JSON.parse(localStorage.getItem(SYNC_KEY)); } catch (e) { return null; } })();
let syncSha = null, timerEnvio = null, syncStatus = '';

function statusSync(s) {
  syncStatus = s;
  const el = document.getElementById('sync-st');
  if (el) el.textContent = s;
}
async function ghArquivo(metodo, corpo) {
  const r = await fetch(`https://api.github.com/repos/${sync.repo}/contents/dados.json`, {
    method: metodo, cache: 'no-store',
    headers: { Authorization: 'Bearer ' + sync.token, Accept: 'application/vnd.github+json' },
    body: corpo && JSON.stringify(corpo),
  });
  if (r.status === 404 && metodo === 'GET') return null;
  if (!r.ok) {
    const e = new Error(r.status === 401 ? 'token inválido ou expirado' : r.status === 403 || r.status === 404 ? 'sem acesso ao repositório ' + sync.repo : 'erro ' + r.status);
    e.status = r.status;
    throw e;
  }
  return r.json();
}
const b64enc = s => { let bin = ''; new TextEncoder().encode(s).forEach(c => bin += String.fromCharCode(c)); return btoa(bin); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0)));

async function lerNuvem() {
  const r = await ghArquivo('GET');
  if (!r) { syncSha = null; return null; }
  syncSha = r.sha;
  return JSON.parse(b64dec(r.content));
}
// Fica com a versão mais recente: a da nuvem ou a deste aparelho.
async function puxar() {
  if (!sync) return;
  statusSync('☁ sincronizando…');
  try {
    const remoto = await lerNuvem();
    if (remoto && (remoto.atualizado || 0) > (S.atualizado || 0)) {
      S = normalizar(remoto);
      gravarLocal(); render();
    } else if (!remoto || (S.atualizado || 0) > (remoto.atualizado || 0)) {
      return enviar();
    }
    statusSync('☁ sincronizado');
  } catch (e) { statusSync('☁ ' + e.message); }
}
async function enviar(tentarDeNovo = true) {
  if (!sync) return;
  clearTimeout(timerEnvio); timerEnvio = null;
  statusSync('☁ salvando…');
  try {
    const r = await ghArquivo('PUT', { message: 'Atualiza dados', content: b64enc(JSON.stringify(S)), ...(syncSha ? { sha: syncSha } : {}) });
    syncSha = r.content.sha;
    statusSync('☁ sincronizado');
  } catch (e) {
    // outro aparelho salvou no meio do caminho: pega a versão atual do arquivo e grava por cima
    if ((e.status === 409 || e.status === 422) && tentarDeNovo) {
      try { await lerNuvem(); return enviar(false); } catch (e2) { e = e2; }
    }
    statusSync('☁ ' + e.message);
  }
}
function agendarEnvio() {
  if (!sync) return;
  clearTimeout(timerEnvio);
  statusSync('☁ alterações pendentes');
  timerEnvio = setTimeout(enviar, 1500);
}
async function conectarSync(token, repo) {
  sync = { token, repo };
  statusSync('☁ conectando…');
  try {
    const remoto = await lerNuvem();
    const temLocal = S.lanc.length || S.fixos.length;
    if (remoto && temLocal && !confirm(`Já existem dados na nuvem (${(remoto.lanc || []).length} lançamentos).\n\nOK = usar os dados da nuvem neste aparelho\nCancelar = substituir a nuvem pelos dados deste aparelho`)) {
      S.atualizado = Date.now();
      await enviar();
    } else if (remoto) {
      S = normalizar(remoto);
      gravarLocal();
      statusSync('☁ sincronizado');
    } else {
      await enviar();
    }
    try { localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); } catch (e) {}
  } catch (e) {
    sync = null;
    statusSync('');
    alert('Não consegui conectar: ' + e.message);
  }
  render();
}

// ---------- cálculos ----------
const fixoAtivo = (f, m) => f.inicio <= m && (!f.fim || m <= f.fim);

function itensDoMes(m) {
  const fx = S.fixos.filter(f => fixoAtivo(f, m)).map(f => ({ ...f, fixo: true }));
  const lc = S.lanc.filter(l => l.data.slice(0, 7) === m);
  return fx.concat(lc);
}
function totais(itens) {
  let r = 0, d = 0;
  for (const i of itens) i.tipo === 'receita' ? r += i.valor : d += i.valor;
  return { r, d, saldo: r - d };
}
// Média dos lançamentos variáveis (não fixos) nos últimos 3 meses fechados que têm dados.
// Parcelas ficam de fora: as próximas já entram na projeção como lançamentos planejados.
function mediaVariavel() {
  const vars = S.lanc.filter(l => !l.parcela);
  const meses = [];
  for (let i = 1; i <= 3; i++) {
    const m = addMes(mesAtual(), -i);
    if (vars.some(l => l.data.slice(0, 7) === m)) meses.push(m);
  }
  if (!meses.length) {
    // sem histórico: usa o mês atual como base
    const t = totais(vars.filter(l => l.data.slice(0, 7) === mesAtual()));
    return { r: t.r, d: t.d, meses: vars.some(l => l.data.slice(0, 7) === mesAtual()) ? [mesAtual()] : [] };
  }
  const t = totais(vars.filter(l => meses.includes(l.data.slice(0, 7))));
  return { r: t.r / meses.length, d: t.d / meses.length, meses };
}
function projecao() {
  const media = mediaVariavel();
  const fator = 1 + S.ajuste / 100;
  let saldo = S.saldoAtual;
  const linhas = [];
  // resto do mês atual: só o que ainda tem data para acontecer (o resto já está no saldo atual)
  const resto = eventos(hoje(), fimDoMes(mesAtual()));
  const rr = r2(resto.filter(e => e.valor > 0).reduce((a, e) => a + e.valor, 0)), rd = r2(-resto.filter(e => e.valor < 0).reduce((a, e) => a + e.valor, 0));
  saldo += rr - rd;
  linhas.push({ m: mesAtual(), r: rr, d: rd, liq: rr - rd, saldo, planejado: 0, resto: true });
  for (let i = 1; i <= S.horizonte; i++) {
    const m = addMes(mesAtual(), i);
    const fx = totais(S.fixos.filter(f => fixoAtivo(f, m)));
    const pl = totais(S.lanc.filter(l => l.data.slice(0, 7) === m));
    const r = fx.r + media.r + pl.r;
    const d = fx.d + media.d * fator + pl.d;
    saldo += r - d;
    linhas.push({ m, r, d, liq: r - d, saldo, planejado: pl.d - pl.r });
  }
  return { linhas, media };
}

// ---------- gráficos ----------
function niceTicks(min, max, n = 4) {
  if (min === max) { max = min + 1; }
  const span = max - min, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(k => k * mag).find(s => s >= step0);
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const t = []; for (let v = lo; v <= hi + step / 2; v += step) t.push(+v.toFixed(2));
  return t;
}

function linhaSaldo(el, linhas) {
  const W = el.clientWidth || 600, H = 260, P = { l: 64, r: 16, t: 12, b: 28 };
  const vals = linhas.map(l => l.saldo).concat([S.saldoAtual]);
  const ticks = niceTicks(Math.min(0, ...vals), Math.max(0, ...vals));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const pts = [{ m: mesAtual(), saldo: S.saldoAtual, atual: true }].concat(linhas);
  const x = i => P.l + (W - P.l - P.r) * (i / Math.max(1, pts.length - 1));
  const y = v => P.t + (H - P.t - P.b) * (1 - (v - y0) / (y1 - y0));
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Saldo projetado por mês">`;
  for (const t of ticks) s += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--${t === 0 ? 'text-2' : 'grid'})" stroke-width="1"/><text x="${P.l - 8}" y="${y(t) + 4}" text-anchor="end">${fmtCurto(t)}</text>`;
  const every = Math.ceil(pts.length / Math.max(2, Math.floor((W - P.l) / 60)));
  pts.forEach((p, i) => { if (i % every === 0) s += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${p.atual ? 'hoje' : nomeMes(p.m)}</text>`; });
  s += `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + x(i) + ',' + y(p.saldo)).join('')}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>`;
  const last = pts[pts.length - 1];
  s += `<circle cx="${x(pts.length - 1)}" cy="${y(last.saldo)}" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>`;
  s += `<line class="xh" y1="${P.t}" y2="${H - P.b}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" style="display:none"/><circle class="dot" r="5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2" style="display:none"/>`;
  s += `<rect x="${P.l}" y="0" width="${W - P.l - P.r}" height="${H}" fill="transparent" class="hit"/></svg><div class="tip"></div>`;
  el.innerHTML = s;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = svg.querySelector('.xh'), dot = svg.querySelector('.dot');
  const mover = ev => {
    const r = svg.getBoundingClientRect(), mx = (ev.clientX - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(pts.length - 1, Math.round((mx - P.l) / ((W - P.l - P.r) / Math.max(1, pts.length - 1)))));
    const p = pts[i];
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.style.display = '';
    dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(p.saldo)); dot.style.display = '';
    tip.innerHTML = `<b>${p.atual ? 'Hoje' : nomeMes(p.m)}</b>Saldo: ${fmt.format(p.saldo)}` + (p.atual ? '' : `<br><span style="color:var(--text-2)">No mês: <span class="${p.liq < 0 ? 'neg' : 'pos'}">${fmt.format(p.liq)}</span></span>`);
    tip.style.display = 'block';
    const px = x(i) * (r.width / W);
    tip.style.left = Math.min(px + 12, r.width - tip.offsetWidth) + 'px';
    tip.style.top = Math.max(0, y(p.saldo) * (r.height / H) - tip.offsetHeight - 10) + 'px';
  };
  svg.addEventListener('pointermove', mover);
  svg.addEventListener('pointerleave', () => { tip.style.display = 'none'; xh.style.display = 'none'; dot.style.display = 'none'; });
}

function barrasHistorico(el, meses) {
  const W = el.clientWidth || 600, H = 220, P = { l: 64, r: 8, t: 8, b: 26 };
  // com um cartão selecionado, mostra só os gastos dele (uma série, na cor do cartão)
  const soGastos = cartaoSel !== null;
  const dados = meses.map(m => ({ m, ...totais(filtraCartao(itensDoMes(m))) }));
  if (soGastos) dados.forEach(d => d.r = 0);
  const ticks = niceTicks(0, Math.max(1, ...dados.flatMap(d => [d.r, d.d])));
  const y1 = ticks[ticks.length - 1];
  const y = v => P.t + (H - P.t - P.b) * (1 - v / y1);
  const gw = (W - P.l - P.r) / dados.length, bw = Math.min(28, (gw - 14) / 2);
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Receitas e despesas por mês">`;
  for (const t of ticks) s += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--${t === 0 ? 'text-2' : 'grid'})"/><text x="${P.l - 8}" y="${y(t) + 4}" text-anchor="end">${fmtCurto(t)}</text>`;
  const bar = (bx, v, cor) => {
    const top = y(v), h = y(0) - top; if (h <= 0) return '';
    const r = Math.min(4, h, bw / 2);
    return `<path d="M${bx},${y(0)}V${top + r}Q${bx},${top} ${bx + r},${top}H${bx + bw - r}Q${bx + bw},${top} ${bx + bw},${top + r}V${y(0)}Z" fill="var(${cor})"/>`;
  };
  dados.forEach((d, i) => {
    const cx = P.l + gw * i + gw / 2;
    s += soGastos ? bar(cx - bw / 2, d.d, '--cartao') : bar(cx - bw - 1, d.r, '--s1') + bar(cx + 1, d.d, '--s2');
    s += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${nomeMes(d.m)}</text>`;
    s += `<rect x="${P.l + gw * i}" y="0" width="${gw}" height="${H}" fill="transparent" data-i="${i}"/>`;
  });
  s += `</svg><div class="tip"></div>`;
  el.style.setProperty('--cartao', corCartao(cartaoSel));
  el.innerHTML = (soGastos ? '' : `<div class="legend"><span><i style="background:var(--s1)"></i>Receitas</span><span><i style="background:var(--s2)"></i>Despesas</span></div>`) + s;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip');
  svg.addEventListener('pointermove', ev => {
    const i = ev.target.dataset && ev.target.dataset.i; if (i == null) return;
    const d = dados[i], r = svg.getBoundingClientRect();
    tip.innerHTML = soGastos ? `<b>${nomeMes(d.m)}</b>${esc(nomeCartao(cartaoSel))}: ${fmt.format(d.d)}`
      : `<b>${nomeMes(d.m)}</b>Receitas: ${fmt.format(d.r)}<br>Despesas: ${fmt.format(d.d)}<br>Saldo: <span class="${d.saldo < 0 ? 'neg' : 'pos'}">${fmt.format(d.saldo)}</span>`;
    tip.style.display = 'block';
    const px = (P.l + gw * i + gw / 2) * (r.width / W);
    tip.style.left = Math.max(0, Math.min(px - tip.offsetWidth / 2, r.width - tip.offsetWidth)) + 'px';
    tip.style.top = (svg.offsetTop - tip.offsetHeight + 20) + 'px';
  });
  svg.addEventListener('pointerleave', () => tip.style.display = 'none');
}

// ---------- telas ----------
function catsUsadas() {
  const set = new Set(S.cats);
  S.lanc.concat(S.fixos).forEach(i => set.add(i.cat));
  return [...set];
}

function telaVisao() {
  const todos = itensDoMes(mesSel), itens = filtraCartao(todos), t = totais(itens);
  const desp = itens.filter(i => i.tipo === 'despesa');
  const porCat = {};
  desp.forEach(i => porCat[i.cat] = (porCat[i.cat] || 0) + i.valor);
  if (cartaoSel === null) Object.keys(S.orc).forEach(c => { if (S.orc[c] > 0 && !(c in porCat)) porCat[c] = 0; });
  const cats = Object.entries(porCat).sort((a, b) => b[1] - a[1]);
  const maxG = Math.max(1, ...cats.map(([c, v]) => Math.max(v, cartaoSel === null ? S.orc[c] || 0 : 0)));
  const orcTotal = Object.values(S.orc).reduce((a, b) => a + (b || 0), 0);
  const gastoOrcado = Object.keys(S.orc).reduce((a, c) => a + (porCat[c] || 0), 0);
  const rows = cats.map(([c, v]) => {
    const lim = cartaoSel === null ? S.orc[c] || 0 : 0, pct = lim ? v / lim : 0;
    let st = '';
    if (lim && pct > 1) st = `<span class="status crit">▲ Estourou ${fmt.format(v - lim)}</span>`;
    else if (lim && pct >= 0.8) st = `<span class="status warn">● ${Math.round(pct * 100)}% usado</span>`;
    return `<div class="cat-row"><div class="name">${esc(c)}</div>
      <div class="track"><div class="fill" style="width:${(v / maxG) * 100}%;${cartaoSel !== null ? `background:${corCartao(cartaoSel)}` : ''}"></div>${lim ? `<div class="limit" style="left:${(lim / maxG) * 100}%" title="Limite ${fmt.format(lim)}"></div>` : ''}</div>
      <div class="amt">${fmt.format(v)}${lim ? ' de ' + fmt.format(lim) : ''} ${st}</div></div>`;
  }).join('');

  // gastos do mês por cartão (só aparece quando há algum cartão)
  const porCartao = {};
  todos.filter(i => i.tipo === 'despesa').forEach(i => {
    const c = grupoCartao(i);
    porCartao[c] = porCartao[c] || { v: 0, n: 0 };
    porCartao[c].v += i.valor; porCartao[c].n++;
  });
  const listaCartoes = Object.entries(porCartao).sort((a, b) => b[1].v - a[1].v);
  const maxCartao = Math.max(1, ...listaCartoes.map(([, x]) => x.v));
  const cardCartoes = cartoesUsados().length ? `
    <div class="card"><h2>${ico('cartao')} Por cartão <span class="sub">· sua parte em ${nomeMes(mesSel)}</span></h2>
      ${listaCartoes.map(([c, x]) => `<div class="cartao-row" data-cartao="${esc(c)}" style="--c:${corCartao(c)}">
        <div class="cartao-ico">${ico(c === FIXAS ? 'repete' : c ? 'cartao' : 'pix')}</div>
        <div><div class="nome">${esc(nomeCartao(c))}</div><div class="mini"><i style="width:${x.v / maxCartao * 100}%"></i></div></div>
        <div class="amt">${fmt.format(x.v)}<small>${x.n} ${x.n === 1 ? 'item' : 'itens'}</small></div></div>`).join('') || '<div class="empty">Nenhuma despesa neste mês.</div>'}
      <p class="hint">Toque num cartão para ver só os gastos dele.</p>
    </div>` : '';

  // no mês atual: o que ainda vai entrar/sair daqui até o fim do mês
  const resto = mesSel === mesAtual() ? eventos(hoje(), fimDoMes(mesSel)) : null;
  const faltaEntrar = resto ? r2(resto.filter(e => e.valor > 0).reduce((a, e) => a + e.valor, 0)) : 0;
  const faltaSair = resto ? r2(-resto.filter(e => e.valor < 0).reduce((a, e) => a + e.valor, 0)) : 0;
  const quando = sinal => resto.filter(e => sinal * e.valor > 0).map(e => e.data.slice(8) + '/' + e.data.slice(5, 7)).filter((x, i, a) => a.indexOf(x) === i).slice(0, 3).join(', ');
  const hero = cartaoSel === null ? `
  <div class="hero">
    <div class="lbl">Sobra de ${nomeMes(mesSel)}</div>
    <div class="big">${fmt.format(t.saldo)}</div>
    <div class="stats">
      <div class="stat">${ico('sobe')}<div><small>Receitas</small><b>${fmt.format(t.r)}</b></div></div>
      <div class="stat">${ico('desce')}<div><small>Despesas</small><b>${fmt.format(t.d)}</b></div></div>
      ${resto ? `<div class="stat">${ico('sobe')}<div><small>Ainda vai entrar${faltaEntrar ? ' · ' + quando(1) : ''}</small><b>${fmt.format(faltaEntrar)}</b></div></div>
      <div class="stat">${ico('desce')}<div><small>Ainda vai sair${faltaSair ? ' · ' + quando(-1) : ''}</small><b>${fmt.format(faltaSair)}</b></div></div>` : ''}
    </div>
    ${orcTotal ? `<div class="orc">Orçamento: ${fmt.format(gastoOrcado)} de ${fmt.format(orcTotal)} (${Math.round(gastoOrcado / orcTotal * 100)}%)${gastoOrcado > orcTotal ? ' · ▲ acima do limite' : ''}
      <div class="bar"><i style="width:${Math.min(100, gastoOrcado / orcTotal * 100)}%"></i></div></div>` : ''}
  </div>` : `
  <div class="hero" style="background:linear-gradient(135deg, ${corCartao(cartaoSel)} 0%, color-mix(in srgb, ${corCartao(cartaoSel)} 55%, #1b1530) 100%)">
    <div class="lbl">${esc(nomeCartao(cartaoSel))} · ${nomeMes(mesSel)}</div>
    <div class="big">${fmt.format(t.d)}</div>
    <div class="stats">
      <div class="stat">${ico('lista')}<div><small>Lançamentos</small><b>${desp.length}</b></div></div>
      ${cats[0] ? `<div class="stat">${ico('pizza')}<div><small>Maior categoria</small><b>${esc(cats[0][0])}</b></div></div>` : ''}
      ${t.d ? `<div class="stat">${ico('carteira')}<div><small>Do total do mês</small><b>${Math.round(t.d / Math.max(1, totais(todos).d) * 100)}%</b></div></div>` : ''}
    </div>

let pdfjsPronto;
function carregarPdfjs() {
  return pdfjsPronto ||= new Promise((ok, erro) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok(pdfjsLib); };
    s.onerror = () => { pdfjsPronto = null; erro(new Error('Não consegui carregar o leitor de PDF (precisa de internet).')); };
    document.head.appendChild(s);
  });
}

// Junta os pedaços de texto do PDF em linhas (página inteira, da esquerda para a direita),
// guardando a posição horizontal de cada caractere para saber de que coluna cada compra veio.
async function linhasDoPdf(buf) {
  const lib = await carregarPdfjs();
  let doc;
  try {
    doc = await lib.getDocument({ data: buf.slice(0) }).promise;
  } catch (e) {
    if (e.name !== 'PasswordException') throw e;
    // alguns bancos protegem o PDF (costuma ser parte do CPF do titular)
    const senha = prompt('Esta fatura tem senha. Digite a senha do PDF (geralmente são os primeiros dígitos do CPF do titular):');
    if (!senha) throw new Error('A fatura tem senha e nenhuma foi informada.');
    try { doc = await lib.getDocument({ data: buf, password: senha }).promise; }
    catch (e2) { throw e2.name === 'PasswordException' ? new Error('Senha incorreta.') : e2; }
  }
  const linhas = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p), meio = page.getViewport({ scale: 1 }).width / 2;
    const itens = (await page.getTextContent()).items.filter(i => i.str.trim());
    const grupos = [];
    for (const it of itens) {
      const y = it.transform[5];
      let g = grupos.find(g => Math.abs(g.y - y) < 2.5);
      if (!g) grupos.push(g = { y, itens: [] });
      g.itens.push(it);
    }
    grupos.sort((a, b) => b.y - a.y);
    for (const g of grupos) {
      g.itens.sort((a, b) => a.transform[4] - b.transform[4]);
      let txt = '', xs = [], fim = null;
      for (const it of g.itens) {
        const x = it.transform[4];
        if (fim !== null && x - fim > 1) { txt += ' '; xs.push(x); }
        const s = it.str.replace(/[−–]/g, '-');
        txt += s; xs.push(...Array(s.length).fill(x));
        fim = x + it.width;
      }
      linhas.push({ pagina: p, meio, txt, xs });
    }
  }
  return linhas;
}

const MESES = { jan: 1, fev: 2, mar: 3, abr: 4, mai: 5, jun: 6, jul: 7, ago: 8, set: 9, out: 10, nov: 11, dez: 12 };

// "1.234,56" | "R$ -12,00" | "12,00-" | "-R$ 5,00" → número (negativo = crédito)
function valorDe(s) {
  s = String(s).replace(/[−–]/g, '-').replace(/R\$|\s/g, '');
  const neg = /^-|-$/.test(s);
  const n = parseFloat(s.replace(/-/g, '').replace(/\./g, '').replace(',', '.'));
  return isFinite(n) ? (neg ? -n : n) : NaN;
}
// "05/10", "05/10/2026", "05 OUT", "05 OUT 2026" → {d, m, a?}
function dataDe(s) {
  const m = String(s).match(/(\d{2})(?:\/(\d{2})|\s([A-Za-z]{3}))(?:[\/ ](\d{4}))?/);
  if (!m) return null;
  const mes = m[2] ? +m[2] : MESES[m[3].toLowerCase()];
  if (!mes || mes > 12 || +m[1] < 1 || +m[1] > 31) return null;
  return { d: +m[1], m: mes, a: m[4] ? +m[4] : null };
}
const iso = (a, m, d) => `${a}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

// Parcela no fim da descrição: "LOJA 03/10", "LOJA PARC 03/10", "Loja - Parcela 3/10"
function separarParcela(desc) {
  const m = desc.match(/\s*[-–]?\s*(?:PARC(?:ELA)?\.?\s*)?(\d{1,2})\s*\/\s*(\d{1,2})$/i);
  if (m && +m[1] >= 1 && +m[1] <= +m[2] && +m[2] > 1 && +m[2] <= 48) return { desc: desc.slice(0, m.index).trim(), parc: { n: +m[1], N: +m[2] } };
  return { desc, parc: null };
}

  },
};
const BANCOS_SUPORTADOS = Object.keys(LEITORES).join(', ').replace(/, (?=[^,]*$)/, ' e ');

function lerFatura(linhas) {
  const texto = linhas.map(l => l.txt).join('\n');
  const banco = Object.keys(LEITORES).find(b => LEITORES[b].detecta.test(texto));
  if (!banco) throw new Error(`Não reconheci o banco desta fatura. O app lê faturas em PDF de: ${BANCOS_SUPORTADOS}.`);
  const L = LEITORES[banco];
  const reCompra = new RegExp(`(?<![\\d\\/])(${L.data})\\s*(.+?)\\s+(${VALOR})(?![\\d%,])`, 'gi');

  const brutos = [];
  let futuros = 0;
  const estado = [L.inicio, L.inicio];   // [coluna esquerda, coluna direita]
  const colunaEm = (l, i) => l.xs[i] < l.meio ? 0 : 1;
  for (const l of linhas) {
    // títulos de seção mudam o estado da coluna onde aparecem
    for (const [re, novo] of L.secoes) {
      const g = new RegExp(re.source, re.flags.includes('g') ? re.flags : re.flags + 'g');
      for (const m of l.txt.matchAll(g)) estado[colunaEm(l, m.index)] = novo;
    }
    for (const re of L.encargos) {
      const m = l.txt.match(re);
      if (m && valorDe(m[2]) > 0) brutos.push({ dataObj: null, desc: m[1].trim(), valor: valorDe(m[2]), encargo: true });
    }
    for (const m of l.txt.matchAll(reCompra)) {
      const st = estado[colunaEm(l, m.index)];
      if (st === 'futuro') { futuros++; continue; }
      if (st !== 'compra') continue;
      const d = dataDe(m[1]);
      if (d) brutos.push({ dataObj: d, desc: m[2].trim(), valor: valorDe(m[3]) });
    }
  }

  // vencimento e fechamento
  const achar = re => { const m = texto.match(re); return m ? dataDe(m[1]) : null; };
  const venc = achar(L.vencimento) || (() => { const [a, m, d] = hoje().split('-').map(Number); return { a, m, d }; })();
  const fech = achar(L.fechamento) || venc;
  let ano = fech.a || venc.a;
  if (!fech.a && fech.m > venc.m) ano--;
  const fechamento = iso(ano, fech.m, fech.d);
  const dataISO = o => iso(o.a || (o.m > fech.m ? ano - 1 : ano), o.m, o.d);

  let ignorados = 0;
  const itens = [];
  for (const b of brutos) {
    if (isNaN(b.valor) || b.valor === 0) continue;
    if (b.valor < 0 && /PAGAMENTO|PAGTO/i.test(b.desc)) { ignorados++; continue; }
    const { desc, parc } = separarParcela(b.desc.replace(/\s+/g, ' ').trim());
    const sec = b.encargo || /^(JUROS|IOF|MULTA|ENCARGO|ANUIDADE)/i.test(desc) ? 'encargo' : b.valor < 0 ? 'credito' : parc ? 'parcela' : 'despesa';
    itens.push({ sec, data: b.dataObj ? dataISO(b.dataObj) : fechamento, desc: desc.toUpperCase(), parc, valor: r2(b.valor) });
  }
  if (!itens.length) throw new Error(`Reconheci uma fatura ${banco}, mas não encontrei compras nela.`);

  // conferência com o total impresso na fatura
  const tot = texto.match(L.total.re);
  const soma = r2(itens.filter(i => L.total.inclui === 'tudo' || i.sec !== 'encargo').reduce((a, i) => a + i.valor, 0));
  const totalFatura = tot ? valorDe(tot[1]) : null;

  itens.forEach(it => {
    it.base = `${it.desc}|${it.valor}|${it.data}|${it.parc ? it.parc.N : ''}`;
    it.key = it.sec === 'encargo' ? `${fechamento}|${it.desc}|${it.valor}` : it.base + '|' + (it.parc ? it.parc.n : '');
  });
  marcarItens(itens, banco, fechamento);
  return { banco, fechamento, vencimento: iso(venc.a || ano, venc.m, venc.d), itens, soma, totalFatura, ignorados, futuros, revisao: itens.some(i => i.importado) };
}

// Pré-marca cada item: o que já foi lançado volta como estava (para revisar);
// o resto segue o que você marcou da última vez para o mesmo estabelecimento.
function marcarItens(itens, banco, fechamento) {
  const usados = new Set(), fixosUsados = new Set();
  itens.forEach((it, i) => {
    it.id = i;
    let ja = S.lanc.find(l => l.key === it.key);
    // compra lançada à mão antes da fatura fechar: usa a sua marcação e o seu nome/categoria
    const manual = !ja && banco ? S.lanc.find(l => !usados.has(l.id) && casaComFatura(l, it, banco)) : null;
    if (manual) { usados.add(manual.id); it.manual = manual.id; ja = manual; }
    const regra = S.regras[it.desc];
    it.importado = !!(ja && !ja.prevista && !ja.provisorio);
    it.escolha = ja ? (ja.share === 1 ? 'meu' : ja.share === 0.5 ? 'metade' : 'div')
      : regra ? regra.escolha : null;
    // já tinha sido importada e este item não virou lançamento: foi marcado "não é meu"
    if (!ja && !regra && S.faturas.some(f => f.itens.some(x => x.key === it.key))) it.escolha = 'nao';
    if (it.escolha === 'div') Object.assign(it, ja ? lerFracao(fracaoTxt(ja.share)) : { k: regra.k, n: regra.n });
    it.cat = ja ? ja.cat : regra && regra.cat ? regra.cat : palpiteCat(it.desc);
    // cobrança que já está em Fixos neste cartão (assinatura): não conta de novo
    if (!ja && banco && fechamento && it.sec === 'despesa') {
      const fx = S.fixos.find(f => !fixosUsados.has(f.id) && f.cartao === banco && f.tipo === 'despesa' && fixoAtivo(f, fechamento.slice(0, 7))
        && Math.abs(f.valor - it.valor) <= Math.max(1, f.valor * 0.05));
      if (fx) { fixosUsados.add(fx.id); it.fixo = fx.desc; it.escolha = 'nao'; it.cat = fx.cat; }
    }
  });
}

function reabrirFatura(id) {
  const f = S.faturas.find(f => f.id === id);
  const itens = f.itens.map(x => ({ ...x, parc: x.parc ? { ...x.parc } : null }));
  marcarItens(itens, f.banco, f.fechamento);
  imp = { ...f, itens, revisao: true };
}

function desfazerFatura(id) {
  const f = S.faturas.find(f => f.id === id);
  const keys = new Set(f.itens.map(i => i.key)), bases = f.itens.filter(i => i.parc).map(i => i.base + '|');
  S.lanc = S.lanc.filter(l => !keys.has(l.key) && !(l.prevista && bases.some(b => l.key.startsWith(b))));
  S.faturas = S.faturas.filter(x => x.id !== id);
  salvar();
}

const SHARE = { meu: 1, metade: 0.5, nao: 0 };
const fracao = it => it.escolha === 'div' ? it.k / it.n : SHARE[it.escolha] || 0;
const rotuloFracao = share => share === 1 ? '' : share === 0.5 ? ' · metade' : ` · ${fracaoTxt(share)} seu`;
// 0.6667 → "2/3"
function fracaoTxt(share) {
  for (let n = 2; n <= 12; n++) { const k = Math.round(share * n); if (Math.abs(k / n - share) < 0.001) return `${k}/${n}`; }
  return Math.round(share * 100) + '%';
}
function lerFracao(txt) {
  const m = String(txt || '').trim().match(/^(\d+)\s*\/\s*(\d+)$/);
  return m && +m[1] >= 1 && +m[1] < +m[2] && +m[2] <= 12 ? { k: +m[1], n: +m[2] } : null;
}
const r2 = v => Math.round(v * 100) / 100;

// Dia de fechamento do cartão: o que você informou, ou o da última fatura importada dele.
function diaFechamento(c) {
  if (S.diasFechamento[c]) return S.diasFechamento[c];
  const f = S.faturas.filter(f => f.banco === c).sort((a, b) => b.fechamento.localeCompare(a.fechamento))[0];
  return f ? +f.fechamento.slice(8) : null;
}
const dataNoMes = (ym, dia) => ym + '-' + String(Math.min(dia, 28)).padStart(2, '0');
// Mesma data se for dia útil; senão, o próximo dia útil (fim de semana ou feriado nacional)
function proxDiaUtil(iso) {
  const d = new Date(iso + 'T12:00');
  for (;;) {
    const s = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    if (d.getDay() !== 0 && d.getDay() !== 6 && !feriados(d.getFullYear()).has(s)) return s;
    d.setDate(d.getDate() + 1);
  }
}
// Data de fechamento do cartão no mês `ym` (com a regra do dia útil, se ligada para ele)
function fechamentoEm(c, ym) {
  const dia = diaFechamento(c);
  if (!dia) return null;
  return S.cartaoDiaUtil[c] ? proxDiaUtil(dataDia(ym, dia)) : dataNoMes(ym, dia);
}
const fechamentoAnterior = (c, fech) => fechamentoEm(c, addMes(fech.slice(0, 7), -1)) || addMes(fech.slice(0, 7), -1) + fech.slice(7);
// Data de fechamento da fatura em que cai uma compra feita em `data`
function fechamentoDaCompra(c, data) {
  const f = fechamentoEm(c, data.slice(0, 7));
  if (!f) return null;
  return data <= f ? f : fechamentoEm(c, addMes(data.slice(0, 7), 1));
}

// Compra no cartão lançada à mão: cada parcela vai para a fatura em que vai cair.
// Fica marcada "a conferir" até a fatura ser importada e trocar pela de verdade.
function lancarCompraCartao(f, valor, share) {
  const N = Math.max(1, +f.parcelas || 1);
  const vParc = r2(f.valorDe === 'parcela' ? valor : valor / N);
  const fech1 = fechamentoDaCompra(f.cartao, f.data);
  const compra = { id: uid(), data: f.data, N, valor: vParc };
  for (let k = 1; k <= N; k++) {

}

// A compra lançada à mão corresponde a este item da fatura? Mesmo cartão, mesma parcela,
// valor parecido (até 3% ou R$ 1) e data da compra até 5 dias de diferença.
function casaComFatura(l, it, banco) {

// "15, 30" | "15 e 30" | "5" → [15, 30]
const lerDias = t => [...new Set(String(t || '').split(/[^\d]+/).map(Number).filter(d => d >= 1 && d <= 31))].sort((a, b) => a - b);
const textoDias = ds => 'dia ' + ds.join(ds.length === 2 ? ' e ' : ', ');
// Campo "Dia(s) do mês": dias fixos e/ou "Nº dia útil" ("5º dia útil", "5du").
// Cada parte pode ter percentual: "15 (40%), 30" = 40% no dia 15 e o resto no 30.
// pct guarda os percentuais informados: { d15: 40, u5: 60 } (d = dia do mês, u = dia útil).
const RE_UTIL = /(\d{1,2})\s*[ºo°]?\s*(?:du\b|d\.u\.?|dias?\s+[úu]t(?:il|eis)\b|[úu]t(?:il|eis)\b)/i;
function lerAgenda(t) {
  const dias = [], uteis = [], pct = {};
  for (let parte of String(t || '').split(/[,;]|\s+e\s+/i)) {
    let p = null;
    parte = parte.replace(/(\d{1,3}(?:\.\d+)?)\s*%/, (_, v) => { p = +v; return ' '; });
    const u = parte.match(RE_UTIL);
    const d = !u && parte.match(/\d{1,2}/);
    const chave = u && +u[1] >= 1 && +u[1] <= 23 ? 'u' + u[1] : d && +d[0] >= 1 && +d[0] <= 31 ? 'd' + +d[0] : null;
    if (!chave) continue;
    (chave[0] === 'u' ? uteis : dias).push(+chave.slice(1));
    if (p !== null && p > 0 && p <= 100) pct[chave] = p;
  }
  const ord = a => [...new Set(a)].sort((x, y) => x - y);
  return { dias: ord(dias), uteis: ord(uteis), pct };
}
const rotuloPct = (f, chave) => f.pct && f.pct[chave] ? ` (${String(f.pct[chave]).replace('.', ',')}%)` : '';
const textoAgenda = f => [...(f.uteis || []).map(n => `${n}º dia útil${rotuloPct(f, 'u' + n)}`), ...(f.dias || []).map(d => `dia ${d}${rotuloPct(f, 'd' + d)}`)].join(', ');
const campoAgenda = f => [...(f.uteis || []).map(n => `${n}º dia útil${rotuloPct(f, 'u' + n)}`), ...(f.dias || []).map(d => `${d}${rotuloPct(f, 'd' + d)}`)].join(', ');
// Fração do valor em cada parte: o percentual informado; quem não tem, divide o que sobrou.
function fracoesAgenda(f) {
  const chaves = [...(f.uteis || []).map(n => 'u' + n), ...(f.dias || []).map(d => 'd' + d)];
  const pct = f.pct || {}, usado = chaves.reduce((a, c) => a + (pct[c] || 0), 0);
  const livres = chaves.filter(c => !pct[c]).length;
  return Object.fromEntries(chaves.map(c => [c, pct[c] ? pct[c] / 100 : livres ? Math.max(0, 1 - usado / 100) / livres : 0]));
}

// Feriados nacionais (bancos fechados): datas fixas + Carnaval, Sexta-feira Santa e Corpus Christi.
function pascoa(ano) {
  const a = ano % 19, b = Math.floor(ano / 100), c = ano % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  return new Date(ano, Math.floor((h + l - 7 * m + 114) / 31) - 1, ((h + l - 7 * m + 114) % 31) + 1);
}
const _feriados = {};
function feriados(ano) {
  if (_feriados[ano]) return _feriados[ano];
  const fmtD = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const p = pascoa(ano), mais = n => { const d = new Date(p); d.setDate(d.getDate() + n); return fmtD(d); };
  const fixos = ['01-01', '04-21', '05-01', '09-07', '10-12', '11-02', '11-15', '11-20', '12-25'].map(md => `${ano}-${md}`);
  return _feriados[ano] = new Set([...fixos, mais(-48), mais(-47), mais(-2), mais(60)]);
}
// N-ésimo dia útil do mês (segunda a sexta, sem feriado nacional)
function diaUtil(ym, n) {

  for (let dia = 1, conta = 0; dia <= 31; dia++) {
    const d = new Date(y, m - 1, dia);
    if (d.getMonth() !== m - 1) break;
    const iso = `${ym}-${String(dia).padStart(2, '0')}`;
    if (d.getDay() !== 0 && d.getDay() !== 6 && !fer.has(iso) && ++conta === n) return iso;
  }

}
// dia 30/31 em mês curto cai no último dia do mês
const dataDia = (ym, dia) => { const [y, m] = ym.split('-').map(Number); return ym + '-' + String(Math.min(dia, new Date(y, m, 0).getDate())).padStart(2, '0'); };

function diaVencimento(c) {
  if (S.diasVencimento[c]) return S.diasVencimento[c];
  const f = S.faturas.filter(f => f.banco === c).sort((a, b) => b.fechamento.localeCompare(a.fechamento))[0];
  return f ? +f.vencimento.slice(8) : null;
}
// vencimento da fatura que fecha em `fech`: no mesmo mês se o dia vem depois do fechamento, senão no seguinte
function vencimentoDe(c, fech) {
  const dv = diaVencimento(c);
  if (!dv) return null;
  const v = dataDia(dv > +fech.slice(8) ? fech.slice(0, 7) : addMes(fech.slice(0, 7), 1), dv);
  return S.cartaoDiaUtil[c] ? proxDiaUtil(v) : v;
}
// Sua parte da fatura do cartão `c` que fecha em `fech`: lançamentos do período + fixos no cartão
function valorFatura(c, fech) {
  const ant = fechamentoAnterior(c, fech);
  const lancs = S.lanc.filter(l => l.cartao === c && l.tipo === 'despesa' && l.data > ant && l.data <= fech).reduce((a, l) => a + l.valor, 0);
  const fixos = S.fixos.filter(f => f.cartao === c && f.tipo === 'despesa' && fixoAtivo(f, fech.slice(0, 7))).reduce((a, f) => a + f.valor, 0);
  return r2(lancs + fixos);

const fimDoMes = ym => dataDia(ym, 31);
// Entradas e saídas com data entre `ini` (exclusive) e `fim`: salários e contas fixas nos dias
// configurados, faturas no vencimento e lançamentos sem cartão (Pix/débito) planejados.
// O que já passou (até hoje) está no saldo atual, por isso nunca entra aqui.
function eventos(ini, fim) {
  const dentro = d => d > ini && d <= fim;
  const ev = [];
  const meses = [-1, 0, 1, 2].map(k => addMes(mesAtual(), k));
  for (const m of meses) {
    for (const f of S.fixos) {
      if (f.cartao || !(f.dias || f.uteis) || !fixoAtivo(f, m)) continue;
      const fr = fracoesAgenda(f);
      const datas = [...(f.uteis || []).map(n => [diaUtil(m, n), fr['u' + n]]), ...(f.dias || []).map(d => [dataDia(m, d), fr['d' + d]])]
        .filter(([d]) => d).sort((a, b) => a[0].localeCompare(b[0]));
      datas.forEach(([data, parte]) => {
        if (dentro(data) && parte > 0) ev.push({ data, desc: f.desc + (datas.length > 1 ? ` (${Math.round(parte * 100)}%)` : ''), valor: (f.tipo === 'receita' ? 1 : -1) * r2(f.valor * parte), tag: f.tipo === 'receita' ? 'entrada' : 'conta fixa' });

  S.lanc.filter(l => !l.cartao && dentro(l.data)).forEach(l => ev.push({ data: l.data, desc: l.desc, valor: (l.tipo === 'receita' ? 1 : -1) * l.valor, tag: 'planejado' }));
  return ev.sort((a, b) => a.data.localeCompare(b.data) || b.valor - a.valor);
}
// Próximos `dias` dias com o saldo dia a dia a partir do saldo atual
function agenda(dias = 30) {
  const d = new Date(); d.setDate(d.getDate() + dias);
  const ev = eventos(hoje(), d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'));
  let saldo = S.saldoAtual;
  ev.forEach(e => e.saldo = saldo = r2(saldo + e.valor));
  return ev;
}

const ddmm = d => d.split('-').reverse().slice(0, 2).join('/');

// Ao informar o saldo de hoje, compara com o esperado: saldo anterior + o que estava previsto
// entre as duas datas (salários, contas, faturas, Pix planejados). A diferença é o que entrou
// ou saiu sem estar registrado.
function informarSaldo(novo) {
  const c = S.conferencia;
  // corrigindo no mesmo dia: compara de novo a partir da mesma base
  const base = c && c.ate === hoje() ? { saldo: c.anterior, data: c.de }
    : S.saldoData && S.saldoData < hoje() ? { saldo: S.saldoAtual, data: S.saldoData } : null;
  if (base) {
    const ev = eventos(base.data, hoje());
    const entradas = r2(ev.filter(e => e.valor > 0).reduce((a, e) => a + e.valor, 0));
    const saidas = r2(-ev.filter(e => e.valor < 0).reduce((a, e) => a + e.valor, 0));
    const esperado = r2(base.saldo + entradas - saidas);
    S.conferencia = { de: base.data, ate: hoje(), anterior: base.saldo, entradas, saidas, esperado, informado: novo, diff: r2(novo - esperado) };
  }
  S.saldoAtual = novo; S.saldoData = hoje();

}

function campoSaldo() {
  const dias = S.saldoData ? Math.round((new Date(hoje()) - new Date(S.saldoData)) / 864e5) : null;

function confirmarImportacao() {

    const manual = it.manual && S.lanc.find(l => l.id === it.manual);
    if (manual) {
      const c = manual.compra;
      S.lanc = S.lanc.filter(l => l !== manual && !(l.provisorio && l.compra.id === c.id && (it.escolha === 'nao' || impFuturas) && l.compra.n > c.n));
    }

      S.lanc = S.lanc.filter(l => l.key !== it.key && !(l.prevista && l.key.startsWith(it.base + '|')));

    }
    const share = fracao(it);
    const data = it.sec === 'despesa' && impModo === 'compra' ? it.data : imp.fechamento;
    const desc = it.desc + (it.parc ? ` (${it.parc.n}/${it.parc.N})` : '') + rotuloFracao(share);
    S.lanc = S.lanc.filter(l => l.key !== it.key);
    S.lanc.push({ id: uid(), tipo: 'despesa', data, desc, cat: it.cat || 'Outros', valor: r2(it.valor * share), share, key: it.key, origem: 'fatura', cartao: imp.banco, parcela: !!it.parc });
    novos++;
    if (it.parc && impFuturas) {
      for (let k = it.parc.n + 1; k <= it.parc.N; k++) {
        const key = it.base + '|' + k;
        S.lanc = S.lanc.filter(l => l.key !== key);
        S.lanc.push({ id: uid(), tipo: 'despesa', data: addMes(imp.fechamento.slice(0, 7), k - it.parc.n) + '-' + imp.fechamento.slice(8), desc: `${it.desc} (${k}/${it.parc.N})` + rotuloFracao(share), cat: it.cat || 'Outros', valor: r2(it.valor * share), share, key, origem: 'fatura', cartao: imp.banco, parcela: true, prevista: true });
        futuras++;
      }
    }
    if (it.cat && !S.cats.includes(it.cat)) S.cats.push(it.cat);
  }
  // guarda a fatura para poder revisar depois sem o PDF
  const id = imp.banco + '|' + imp.fechamento;
  S.faturas = S.faturas.filter(f => f.id !== id).concat({
    id, banco: imp.banco, fechamento: imp.fechamento, vencimento: imp.vencimento,
    itens: imp.itens.map(({ sec, data, desc, parc, valor, base, key }) => ({ sec, data, desc, parc, valor, base, key })),
  });
  const mes = imp.fechamento.slice(0, 7), revisao = imp.revisao;
  imp = null; aba = 'visao'; mesSel = mes;
  salvar();
  alert(revisao ? `Fatura corrigida: ${novos} lançamentos seus nesta fatura.` : `${novos} lançamentos importados` + (futuras ? ` e ${futuras} parcelas futuras planejadas.` : '.'));
}

// ---------- editar lançamento ----------
// Descrição sem os sufixos que o app acrescenta: " (2/10)" e " · metade" / " · 2/3 seu"
const descBase = d => d.replace(/ · (metade|\d+\/\d+ seu|\d+% seu)$/, '').replace(/ \(\d+\/\d+\)$/, '');
const sufixoParcela = d => (d.replace(/ · (metade|\d+\/\d+ seu|\d+% seu)$/, '').match(/ \(\d+\/\d+\)$/) || [''])[0];
// Outras parcelas da mesma compra (lançada à mão ou vinda da fatura)
function parcelasIrmas(l) {
  if (l.provisorio && l.compra && l.compra.N > 1) return S.lanc.filter(x => x.provisorio && x.compra && x.compra.id === l.compra.id);
  if (l.parcela && l.key) { const base = l.key.slice(0, l.key.lastIndexOf('|') + 1); return S.lanc.filter(x => x.parcela && x.key && x.key.startsWith(base)); }
  return [l];
}
const OPCOES_PARTE = [[1, 'Tudo'], [1 / 2, 'Metade'], [2 / 3, '2/3'], [1 / 3, '1/3'], [3 / 4, '3/4'], [1 / 4, '1/4']];

function abrirEdicao(id) {
  const l = S.lanc.find(l => l.id === id);
  const share = l.share || 1, irmas = parcelasIrmas(l);
  const opcoes = OPCOES_PARTE.some(([v]) => Math.abs(v - share) < 0.001) ? OPCOES_PARTE : OPCOES_PARTE.concat([[share, fracaoTxt(share)]]);
  const dlg = document.getElementById('dlg');
  dlg.innerHTML = `<form id="f-edit" method="dialog">
    <h2>${ico('lapis')} Editar lançamento</h2>
    <div class="row">
      <label>Tipo<select name="tipo"><option value="despesa" ${l.tipo === 'despesa' ? 'selected' : ''}>Despesa</option><option value="receita" ${l.tipo === 'receita' ? 'selected' : ''}>Receita</option></select></label>
      <label>Data<input type="date" name="data" value="${l.data}" required></label>
      <label style="flex-basis:100%">Descrição<input name="desc" value="${esc(descBase(l.desc))}" required></label>
      <label>Categoria<input name="cat" list="cats" value="${esc(l.cat)}" required></label>
      <label>Cartão<select name="cartao">${opcoesCartao(l.cartao || SEM_CARTAO)}</select></label>
      <label>Valor total${irmas.length > 1 ? ' da parcela' : ''} (R$)<input name="valor" inputmode="decimal" value="${String(r2(Math.abs(l.valor) / share)).replace('.', ',')}" required></label>
      <label>Sua parte<select name="parte">${opcoes.map(([v, t]) => `<option value="${v}" ${Math.abs(v - share) < 0.001 ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
    </div>
    <p class="hint">Sua parte: <b id="edit-parte">${fmt.format(Math.abs(l.valor))}</b></p>
    ${irmas.length > 1 ? `<label class="hint" style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" name="todas" checked> Aplicar a todas as ${irmas.length} parcelas desta compra (a data de cada uma não muda)</label>` : ''}
    ${l.origem === 'fatura' ? `<p class="hint">Veio de uma fatura. Se você revisar a fatura depois, o que for marcado lá substitui esta edição.</p>` : ''}
    <div class="row" style="justify-content:flex-end;margin-top:16px">
      <button type="button" class="btn" id="edit-cancelar">Cancelar</button>
      <button class="btn primary" value="${l.id}">Salvar</button>
    </div>
  </form>`;
  dlg.showModal();
}

function salvarEdicao(f, id) {
  const l = S.lanc.find(l => l.id === id), total = num(f.valor), share = +f.parte;
  if (!(total > 0)) return alert('Informe um valor maior que zero.');
  const sinal = l.valor < 0 ? -1 : 1, base = f.desc.trim();
  const alvo = f.todas ? parcelasIrmas(l) : [l];
  for (const x of alvo) {
    Object.assign(x, { tipo: f.tipo, cat: f.cat.trim(), share, valor: sinal * r2(total * share), desc: base + sufixoParcela(x.desc) + rotuloFracao(share) });
    if (f.cartao) x.cartao = f.cartao; else delete x.cartao;
    if (x.compra) x.compra.valor = total;
  }
  l.data = f.data;   // a data só muda no lançamento aberto
  document.getElementById('dlg').close();
  salvar();
}

function abrirEdicaoFixo(id) {
  const x = S.fixos.find(f => f.id === id);
  const dlg = document.getElementById('dlg');
  dlg.innerHTML = `<form id="f-edit-fixo" method="dialog">
    <h2>${ico('lapis')} Editar item fixo</h2>
    <div class="row">
      <label>Tipo<select name="tipo"><option value="despesa" ${x.tipo === 'despesa' ? 'selected' : ''}>Despesa</option><option value="receita" ${x.tipo === 'receita' ? 'selected' : ''}>Receita</option></select></label>
      <label style="flex:2 1 200px">Descrição<input name="desc" value="${esc(x.desc)}" required></label>
      <label>Categoria<input name="cat" list="cats" value="${esc(x.cat)}" required></label>
      <label>Valor por mês (R$)<input name="valor" inputmode="decimal" value="${String(x.valor).replace('.', ',')}" required></label>
      <label>Cartão<select name="cartao">${opcoesCartao(x.cartao || SEM_CARTAO)}</select></label>
      <label>Dia(s) do mês<input name="dias" value="${campoAgenda(x)}" placeholder="ex.: 10 · 15 (40%), 30 · 5º dia útil"></label>
      <label>Começa em<input type="month" name="inicio" value="${x.inicio}" required></label>
      <label>Termina em<input type="month" name="fim" value="${x.fim || ''}"></label>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:16px">
      <button type="button" class="btn" id="edit-cancelar">Cancelar</button>
      <button class="btn primary" value="${x.id}">Salvar</button>
    </div>
  </form>`;
  dlg.showModal();
}

// ---------- render ----------
function render() {
  const sel = document.getElementById('mes');
  const meses = new Set([mesAtual(), mesSel]);
  for (let i = -12; i <= 12; i++) meses.add(addMes(mesAtual(), i));
  S.lanc.forEach(l => meses.add(l.data.slice(0, 7)));
  sel.innerHTML = [...meses].sort().reverse().map(m => `<option value="${m}" ${m === mesSel ? 'selected' : ''}>${nomeMes(m)}${m === mesAtual() ? ' (atual)' : ''}</option>`).join('');
  sel.style.visibility = ['proj', 'dados', 'fixos', 'fatura'].includes(aba) ? 'hidden' : '';
  document.getElementById('cats').innerHTML = catsUsadas().map(c => `<option value="${esc(c)}">`).join('');
  document.getElementById('tabs').innerHTML = ABAS.map(([id, nome, icone, curto]) => `<button data-t="${id}" class="${id === aba ? 'on' : ''}">${ico(icone)}<span class="longo">${nome}</span><span class="curto">${curto}</span></button>`).join('');
  const app = document.getElementById('app');
  app.innerHTML = { visao: telaVisao, lanc: telaLanc, fixos: telaFixos, orc: telaOrc, proj: telaProj, dados: telaDados, fatura: telaFatura }[aba]();
  if (aba === 'visao') { const h = []; for (let i = 5; i >= 0; i--) h.push(addMes(mesSel, -i)); barrasHistorico(document.getElementById('hist'), h); }
  if (aba === 'proj') linhaSaldo(document.getElementById('proj'), projecao().linhas);
}

// ---------- eventos ----------
document.getElementById('logo').innerHTML = ico('carteira');
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (b) { aba = b.dataset.t; render(); window.scrollTo(0, 0); } });
document.getElementById('mes').addEventListener('change', e => { mesSel = e.target.value; render(); });

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  if (e.target.id === 'f-lanc') {
    const valor = num(f.valor); if (valor <= 0) return alert('Informe um valor maior que zero.');
    const fr = lerFracao(f.parte), share = fr ? fr.k / fr.n : 1;
    if (f.cartao && f.tipo === 'despesa') { lancarCompraCartao(f, valor, share); mesSel = f.data.slice(0, 7); salvar(); return; }
    S.lanc.push({ id: uid(), tipo: f.tipo, data: f.data, desc: f.desc.trim() + rotuloFracao(share), cat: f.cat.trim(), valor: r2(valor * share), share, ...(f.cartao ? { cartao: f.cartao } : {}) });
    mesSel = f.data.slice(0, 7);
  } else if (e.target.id === 'f-fixo') {
    const valor = num(f.valor); if (valor <= 0) return alert('Informe um valor maior que zero.');
    const { dias, uteis, pct } = lerAgenda(f.dias);
    S.fixos.push({ id: uid(), tipo: f.tipo, desc: f.desc.trim(), cat: f.cat.trim(), valor, inicio: f.inicio, fim: f.fim || null, ...(f.cartao ? { cartao: f.cartao } : {}), ...(dias.length ? { dias } : {}), ...(uteis.length ? { uteis } : {}), ...(Object.keys(pct).length ? { pct } : {}) });
  } else if (e.target.id === 'f-edit') {
    return salvarEdicao(f, e.submitter.value);
  } else if (e.target.id === 'f-edit-fixo') {
    const x = S.fixos.find(x => x.id === e.submitter.value), valor = num(f.valor), { dias, uteis, pct } = lerAgenda(f.dias);
    if (!(valor > 0)) return alert('Informe um valor maior que zero.');
    if (f.fim && f.fim < f.inicio) return alert('"Termina em" não pode ser antes de "Começa em".');
    Object.assign(x, { tipo: f.tipo, desc: f.desc.trim(), cat: f.cat.trim(), valor, inicio: f.inicio, fim: f.fim || null });
    if (f.cartao) x.cartao = f.cartao; else delete x.cartao;
    if (dias.length) x.dias = dias; else delete x.dias;
    if (uteis.length) x.uteis = uteis; else delete x.uteis;
    if (Object.keys(pct).length) x.pct = pct; else delete x.pct;
    document.getElementById('dlg').close();
  } else if (e.target.id === 'f-sync') {
    conectarSync(f.token.trim(), f.repo.trim().replace(/^https:\/\/github\.com\//, '').replace(/\/$/, ''));
    return;
  } else if (e.target.id === 'f-cat') {
    const c = f.cat.trim(); if (c && !S.cats.includes(c)) S.cats.push(c);
  }
  salvar();
});

document.addEventListener('click', e => {
  const d = e.target.dataset || {};
  if (d.delLanc) { S.lanc = S.lanc.filter(l => l.id !== d.delLanc); salvar(); }
  if (d.delFixo && confirm('Excluir este item fixo de todos os meses?')) { S.fixos = S.fixos.filter(f => f.id !== d.delFixo); salvar(); }
  if (d.encerrar) { const f = S.fixos.find(f => f.id === d.encerrar); f.fim = mesAtual(); salvar(); }
  const ch = e.target.closest('[data-cartao]');
  if (ch) { cartaoSel = ch.dataset.cartao === '*' ? null : ch.dataset.cartao; if (aba !== 'lanc') aba = 'visao'; render(); return; }
  if (d.esc === 'div') {
    const it = imp.itens[d.it];
    const resp = prompt('Quanto desta compra é seu? Ex.: 2/3 (dividido em 3, duas partes suas), 1/3, 1/4', it.escolha === 'div' ? `${it.k}/${it.n}` : '2/3');
    const f = lerFracao(resp);
    if (f) { Object.assign(it, f, { escolha: 'div' }); render(); }
    else if (resp !== null) alert('Use o formato partes suas/total, por exemplo 2/3.');
  } else if (d.esc) { imp.itens[d.it].escolha = d.esc; render(); }
  if (d.todos) { imp.itens.forEach(i => { if (!i.escolha) i.escolha = d.todos; }); render(); }
  if (d.revisar) { reabrirFatura(d.revisar); render(); window.scrollTo(0, 0); }
  if (d.desfazer && confirm('Desfazer esta importação? Todos os lançamentos desta fatura (e as parcelas planejadas dela) serão apagados.')) desfazerFatura(d.desfazer);
  if (e.target.closest('[data-conf-saldo]')) informarSaldo(num(document.getElementById('saldo').value));
  if (d.conf === 'registrar') {
    const c = S.conferencia;
    S.lanc.push({ id: uid(), tipo: c.diff < 0 ? 'despesa' : 'receita', data: c.ate, desc: `Não registrado (${ddmm(c.de)} a ${ddmm(c.ate)})`, cat: 'Outros', valor: Math.abs(c.diff), naoIdentificado: true });
    c.resolvida = true; salvar();
  }
  if (d.conf === 'ignorar') { S.conferencia.resolvida = true; salvar(); }
  if (d.ir === 'saldo') { aba = 'visao'; mesSel = mesAtual(); cartaoSel = null; render(); const i = document.getElementById('saldo'); i.scrollIntoView({ block: 'center' }); i.focus(); }
  if (d.ir === 'fatura') { aba = 'fatura'; imp = null; render(); }
  if (d.ir === 'fixos') { aba = 'fixos'; render(); }
  const ed = e.target.closest('[data-edit-lanc]');
  if (ed) abrirEdicao(ed.dataset.editLanc);
  const edf = e.target.closest('[data-edit-fixo]');
  if (edf) abrirEdicaoFixo(edf.dataset.editFixo);
  if (e.target.id === 'imp-cancelar') { imp = null; render(); }
  if (e.target.id === 'edit-cancelar') document.getElementById('dlg').close();
  if (e.target.id === 'imp-ok') {
    const pend = imp.itens.filter(i => !i.escolha).length;
    if (!pend || confirm(`${pend} itens ainda não foram marcados e não serão importados. Continuar?`)) confirmarImportacao();
  }
  if (e.target.id === 'sync-agora') puxar();
  if (e.target.id === 'sync-sair' && confirm('Desconectar este aparelho? Os dados continuam salvos aqui e na nuvem.')) {
    sync = null; statusSync('');
    try { localStorage.removeItem(SYNC_KEY); } catch (err) {}
    render();
  }
  if (e.target.id === 'exportar') {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }));
    a.download = 'financas-' + hoje() + '.json'; a.click();
  }
  if (e.target.id === 'zerar' && confirm('Apagar todos os dados? Isso não pode ser desfeito (a não ser que você tenha um backup).')) { S = novoEstado(); salvar(); }
  if (e.target.id === 'exemplo' && (!S.lanc.length && !S.fixos.length || confirm('Substituir seus dados pelos de exemplo?'))) { S = exemplo(); salvar(); }
});

document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.orc !== undefined) {
    const v = num(e.target.value);
    if (v > 0) S.orc[e.target.dataset.orc] = v; else delete S.orc[e.target.dataset.orc];
    salvar();
  }
  if (e.target.dataset && e.target.dataset.catIt !== undefined) imp.itens[e.target.dataset.catIt].cat = e.target.value.trim();
  if (e.target.id === 'imp-modo') impModo = e.target.value;
  if (e.target.id === 'imp-futuras') impFuturas = e.target.checked;
  if (e.target.id === 'pdf-fatura' && e.target.files[0]) {
    const st = document.getElementById('pdf-status');
    st.textContent = 'Lendo a fatura…';
    e.target.files[0].arrayBuffer().then(linhasDoPdf).then(l => { imp = lerFatura(l); render(); })
      .catch(err => { st.innerHTML = `<span class="neg">${esc(err.message)}</span>`; });
  }
  if (e.target.dataset && e.target.dataset.utilCartao !== undefined) {
    if (e.target.checked) S.cartaoDiaUtil[e.target.dataset.utilCartao] = true; else delete S.cartaoDiaUtil[e.target.dataset.utilCartao];
    salvar();
  }
  if (e.target.dataset && e.target.dataset.diaVenc !== undefined) {
    const d = parseInt(e.target.value, 10);
    if (d >= 1 && d <= 31) S.diasVencimento[e.target.dataset.diaVenc] = d; else delete S.diasVencimento[e.target.dataset.diaVenc];
    salvar();
  }
  if (e.target.dataset && e.target.dataset.diaFech !== undefined) {
    const d = parseInt(e.target.value, 10);
    if (d >= 1 && d <= 31) S.diasFechamento[e.target.dataset.diaFech] = d; else delete S.diasFechamento[e.target.dataset.diaFech];
    salvar();
  }
  if (e.target.id === 'saldo') informarSaldo(num(e.target.value));
  if (e.target.id === 'horiz') { S.horizonte = +e.target.value; salvar(); }
  if (e.target.id === 'ajuste') { S.ajuste = +e.target.value; salvar(); }
  if (e.target.id === 'importar' && e.target.files[0]) {
    e.target.files[0].text().then(t => {
      try { const d = JSON.parse(t); if (!Array.isArray(d.lanc)) throw 0; S = normalizar(d); salvar(); alert('Dados importados.'); }
      catch (err) { alert('Arquivo inválido.'); }
    });
  }
});
document.addEventListener('input', e => {
  const fe = e.target.form;
  if (fe && fe.id === 'f-edit') document.getElementById('edit-parte').textContent = fmt.format(r2(num(fe.valor.value) * +fe.parte.value)); if (e.target.id === 'ajuste') document.getElementById('aj-lbl').textContent = (e.target.value > 0 ? '+' : '') + e.target.value + '%'; });

let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 150); });
// ao voltar para o app (ex.: depois de usar no celular), busca o que mudou
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !timerEnvio) puxar(); });
window.addEventListener('beforeunload', e => { if (timerEnvio) { enviar(); e.preventDefault(); } });

function exemplo() {
  const s = novoEstado(), m0 = mesAtual();
  s.saldoAtual = 4200;
  s.fixos = [
    { id: uid(), tipo: 'receita', desc: 'Salário', cat: 'Salário', valor: 6500, inicio: addMes(m0, -6), fim: null, dias: [15, 30] },
    { id: uid(), tipo: 'despesa', desc: 'Aluguel', cat: 'Moradia', valor: 1800, inicio: addMes(m0, -6), fim: null, dias: [10] },
    { id: uid(), tipo: 'despesa', desc: 'Internet + celular', cat: 'Moradia', valor: 180, inicio: addMes(m0, -6), fim: null },
    { id: uid(), tipo: 'despesa', desc: 'Streaming', cat: 'Assinaturas', valor: 75, inicio: addMes(m0, -6), fim: null },
    { id: uid(), tipo: 'despesa', desc: 'Notebook (parcela)', cat: 'Compras', valor: 420, inicio: addMes(m0, -3), fim: addMes(m0, 6) },
  ];
  const vars = [['Mercado', 'Mercado', 900], ['iFood', 'Alimentação', 380], ['Uber', 'Transporte', 260], ['Cinema e bares', 'Lazer', 320], ['Farmácia', 'Saúde', 110]];
  for (let i = 5; i >= 0; i--) {
    const m = addMes(m0, -i);
    vars.forEach(([desc, cat, v], k) => {
      const dia = String(Math.min(28, 3 + k * 5)).padStart(2, '0');
      if (m === m0 && +dia > +hoje().slice(8)) return;
      s.lanc.push({ id: uid(), tipo: 'despesa', data: m + '-' + dia, desc, cat, valor: Math.round(v * (0.8 + Math.random() * 0.45)), ...(k < 4 ? { cartao: k % 2 ? 'Santander' : 'Itaú' } : {}) });
    });
  }
  s.lanc.push({ id: uid(), tipo: 'receita', data: addMes(m0, -2) + '-15', desc: 'Freela site', cat: 'Freelance', valor: 1200 });
  s.lanc.push({ id: uid(), tipo: 'despesa', data: addMes(m0, 3) + '-10', desc: 'IPVA', cat: 'Transporte', valor: 1600 });
  s.orc = { Mercado: 1000, 'Alimentação': 350, Transporte: 300, Lazer: 300, 'Saúde': 150 };
  return s;
}

render();
puxar();
</script>
