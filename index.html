// ---------- dados faltando ----------
function pendencias() {
  const p = [];
  const dias = S.saldoData ? Math.round((new Date(hoje()) - new Date(S.saldoData)) / 864e5) : null;
  if (dias === null) p.push({ txt: 'Saldo na conta de hoje nunca foi informado: a agenda e a projeção partem dele.', acao: 'saldo', botao: 'Informar' });
  else if (dias > 3) p.push({ txt: `Saldo atualizado há ${dias} dias.`, acao: 'saldo', botao: 'Atualizar' });
  for (const c of cartoesUsados()) {
    const falta = [!melhorDia(c) && 'melhor dia de compra', !diaVencimento(c) && 'vencimento'].filter(Boolean);
    if (falta.length) p.push({ txt: `${c} sem dia de ${falta.join(' e ')}: a fatura não aparece na agenda nem no "ainda vai sair".`, acao: 'fatura', botao: 'Informar' });
  }
  for (const f of S.fixos) {
    if (f.fim && f.fim < mesAtual()) continue;
    if (f.inicio > mesAtual()) { if (!f.inicioOk) p.push({ txt: `"${f.desc}" só conta a partir de ${nomeMes(f.inicio)}; em ${nomeMes(mesAtual())} ele não entra.`, edit: f.id, botao: 'Editar', certo: f.id }); }
    else if (!f.cartao && !f.dias && !f.uteis) p.push({ txt: `"${f.desc}" está sem dia do mês: fica fora da agenda e do que ainda falta.`, edit: f.id, botao: 'Pôr o dia' });
  }
  // meses com gastos e nenhuma receita: a sobra deles aparece negativa só por falta de informação

// Quanto da fatura do cartão que fecha em `fech` é de outra pessoa (sua mãe): a parte que não é sua
// das compras divididas, as compras da fatura importada marcadas "não é meu" e a diferença do valor informado.
function parteOutros(c, fech) {
  const venc = vencimentoDe(c, fech);
  let v = 0;
  for (const l of S.lanc) if (l.cartao === c && l.tipo === 'despesa' && l.share && l.share < 1 && vencDoLanc(l) === venc) v += l.valor / l.share - l.valor;
  for (const f of S.faturas) {
    if (f.banco !== c || (S.cartaoDiaUtil[c] ? proxDiaUtil(f.vencimento) : f.vencimento) !== venc) continue;
    for (const it of f.itens) if (!S.lanc.some(l => l.key === it.key && !l.prevista)) v += it.valor;
  }
  const info = S.infoFatura[c];
  if (info && info.fech === fech && info.total > info.minha) v += info.total - info.minha;
  return r2(v);
}
const NOME_OUTRO = 'mãe';
const textoOutros = (meu, outros) => outros >= 0.01 ? `seu ${fmt.format(meu)} · ${NOME_OUTRO} ${fmt.format(outros)}` : '';

function confirmarImportacao() {
  let novos = 0, futuras = 0;
  for (const it of imp.itens) {
    if (it.escolha) S.regras[it.desc] = { escolha: it.escolha, cat: it.cat, ...(it.escolha === 'div' ? { k: it.k, n: it.n } : {}) };
    if (!it.escolha) continue;   // sem marcação: não mexe no que já existe
    const manual = it.manual && S.lanc.find(l => l.id === it.manual);
    if (manual) {
      const c = manual.compra;
      S.lanc = S.lanc.filter(l => l !== manual && !(l.provisorio && l.compra.id === c.id && (it.escolha === 'nao' || impFuturas) && l.compra.n > c.n));
    }
    if (it.escolha === 'nao') {
      // não é seu: tira o lançamento (se já existia) e as parcelas planejadas dele
      S.lanc = S.lanc.filter(l => l.key !== it.key && !(l.prevista && l.key.startsWith(it.base + '|')));
      continue;
    }
    const share = fracao(it);
    const data = it.sec === 'despesa' && impModo === 'compra' ? it.data : imp.fechamento;
    const desc = it.desc + (it.parc ? ` (${it.parc.n}/${it.parc.N})` : '') + rotuloFracao(share);
    S.lanc = S.lanc.filter(l => l.key !== it.key && !(l.prevista && l.key && it.parc && mesmaParcela(l, { cartao: imp.banco, key: it.key })));
    S.lanc.push({ id: uid(), tipo: 'despesa', data, desc, cat: it.cat || 'Outros', valor: r2(it.valor * share), share, key: it.key, origem: 'fatura', cartao: imp.banco, parcela: !!it.parc });
    novos++;
    if (it.parc && impFuturas) {
      for (let k = it.parc.n + 1; k <= it.parc.N; k++) {
        const key = it.base + '|' + k;
        S.lanc = S.lanc.filter(l => l.key !== key);
        S.lanc.push({ id: uid(), tipo: 'despesa', data: addMes(imp.fechamento.slice(0, 7), k - it.parc.n) + '-' + imp.fechamento.slice(8), desc: `${it.desc} (${k}/${it.parc.N})` + rotuloFracao(share), cat: it.cat || 'Outros', valor: r2(it.valor * share), share, key, origem: 'fatura', cartao: imp.banco, parcela: true, prevista: true });
        futuras++;
      }
    }
    if (it.cat && !S.cats.includes(it.cat)) S.cats.push(it.cat);
  }
  // a diferença informada pelo app do banco dá lugar às compras detalhadas desta fatura
  const pertoDoFech = d => Math.abs(new Date(d) - new Date(imp.fechamento)) <= 7 * 864e5;
  S.lanc = S.lanc.filter(l => !(l.agregado && l.cartao === imp.banco && pertoDoFech(l.fech)));
  if (S.infoFatura[imp.banco] && pertoDoFech(S.infoFatura[imp.banco].fech)) delete S.infoFatura[imp.banco];
  // guarda a fatura para poder revisar depois sem o PDF
  const id = imp.banco + '|' + imp.fechamento;
  S.faturas = S.faturas.filter(f => f.id !== id).concat({
    id, banco: imp.banco, fechamento: imp.fechamento, vencimento: imp.vencimento,
    itens: imp.itens.map(({ sec, data, desc, parc, valor, base, key }) => ({ sec, data, desc, parc, valor, base, key })),
  });
  const mes = imp.fechamento.slice(0, 7), revisao = imp.revisao;
  imp = null; aba = 'visao'; mesSel = mes;
  salvar();
  alert(revisao ? `Fatura corrigida: ${novos} lançamentos seus nesta fatura.` : `${novos} lançamentos importados` + (futuras ? ` e ${futuras} parcelas futuras planejadas.` : '.'));
}

// ---------- editar lançamento ----------
// Descrição sem os sufixos que o app acrescenta: " (2/10)" e " · metade" / " · 2/3 seu"
const descBase = d => d.replace(/ · (metade|\d+\/\d+ seu|\d+% seu)$/, '').replace(/ \(\d+\/\d+\)$/, '');
const sufixoParcela = d => (d.replace(/ · (metade|\d+\/\d+ seu|\d+% seu)$/, '').match(/ \(\d+\/\d+\)$/) || [''])[0];
// Outras parcelas da mesma compra (lançada à mão ou vinda da fatura)
function parcelasIrmas(l) {
  if (l.provisorio && l.compra && l.compra.N > 1) return S.lanc.filter(x => x.provisorio && x.compra && x.compra.id === l.compra.id);
  if (l.parcela && l.key) { const base = l.key.slice(0, l.key.lastIndexOf('|') + 1); return S.lanc.filter(x => x.parcela && x.key && x.key.startsWith(base)); }
  return [l];
}
const OPCOES_PARTE = [[1, 'Tudo'], [1 / 2, 'Metade'], [2 / 3, '2/3'], [1 / 3, '1/3'], [3 / 4, '3/4'], [1 / 4, '1/4']];

function abrirEdicao(id) {
  const l = S.lanc.find(l => l.id === id);

  const dlg = document.getElementById('dlg');
  dlg.innerHTML = `<form id="f-edit" method="dialog">
    <h2>${ico('lapis')} Editar lançamento</h2>
    <div class="row">
      <label>Tipo<select name="tipo"><option value="despesa" ${l.tipo === 'despesa' ? 'selected' : ''}>Despesa</option><option value="receita" ${l.tipo === 'receita' ? 'selected' : ''}>Receita</option></select></label>

      <label>Sua parte<select name="parte">${opcoes.map(([v, t]) => `<option value="${v}" ${Math.abs(v - share) < 0.001 ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
    </div>
    <p class="hint">Sua parte: <b id="edit-parte">${fmt.format(Math.abs(l.valor))}</b></p>
    ${irmas.length > 1 ? `<label class="hint" style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" name="todas" checked> Aplicar a todas as ${irmas.length} parcelas desta compra (a data de cada uma não muda)</label>` : ''}
    ${l.origem === 'fatura' ? `<p class="hint">Veio de uma fatura. Se você revisar a fatura depois, o que for marcado lá substitui esta edição.</p>` : ''}
    <div class="row" style="justify-content:flex-end;margin-top:16px">
      <button type="button" class="btn" id="edit-cancelar">Cancelar</button>
      <button class="btn primary" value="${l.id}">Salvar</button>
    </div>
  </form>`;
  dlg.showModal();
}

function salvarEdicao(f, id) {
  const l = S.lanc.find(l => l.id === id), total = num(f.valor), share = +f.parte;
  if (!(total > 0)) return alert('Informe um valor maior que zero.');
  const sinal = l.valor < 0 ? -1 : 1, base = f.desc.trim();
  const alvo = f.todas ? parcelasIrmas(l) : [l];
  for (const x of alvo) {
    Object.assign(x, { tipo: f.tipo, cat: f.cat.trim(), share, valor: sinal * r2(total * share), desc: base + sufixoParcela(x.desc) + rotuloFracao(share) });
    if (f.cartao) x.cartao = f.cartao; else delete x.cartao;
    if (x.compra) x.compra.valor = total;
  }
  l.data = f.data;   // a data só muda no lançamento aberto
  document.getElementById('dlg').close();
  salvar();
}

function salvarInfoFatura(f, c) {
  const total = num(f.total), minha = f.minha && f.minha.trim() ? num(f.minha) : total, fech = f.fech;
  if (!(total >= 0) || !(minha >= 0)) return alert('Informe o valor.');
  // tira a diferença anterior desta fatura antes de comparar de novo
  S.lanc = S.lanc.filter(l => !(l.agregado && l.cartao === c && l.fech === fech));
  const conhecido = valorFatura(c, fech), diff = r2(minha - conhecido);
  if (diff >= 0.01) S.lanc.push({ id: uid(), tipo: 'despesa', data: hoje() < fech ? hoje() : fech, desc: `Compras no ${c} até ${ddmm(hoje())} (valor do banco)`,
    cat: 'Outros', valor: diff, cartao: c, agregado: true, fech });
  S.infoFatura[c] = { fech, total, minha, data: hoje(), conhecido };
  document.getElementById('dlg').close();
  salvar();
  alert(diff >= 0.01 ? `O app já conhecia ${fmt.format(conhecido)} desta fatura. A diferença de ${fmt.format(diff)} foi lançada no ${c}.`
    : `O app já esperava ${fmt.format(conhecido)}, mais do que os ${fmt.format(minha)} do banco (algo ainda não foi cobrado). Nada foi lançado; vale a estimativa do app.`);
}

// ---------- busca ----------
// Procura em todos os lançamentos (descrição, categoria, cartão, data e valor), nos itens fixos,
// nas categorias, nos cartões e nas telas do app. Todas as palavras precisam aparecer (sem acento,
// sem diferenciar maiúsculas). O índice é refeito a cada render, quando os dados podem ter mudado.
const semAcento = t => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
let _indice = null;
function indiceBusca() {
  if (!_indice) _indice = S.lanc.map(l => ({ l, t: semAcento([l.desc, l.cat, l.cartao || 'pix debito', l.data.split('-').reverse().join('/'), fmt.format(l.valor), l.tipo].join(' ')) }));
  return _indice;
}
const ATALHOS = [['Novo lançamento', 'lanc', 'lista', 'adicionar despesa receita compra'], ['Importar fatura', 'fatura', 'envia', 'pdf cartao'],
  ['Informar saldo de hoje', 'saldo', 'carteira', 'conta conferir'], ['Projeção dos próximos meses', 'proj', 'grafico', 'futuro previsao'],
  ['Orçamento e limites', 'orc', 'alvo', 'limite categoria'], ['Itens fixos', 'fixos', 'repete', 'salario conta assinatura'], ['Dados e sincronização', 'dados', 'dados', 'backup github exportar']];
function buscar(q) {
  const tokens = semAcento(q).split(/\s+/).filter(Boolean);
  if (!tokens.length) return null;
  const casa = t => tokens.every(k => t.includes(k));
  const lanc = indiceBusca().filter(x => casa(x.t)).map(x => x.l).sort((a, b) => b.data.localeCompare(a.data));
  const fixos = S.fixos.filter(f => casa(semAcento([f.desc, f.cat, f.cartao || '', fmt.format(f.valor)].join(' '))));
  const cats = catsUsadas().filter(c => casa(semAcento(c)));
  const cartoes = cartoesUsados().filter(c => casa(semAcento(c)));
  const atalhos = ATALHOS.filter(a => casa(semAcento(a[0] + ' ' + a[3])));
  return { tokens, lanc, fixos, cats, cartoes, atalhos };
}
// Destaca as palavras buscadas no texto (o texto sem acento tem as mesmas posições do original)
function marcar(txt, tokens) {
  const base = semAcento(txt);
  if (base.length !== txt.length) return esc(txt);
  const on = new Array(txt.length).fill(false);
  for (const k of tokens) { let i = base.indexOf(k); while (i >= 0) { for (let j = i; j < i + k.length; j++) on[j] = true; i = base.indexOf(k, i + 1); } }
  let out = '', aberto = false;
  for (let i = 0; i < txt.length; i++) {
    if (on[i] !== aberto) { out += on[i] ? '<mark>' : '</mark>'; aberto = on[i]; }
    out += esc(txt[i]);
  }
  return out + (aberto ? '</mark>' : '');
}
const somaDesp = ls => r2(ls.reduce((a, l) => a + (l.tipo === 'despesa' ? l.valor : 0), 0));
function mostrarBusca(q) {
  const box = document.getElementById('busca-res'), r = buscar(q);
  if (!r) { box.hidden = true; box.innerHTML = ''; return; }
  const grupo = (titulo, extra, itens) => itens ? `<div class="bg"><div class="bg-t">${titulo}${extra ? `<span>${extra}</span>` : ''}</div>${itens}</div>` : '';
  const linha = (alvo, av, titulo, sub, valor) => `<button type="button" class="br" data-br="${esc(alvo)}">${av}<span class="br-t"><b>${titulo}</b><small>${sub}</small></span>${valor ? `<span class="br-v">${valor}</span>` : ''}</button>`;
  const avCat = c => `<span class="av-cat" style="--c:${corCategoria(c)}">${esc((c || '?').charAt(0).toUpperCase())}</span>`;
  const avIco = (icone, cor) => `<span class="av-cat" style="--c:${cor}">${ico(icone)}</span>`;
  const html =
    grupo('Lançamentos', r.lanc.length ? `${r.lanc.length} · ${fmt.format(somaDesp(r.lanc))} em gastos` : '', r.lanc.slice(0, 6).map(l => linha('lanc:' + l.id, avCat(l.cat), marcar(l.desc, r.tokens),
      `${l.data.split('-').reverse().join('/')} · ${marcar(l.cat, r.tokens)} · ${esc(nomeCartao(l.cartao || SEM_CARTAO))}`, `<span class="${l.tipo === 'receita' ? 'pos' : ''}">${l.tipo === 'receita' ? '+' : '−'} ${fmt.format(l.valor)}</span>`)).join(''))
    + grupo('Categorias', '', r.cats.slice(0, 4).map(c => { const ls = S.lanc.filter(l => l.cat === c); return linha('cat:' + c, avCat(c), marcar(c, r.tokens), `${ls.length} lançamentos`, fmt.format(somaDesp(ls))); }).join(''))
    + grupo('Cartões', '', r.cartoes.slice(0, 4).map(c => { const ls = S.lanc.filter(l => l.cartao === c); return linha('cartao:' + c, avIco('cartao', corCartao(c)), marcar(c, r.tokens), `${ls.length} lançamentos`, fmt.format(somaDesp(ls))); }).join(''))
    + grupo('Fixos', '', r.fixos.slice(0, 4).map(f => linha('fixo:' + f.id, avIco('repete', f.tipo === 'receita' ? 'var(--good)' : 'var(--warn)'), marcar(f.desc, r.tokens), `${esc(f.cat)} · ${f.tipo === 'receita' ? 'receita' : 'despesa'} fixa`, fmt.format(f.valor))).join(''))
    + grupo('Ir para', '', r.atalhos.slice(0, 4).map(a => linha('ir:' + a[1], avIco(a[2], 'var(--accent)'), marcar(a[0], r.tokens), 'atalho', '')).join(''));
  box.innerHTML = (html || `<div class="busca-vazia">Nada encontrado para “${esc(q)}”.</div>`)
    + (r.lanc.length > 6 || r.lanc.length && (r.cats.length || r.cartoes.length) ? `<button type="button" class="br br-todos" data-br="todos">Ver os ${r.lanc.length} lançamentos encontrados <kbd>Enter</kbd></button>` : '');
  box.hidden = false;
  const prim = box.querySelector('.br'); if (prim) prim.classList.add('sel');
}
// Filtro aplicado na aba Lançamentos: texto livre, uma categoria ou um cartão

function lancsDoFiltro(f) {

function fecharBusca() {

function escolherBusca(alvo) {

  fecharBusca(); q.blur();

  q.value = ''; aba = 'lanc'; cartaoSel = null; render(); rolarTopo();
}
{
  const q = document.getElementById('q'), box = document.getElementById('busca-res');
  let timer = null;
  q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => mostrarBusca(q.value), 90); });
  q.addEventListener('focus', () => { if (q.value.trim()) mostrarBusca(q.value); });
  q.addEventListener('keydown', e => {
    const itens = [...box.querySelectorAll('.br')], at = itens.findIndex(b => b.classList.contains('sel'));
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); if (!itens.length) return;
      const n = (at + (e.key === 'ArrowDown' ? 1 : -1) + itens.length) % itens.length;
      itens.forEach((b, i) => b.classList.toggle('sel', i === n)); itens[n].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {

      escolherBusca(sel && at > 0 ? sel.dataset.br : box.querySelector('[data-br="todos"]') ? 'todos' : sel ? sel.dataset.br : 'todos');
    } else if (e.key === 'Escape') { q.value = ''; fecharBusca(); q.blur(); }
  });
  box.addEventListener('mousedown', e => e.preventDefault());   // não perde o foco antes do clique
  box.addEventListener('click', e => { const b = e.target.closest('[data-br]'); if (b) escolherBusca(b.dataset.br); });
  document.addEventListener('click', e => { if (!e.target.closest('#busca') && !e.target.closest('#abrir-busca')) fecharBusca(); });
  document.getElementById('abrir-busca').addEventListener('click', () => { document.querySelector('header').classList.add('buscando'); q.focus(); });

  if (e.target.dataset && e.target.dataset.orc !== undefined) {
    const v = num(e.target.value);
    if (v > 0) S.orc[e.target.dataset.orc] = v; else delete S.orc[e.target.dataset.orc];
    salvar();
  }
  if (e.target.dataset && e.target.dataset.catIt !== undefined) imp.itens[e.target.dataset.catIt].cat = e.target.value.trim();
  if (e.target.id === 'imp-modo') impModo = e.target.value;
  if (e.target.id === 'imp-futuras') impFuturas = e.target.checked;
  if (e.target.id === 'pdf-fatura' && e.target.files[0]) {
    const st = document.getElementById('pdf-status');
    st.textContent = 'Lendo a fatura…';
    e.target.files[0].arrayBuffer().then(linhasDoPdf).then(l => { imp = lerFatura(l); render(); })
      .catch(err => { st.innerHTML = `<span class="neg">${esc(err.message)}</span>`; });
  }
  if (e.target.dataset && e.target.dataset.utilCartao !== undefined) {
    if (e.target.checked) S.cartaoDiaUtil[e.target.dataset.utilCartao] = true; else delete S.cartaoDiaUtil[e.target.dataset.utilCartao];
    salvar();
  }
  if (e.target.dataset && e.target.dataset.diaVenc !== undefined) {
    const d = parseInt(e.target.value, 10);
    if (d >= 1 && d <= 31) S.diasVencimento[e.target.dataset.diaVenc] = d; else delete S.diasVencimento[e.target.dataset.diaVenc];
    salvar();
  }
  if (e.target.dataset && e.target.dataset.melhorDia !== undefined) {
    const c = e.target.dataset.melhorDia, d = parseInt(e.target.value, 10);
    delete S.diasFechamento[c];
    if (d >= 1 && d <= 31) S.melhorDia[c] = d; else delete S.melhorDia[c];
    salvar();
  }
  if (e.target.dataset && e.target.dataset.diaFech !== undefined) {
    const d = parseInt(e.target.value, 10);
    if (d >= 1 && d <= 31) S.diasFechamento[e.target.dataset.diaFech] = d; else delete S.diasFechamento[e.target.dataset.diaFech];
    salvar();
  }
  if (e.target.id === 'saldo') informarSaldo(num(e.target.value));
  if (e.target.id === 'horiz') { S.horizonte = +e.target.value; salvar(); }
  if (e.target.id === 'ajuste') { S.ajuste = +e.target.value; salvar(); }
  if (e.target.id === 'importar' && e.target.files[0]) {
    e.target.files[0].text().then(t => {
      try { const d = JSON.parse(t); if (!Array.isArray(d.lanc)) throw 0; S = normalizar(d); salvar(); alert('Dados importados.'); }
      catch (err) { alert('Arquivo inválido.'); }
    });
  }
});
document.addEventListener('input', e => {
  const fe = e.target.form;
  if (fe && fe.id === 'f-edit') document.getElementById('edit-parte').textContent = fmt.format(r2(num(fe.valor.value) * +fe.parte.value)); if (e.target.id === 'ajuste') document.getElementById('aj-lbl').textContent = (e.target.value > 0 ? '+' : '') + e.target.value + '%'; });

let rz, larguraAnt = innerWidth;
window.addEventListener('resize', () => {
  if (innerWidth === larguraAnt) return;
  larguraAnt = innerWidth; clearTimeout(rz); rz = setTimeout(desenharGraficos, 150);
});
// ao voltar para o app (ex.: depois de usar no celular), busca o que mudou
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !timerEnvio) puxar(); });
window.addEventListener('beforeunload', e => { if (timerEnvio) { enviar(); e.preventDefault(); } });

function exemplo() {
  const s = novoEstado(), m0 = mesAtual();
  s.saldoAtual = 4200;
  s.fixos = [
    { id: uid(), tipo: 'receita', desc: 'Salário', cat: 'Salário', valor: 6500, inicio: addMes(m0, -6), fim: null, dias: [15, 30] },
    { id: uid(), tipo: 'despesa', desc: 'Aluguel', cat: 'Moradia', valor: 1800, inicio: addMes(m0, -6), fim: null, dias: [10] },
    { id: uid(), tipo: 'despesa', desc: 'Internet + celular', cat: 'Moradia', valor: 180, inicio: addMes(m0, -6), fim: null },
    { id: uid(), tipo: 'despesa', desc: 'Streaming', cat: 'Assinaturas', valor: 75, inicio: addMes(m0, -6), fim: null },
    { id: uid(), tipo: 'despesa', desc: 'Notebook (parcela)', cat: 'Compras', valor: 420, inicio: addMes(m0, -3), fim: addMes(m0, 6) },
  ];
  const vars = [['Mercado', 'Mercado', 900], ['iFood', 'Alimentação', 380], ['Uber', 'Transporte', 260], ['Cinema e bares', 'Lazer', 320], ['Farmácia', 'Saúde', 110]];
  for (let i = 5; i >= 0; i--) {
    const m = addMes(m0, -i);
    vars.forEach(([desc, cat, v], k) => {
      const dia = String(Math.min(28, 3 + k * 5)).padStart(2, '0');
      if (m === m0 && +dia > +hoje().slice(8)) return;
      s.lanc.push({ id: uid(), tipo: 'despesa', data: m + '-' + dia, desc, cat, valor: Math.round(v * (0.8 + Math.random() * 0.45)), ...(k < 4 ? { cartao: k % 2 ? 'Santander' : 'Itaú' } : {}) });
    });
  }
  s.lanc.push({ id: uid(), tipo: 'receita', data: addMes(m0, -2) + '-15', desc: 'Freela site', cat: 'Freelance', valor: 1200 });
  s.lanc.push({ id: uid(), tipo: 'despesa', data: addMes(m0, 3) + '-10', desc: 'IPVA', cat: 'Transporte', valor: 1600 });
  s.orc = { Mercado: 1000, 'Alimentação': 350, Transporte: 300, Lazer: 300, 'Saúde': 150 };
  return s;
}

puxar();
