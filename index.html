<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="theme-color" content="#1748ec">
<title>Minhas Finanças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<script>try { if (localStorage.getItem('financas.tema') === 'dark') document.documentElement.dataset.theme = 'dark'; const t = JSON.parse(localStorage.getItem('financas.tom')); if (t) { document.documentElement.style.setProperty('--th', t.h); document.documentElement.style.setProperty('--tc', t.c); } } catch (e) {}</script>
<style>
/* Cores derivadas do fundo: --th é o tom (matiz) e --tc o quanto de cor ele tem (0 = foto cinza, 1 = azul vivo).
   O app calcula os dois a partir da imagem escolhida; vidro, texto e sombras saem deles nos dois temas.
   --va multiplica a opacidade do vidro (controle de transparência). */
:root {
  color-scheme: light;
  --th: 224; --tc: 1; --va: 1;
  --tinta: calc(var(--tc) * 62% + 6%);
  --sh: var(--th) calc(var(--tc) * 55% + 10%) 22%;
  --fundo: linear-gradient(160deg, #0a2cc0 0%, #1748ec 32%, #2f68ff 62%, #6f9bff 88%, #a8c4ff 100%);
  --brilho: radial-gradient(1000px 560px at 50% 45%, rgba(255, 255, 255, .28), transparent 70%);
  --chao: hsl(var(--th) calc(var(--tc) * 80% + 4%) 52%);
  --janela: hsl(var(--th) var(--tinta) 98% / min(.97, calc(.32 * var(--va))));
  --janela-borda: rgba(255, 255, 255, .7);
  --lateral: hsl(var(--th) var(--tinta) 99% / min(.97, calc(.45 * var(--va))));
  --surface: hsl(var(--th) var(--tinta) 99% / min(.97, calc(.6 * var(--va))));
  --card: linear-gradient(150deg, hsl(var(--th) var(--tinta) 99% / min(.97, calc(.8 * var(--va)))) 0%, hsl(var(--th) var(--tinta) 97% / min(.97, calc(.52 * var(--va)))) 100%);
  --card-borda: rgba(255, 255, 255, .85);
  --card-sombra: 0 10px 30px hsl(var(--sh) / .10), inset 0 1px 0 rgba(255, 255, 255, .95);
  --jt: 36px; --jx: max(40px, calc((100vw - 1360px) / 2));
  --stat-bg: rgba(255, 255, 255, .42); --menu-on: rgba(255, 255, 255, .75);
  --surface-2: hsl(var(--th) var(--tinta) 98% / .55);
  --surface-solid: hsl(var(--th) calc(var(--tc) * 40%) 99.5%);
  --border: rgba(255, 255, 255, .95);
  --edge: hsl(var(--sh) / .09);
  --grid: hsl(var(--sh) / .08);
  --text: hsl(var(--th) calc(var(--tc) * 55% + 6%) 14%);
  --text-2: hsl(var(--th) calc(var(--tc) * 25% + 6%) 32%);
  --muted: hsl(var(--th) calc(var(--tc) * 16% + 6%) 47%);
  --accent: #2563eb;
  --accent-soft: rgba(37, 99, 235, .10);
  --hero: linear-gradient(135deg, #1d4ed8 0%, #2f74f5 55%, #38bdf8 100%);
  --s1: #3b6cf6;
  --s2: #f97316;
  --violeta: #8b5cf6;
  --accent-2: #3b82f6;
  --good: #10a36b;
  --warn: #c98a00;
  --crit: #e5484d;
  --radius: 18px;
  --shadow: 0 1px 2px hsl(var(--sh) / .05), 0 8px 24px hsl(var(--sh) / .07);
  --header-bg: hsl(var(--th) var(--tinta) 99% / .62);
  --cubo-a: rgba(255, 255, 255, .78); --cubo-b: rgba(170, 200, 255, .38); --cubo-c: rgba(30, 90, 240, .5);
  --vela: transparent;
  --btn-bg: var(--surface-solid);
  --f-num: "Manrope", "Inter", system-ui, sans-serif;
  --mola: cubic-bezier(.2, .9, .25, 1.05);
  --suave: cubic-bezier(.2, .8, .2, 1);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --tinta: calc(var(--tc) * 48% + 4%);
  --sh: 0 0% 0%;
  --fundo: linear-gradient(162deg, #030820 0%, #08196b 34%, #12339f 62%, #1c47c4 100%);
  --brilho: radial-gradient(900px 600px at 50% 38%, rgba(80, 130, 255, .22), transparent 70%);
  --chao: hsl(var(--th) var(--tinta) 9%);
  --janela: hsl(var(--th) var(--tinta) 7% / min(.97, calc(.42 * var(--va))));
  --janela-borda: rgba(255, 255, 255, .14);
  --lateral: hsl(var(--th) var(--tinta) 8% / min(.97, calc(.28 * var(--va))));
  --surface: hsl(var(--th) var(--tinta) 17% / min(.97, calc(.55 * var(--va))));
  --surface-2: hsl(var(--th) var(--tinta) 22% / .5);
  --surface-solid: hsl(var(--th) calc(var(--tc) * 42% + 6%) 12%);
  --card: linear-gradient(150deg, hsl(var(--th) var(--tinta) 24% / min(.97, calc(.55 * var(--va)))) 0%, hsl(var(--th) var(--tinta) 11% / min(.97, calc(.45 * var(--va)))) 100%);
  --card-borda: rgba(255, 255, 255, .11);
  --card-sombra: 0 10px 30px rgba(0, 0, 0, .25), inset 0 1px 0 rgba(255, 255, 255, .08);
  --stat-bg: rgba(255, 255, 255, .06); --menu-on: color-mix(in srgb, var(--accent) 18%, transparent);
  --border: rgba(255, 255, 255, .08); --edge: rgba(255, 255, 255, .08); --grid: rgba(255, 255, 255, .08);
  --text: hsl(var(--th) calc(var(--tc) * 40% + 6%) 95%);
  --text-2: hsl(var(--th) calc(var(--tc) * 28% + 6%) 80%);
  --muted: hsl(var(--th) calc(var(--tc) * 18% + 6%) 63%);
  --accent: #6b9bff; --accent-soft: rgba(107, 155, 255, .16);
  --s1: #6b9bff; --s2: #fb8a3c; --violeta: #a78bfa;
  --good: #3fd193; --warn: #eab308; --crit: #f87171;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .3);
  --header-bg: hsl(var(--th) var(--tinta) 9% / .6);
  --cubo-a: rgba(160, 190, 255, .35); --cubo-b: rgba(70, 110, 230, .25); --cubo-c: rgba(10, 30, 120, .55);
  --vela: rgba(0, 0, 0, .38);
  --btn-bg: hsl(var(--th) var(--tinta) 26% / .7);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--chao); color: var(--text);
  font: 15px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* fundo: degradê azul com blocos de vidro flutuando */
html { background: var(--chao); }
#fundo, #fundo-vidro { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100lvh; z-index: -2; overflow: hidden; pointer-events: none; }
#fundo, .fv-in { background: var(--brilho), var(--fundo); }
#fundo-vidro { z-index: -1; clip-path: inset(var(--jt) var(--jx) round 30px); }
.fv-in { position: absolute; inset: -80px; filter: blur(30px) saturate(1.35); }
/* fundo com imagem (glicínias ou foto do usuário): a mesma imagem, nítida fora e desfocada atrás da janela */
body.fundo-img #fundo, body.fundo-img .fv-in { background: var(--fundo-img) center / cover no-repeat; }
body.fundo-img .cubo { display: none; }
body.fundo-img .fv-in { filter: blur(28px) saturate(1.2); }
.fundos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.fundo-op { display: flex; flex-direction: column; gap: 8px; border: 2px solid transparent; background: none; padding: 0; font: inherit; font-size: 13px; font-weight: 600; color: var(--text-2); cursor: pointer; text-align: left; border-radius: 16px; }
.fundo-op .prev { aspect-ratio: 16 / 10; border-radius: 14px; background: center / cover no-repeat; border: 1px solid var(--card-borda); box-shadow: var(--card-sombra); display: grid; place-items: center; color: #fff; font-size: 26px; font-weight: 300; }
.fundo-op.on .prev { outline: 3px solid var(--accent); outline-offset: 2px; }
.fundo-op.on { color: var(--accent); }
.fv-in .cubo { box-shadow: inset 8px 8px 18px rgba(255, 255, 255, .75), inset -14px -20px 34px rgba(18, 60, 200, .5); }
.cubo { position: absolute; aspect-ratio: 1; border-radius: 24%;
  background: linear-gradient(145deg, var(--cubo-a) 0%, var(--cubo-b) 42%, var(--cubo-c) 100%);
  border: 1.5px solid rgba(255, 255, 255, .75);
  box-shadow: inset 8px 8px 18px rgba(255, 255, 255, .75), inset -14px -20px 34px rgba(18, 60, 200, .45), 30px 46px 80px hsl(var(--sh) / .38);
  display: grid; place-items: center; }
.cubo::before { content: ""; position: absolute; left: 9%; right: 9%; top: 7%; height: 38%; border-radius: 40% 40% 50% 50% / 60% 60% 40% 40%;
  background: linear-gradient(180deg, rgba(255, 255, 255, .75), rgba(255, 255, 255, 0)); }
.cubo::after { content: ""; position: absolute; inset: -1.5px; border-radius: inherit; background: linear-gradient(135deg, rgba(255, 255, 255, .4), transparent 35%, transparent 70%, rgba(120, 170, 255, .3)); }
.cubo svg { width: 46%; height: 46%; fill: none; stroke: #1f5bff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 4px 8px rgba(30, 90, 255, .5)); position: relative; z-index: 1; }
.c1 { width: 260px; left: -70px; top: -60px; transform: rotate(-18deg); }
.fv-in .c1 { left: 10px; top: 20px; }
.fv-in .c5 { width: 200px; right: 22%; top: 34%; opacity: .9; }
.fv-in .c6 { width: 160px; left: 34%; top: 8%; opacity: .9; }
.fv-in .c7 { width: 240px; left: 48%; bottom: -40px; transform: rotate(18deg); }
.c2 { width: 190px; right: -50px; top: 7%; transform: rotate(22deg); }
.c3 { width: 210px; left: 2%; bottom: -50px; transform: rotate(-10deg); }
.c4 { width: 150px; right: 7%; bottom: 3%; transform: rotate(14deg); opacity: .8; }
.c5 { width: 80px; right: 26%; top: 44%; transform: rotate(32deg); opacity: .5; }
.c6 { width: 64px; left: 30%; top: 4%; transform: rotate(-26deg); opacity: .5; }

/* janela de vidro que envolve o app */
.janela { position: relative; isolation: isolate; width: min(1320px, calc(100% - 112px)); margin: 44px auto; border-radius: 30px; display: grid; grid-template-columns: 1fr; min-height: calc(100vh - 88px); }
.janela::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: var(--janela); border: 1px solid var(--janela-borda);
  box-shadow: 0 40px 110px hsl(var(--sh) / .38), inset 0 1px 0 rgba(255, 255, 255, .7); }
.conteudo { min-width: 0; }
@media (min-width: 721px) {
  body { overflow: hidden; }
  .janela { position: fixed; top: var(--jt); bottom: var(--jt); left: var(--jx); right: var(--jx); width: auto; margin: 0; min-height: 0; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
  .conteudo { display: flex; flex-direction: column; min-height: 0; }
  .topo { position: relative; flex: none; }
  .topo::before { background: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
  main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--text-2) 40%, transparent) transparent; }
  main::-webkit-scrollbar { width: 8px; } main::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--text-2) 40%, transparent); border-radius: 8px; }
}

/* topo */
.topo { position: sticky; top: 0; z-index: 10; }
.topo::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--header-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--edge); border-radius: 30px 30px 0 0; }
header { padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
.logo { width: 38px; height: 38px; border-radius: 12px; background: var(--hero); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 40%, transparent); flex: none; }
.titulo { flex: 1; min-width: 0; }
header h1 { font-size: 22px; font-weight: 750; letter-spacing: -.02em; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
header h1 .app-nome { display: none; }
.saud { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#sync-st { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 22vw; }
.ibtn { position: relative; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow); flex: none; }
.ibtn:hover { color: var(--accent); }
.ibtn .ponto { position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--crit); box-shadow: 0 0 0 2px var(--surface-solid); }
.perfil { display: flex; align-items: center; gap: 10px; padding-left: 6px; }
.perfil .av { width: 38px; height: 38px; border-radius: 50%; background: var(--hero); color: #fff; display: grid; place-items: center; font-weight: 700; box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 35%, transparent); }
.perfil b { display: block; font-size: 14px; line-height: 1.2; }
.perfil small { color: var(--muted); font-size: 12px; }

/* busca */
.busca { position: relative; flex: 0 1 360px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); color: var(--muted); transition: box-shadow .15s, border-color .15s; }
.busca:focus-within { border-color: color-mix(in srgb, var(--accent) 45%, transparent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
.busca input { flex: 1; border: 0; background: none; padding: 0; height: 100%; box-shadow: none !important; font-size: 14px; }
.busca input::-webkit-search-cancel-button { display: none; }
.busca kbd, .br kbd { font: 600 11px "Inter", system-ui, sans-serif; color: var(--muted); background: var(--surface-2); border: 1px solid var(--edge); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
.busca-res { position: absolute; left: 0; right: 0; top: calc(100% + 8px); min-width: 380px; max-height: min(70vh, 560px); overflow-y: auto; background: var(--surface-solid); border: 1px solid var(--edge); border-radius: 18px; box-shadow: 0 24px 60px hsl(var(--sh) / .22); padding: 8px; z-index: 30; color: var(--text); }
.bg + .bg { border-top: 1px solid var(--grid); margin-top: 6px; padding-top: 6px; }
.bg-t { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px 10px 4px; }
.bg-t span { text-transform: none; letter-spacing: 0; font-weight: 600; }
.br { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: none; color: inherit; font: inherit; padding: 7px 10px; border-radius: 12px; cursor: pointer; }
.br:hover, .br.sel { background: var(--accent-soft); }
.br-t b { display: block; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.br-t small { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.br-v { font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.br .av-cat svg.i { width: 15px; height: 15px; }
.br-todos { display: flex; justify-content: space-between; margin-top: 6px; border-top: 1px solid var(--grid); border-radius: 0 0 12px 12px; color: var(--accent); font-weight: 650; font-size: 13.5px; padding: 11px 12px; }
.busca-vazia { padding: 18px; text-align: center; color: var(--muted); font-size: 14px; }
mark { background: color-mix(in srgb, var(--accent) 18%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
.so-cel { display: none; }
header { position: relative; }
.mes-pill { position: relative; display: flex; align-items: center; height: 40px; padding: 0 3px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); color: var(--muted); }
.mes-seta { width: 32px; height: 32px; border-radius: 50%; border: 0; background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer; transition: background .15s, color .15s, transform .15s var(--mola); }
.mes-seta svg.i { width: 16px; height: 16px; }
.mes-seta:hover { background: var(--accent-soft); color: var(--accent); }
.mes-seta:active { transform: scale(.88); }
.mes-btn { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 0; border-radius: 99px; background: none; font: inherit; font-size: 14px; font-weight: 650; color: var(--text); cursor: pointer; white-space: nowrap; transition: background .15s; }
.mes-btn:hover, .mes-btn[aria-expanded="true"] { background: var(--accent-soft); }
.mes-btn svg.i { width: 16px; height: 16px; color: var(--muted); }
.mes-btn #mes-nome { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.mes-btn small { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 1px 7px; }
.mes-pop { position: absolute; top: calc(100% + 10px); right: 0; z-index: 40; width: 292px; padding: 12px; border-radius: 20px; background: var(--surface-solid); color: var(--text); border: 1px solid var(--edge);
  box-shadow: 0 24px 60px hsl(var(--sh) / .28), 0 2px 6px hsl(var(--sh) / .08); transform-origin: top right; animation: pop .22s var(--mola); }
.mp-topo { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 10px; }
.mp-topo b { font: 800 16px var(--f-num); letter-spacing: -.01em; }
.mp-ano { width: 32px; height: 32px; border-radius: 10px; border: 1px solid var(--edge); background: var(--surface-2); color: var(--text-2); display: grid; place-items: center; cursor: pointer; }
.mp-ano:hover:not(:disabled) { color: var(--accent); }
.mp-ano:disabled { opacity: .35; cursor: default; }
.mp-ano svg.i { width: 16px; height: 16px; }
.mp-grade { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.mp-grade button { position: relative; height: 44px; border-radius: 12px; border: 1px solid transparent; background: none; color: var(--text); font: inherit; font-size: 14px; font-weight: 600; text-transform: capitalize; cursor: pointer; transition: background .15s, transform .15s var(--mola); }
.mp-grade button.futuro { color: var(--text-2); }
.mp-grade button:hover { background: var(--accent-soft); }
.mp-grade button:active { transform: scale(.94); }
.mp-grade button.hoje { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.mp-grade button.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-color: transparent; box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 35%, transparent); }
.mp-grade button i { position: absolute; left: 50%; bottom: 6px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); }
.mp-grade button.on i { background: #fff; }
.mp-atual { width: 100%; margin-top: 10px; height: 38px; border-radius: 12px; border: 1px solid var(--edge); background: var(--surface-2); color: var(--accent); font: inherit; font-size: 13.5px; font-weight: 650; cursor: pointer; }
.mp-atual:hover { background: var(--accent-soft); }
.leg-pill { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--edge); border-radius: 99px; padding: 3px 10px; }
.leg-pill i { width: 18px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--s1), var(--violeta)); }

/* menu */
nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 12px 18px 0; }
nav::-webkit-scrollbar { display: none; }
nav .curto { display: none; }
nav button { display: flex; align-items: center; gap: 11px; background: none; border: 0; padding: 9px 14px; border-radius: 12px; color: var(--text); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s; }
nav button svg.i { color: var(--text-2); transition: color .15s; }
nav button:hover { background: color-mix(in srgb, var(--surface-solid) 60%, transparent); color: var(--text); }
nav button.on { background: var(--menu-on); color: var(--accent); font-weight: 650; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 10%, transparent); }
nav button.on svg.i { color: var(--accent); }
nav .sec, .lado-card, .menu-tog, .so-movel, .mais { display: none; }
* { -webkit-tap-highlight-color: transparent; }
.ajustes { display: grid; gap: 14px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--grid); }
.chk { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; font-weight: 550; cursor: pointer; }
.chk input { width: 18px; height: 18px; }
.faixa { display: grid; gap: 6px; font-size: 14px; font-weight: 550; max-width: 460px; }
.faixa-l { display: flex; align-items: center; gap: 10px; }
.faixa-l input { flex: 1; }
.faixa-l small { color: var(--muted); font-size: 12px; font-weight: 500; }
nav .badge { margin-left: auto; font-style: normal; font-size: 11px; font-weight: 700; background: var(--accent); color: #fff; border-radius: 99px; padding: 1px 7px; line-height: 1.5; }
.marca { display: none; }
main { padding: 18px 24px 36px; }

/* cartões de conteúdo */
.card { background: var(--card); border: 1px solid var(--card-borda); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--card-sombra); }
.card h2 { font-size: 15px; font-weight: 650; margin: 0 0 16px; letter-spacing: -.005em; display: flex; align-items: center; gap: 8px; }
.card h2 .sub { font-weight: 500; color: var(--muted); font-size: 13px; }
.card h2 .acao { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--accent); white-space: nowrap; }
.card h2 .leg-pill + .acao { margin-left: 8px; }
.card h2 > svg.i { width: 30px; height: 30px; padding: 7px; border-radius: 9px; color: var(--accent); background: var(--accent-soft); }
.hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 16px; }
.tile { background: var(--card); border: 1px solid var(--card-borda); border-radius: var(--radius); padding: 18px; box-shadow: var(--card-sombra); display: flex; gap: 12px; align-items: flex-start; }
.tile > div:last-child { flex: 1; min-width: 0; }
.tile .ico { order: 2; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 13%, transparent); flex: none; }
.tile .ico svg.i { width: 20px; height: 20px; }
.tile .lbl { color: var(--text-2); font-size: 13px; font-weight: 550; }
.tile .val { font-size: 25px; font-weight: 750; margin-top: 4px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tile .sub2 { font-size: 12px; color: var(--muted); margin-top: 4px; }
.delta { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; margin-top: 6px; }
.delta span { font-weight: 500; color: var(--muted); }
.delta.bom { color: var(--good); }
.delta.ruim { color: var(--crit); }
.cat-row .dl { font-size: 11px; font-weight: 700; margin-left: 4px; }
.cat-row .dl.bom { color: var(--good); } .cat-row .dl.ruim { color: var(--crit); }

/* destaque do mês (cartão branco, cor só nos ícones) */
.hero { background: var(--card); border: 1px solid var(--card-borda); border-radius: var(--radius); padding: 22px; margin-bottom: 16px; box-shadow: var(--card-sombra); position: relative; }
.hero .hero-ico { position: absolute; right: 20px; top: 20px; width: 48px; height: 48px; border-radius: 14px; background: var(--hero); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 18px color-mix(in srgb, var(--accent) 35%, transparent); }
.hero .lbl { font-size: 14px; color: var(--text-2); font-weight: 550; }
.hero .big { font-size: 38px; font-weight: 800; letter-spacing: -.03em; margin: 2px 0 16px; font-variant-numeric: tabular-nums; }
.hero .stats { display: flex; gap: 10px; flex-wrap: wrap; }
.hero .stat { background: var(--stat-bg); border: 1px solid var(--card-borda); border-radius: 14px; padding: 10px 14px; min-width: 150px; flex: 1 1 150px; display: flex; gap: 10px; align-items: center; }
.hero .stat > svg.i { width: 34px; height: 34px; padding: 8px; border-radius: 10px; color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 13%, transparent); }
.hero .stat small { display: block; font-size: 12px; color: var(--muted); }
.hero .stat b { font-size: 16px; font-variant-numeric: tabular-nums; }
.hero .orc { margin-top: 14px; font-size: 13px; color: var(--text-2); }
.hero .orc .bar { height: 7px; border-radius: 99px; background: var(--grid); margin-top: 6px; overflow: hidden; }
.hero .orc .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--violeta)); }
/* destaque de um cartão (mantém a cor do cartão) */
.hero.cor { color: #fff; border-color: rgba(255, 255, 255, .25); box-shadow: 0 14px 34px hsl(var(--sh) / .25); overflow: hidden; }
.hero.cor .lbl, .hero.cor .stat small { color: rgba(255, 255, 255, .85); }
.hero.cor .stat { background: rgba(255, 255, 255, .15); border-color: rgba(255, 255, 255, .18); }
.hero.cor .stat > svg.i { color: #fff; background: rgba(255, 255, 255, .18); }

.destaque { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
.destaque > .hero, .destaque > .card { margin-bottom: 0; }
.livre .big { font-size: 34px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.livre h2 svg.i { width: 30px; height: 30px; padding: 6px; border-radius: 9px; color: var(--violeta); background: color-mix(in srgb, var(--violeta) 14%, transparent); }
.livre .pill { display: inline-flex; gap: 6px; align-items: center; margin-top: 12px; padding: 6px 12px; border-radius: 99px; font-size: 13px; font-weight: 650; color: var(--accent); background: var(--accent-soft); }
.livre .medidor { height: 8px; border-radius: 99px; background: var(--grid); margin-top: 14px; overflow: hidden; }
.livre .medidor i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--violeta)); }
.livre.aperto .big { color: var(--crit); }
.livre.aperto .pill { color: var(--crit); background: color-mix(in srgb, var(--crit) 11%, transparent); }

/* grades */
.grid2, .g21 { display: grid; gap: 16px; margin-bottom: 16px; }
.grid2 { grid-template-columns: 1fr 1fr; }
.g21 { grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); }
.grid2 > .card, .g21 > .card { margin-bottom: 0; min-width: 0; }

/* rosca de categorias */
.rosca { display: flex; gap: 18px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.rosca svg { width: 150px; height: 150px; flex: none; }
.rosca .leg { flex: 1 1 160px; display: grid; gap: 7px; font-size: 13px; }
.rosca .leg div { display: flex; align-items: center; gap: 8px; }
.rosca .leg b { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 36px; text-align: right; }
.rosca .leg .v { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.rosca .leg span.n { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* atividade (próximos dias) */
.feed { display: grid; gap: 2px; }
.ev { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 8px; border-radius: 12px; }
.ev:hover { background: var(--surface-2); }
.ev.menor { background: color-mix(in srgb, var(--warn) 11%, transparent); }
.ev-ico { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.ev-ico svg.i { width: 17px; height: 17px; }
.ev-txt b { display: block; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev-txt small { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; color: var(--muted); font-size: 12px; margin-top: 2px; }
.ev-val { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ev-val b { display: block; font-size: 14px; }
.ev-val small { font-size: 12px; color: var(--muted); }
.modo-prev { padding: 14px 16px; }
.modo-prev .seg button { padding: 7px 14px; font-size: 13.5px; }
.est { padding: 12px 0; border-top: 1px solid var(--grid); }
.est-cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.est-cab b { font-size: 18px; font-variant-numeric: tabular-nums; }
.est-cab b small { font-size: 12px; color: var(--muted); font-weight: 500; }
.calc-res h3 { font-size: 14px; margin: 18px 0 6px; }
.calc-big { padding: 16px 18px; border-radius: 16px; background: var(--accent-soft); margin-bottom: 12px; }
.calc-big small { display: block; color: var(--text-2); font-size: 13px; font-weight: 600; }
.calc-big b { display: block; font-size: 32px; font-weight: 800; letter-spacing: -.03em; color: var(--accent); font-variant-numeric: tabular-nums; }
.calc-big span { color: var(--muted); font-size: 13px; }
.cl-grupo { border: 1px solid var(--card-borda); border-radius: 14px; padding: 4px 14px; margin-bottom: 10px; background: var(--surface-2); }
.cl { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 14px; border-bottom: 1px dashed var(--grid); }
.cl:last-child { border-bottom: 0; }
.cl span { color: var(--text-2); }
.cl b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.cl b.tot { font-size: 16px; color: var(--accent); }
.cl b small { color: var(--muted); font-weight: 500; }
.pessoa { padding: 12px 0; border-bottom: 1px solid var(--grid); margin-bottom: 12px; }
.tl { position: relative; padding-left: 30px; }
.tl::before { content: ""; position: absolute; left: 10px; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: linear-gradient(var(--accent), var(--violeta)); opacity: .35; }
.tl-mes { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 18px 0 4px -30px; padding: 6px 12px; border-radius: 10px; background: var(--surface-2); font-size: 12px; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); }
.tl-mes span { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--muted); }
.tl-dia { position: relative; padding: 9px 0 11px; border-bottom: 1px dashed var(--grid); }
.tl-dia::before { content: ""; position: absolute; left: -25px; top: 14px; width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 18%, transparent); }
.tl-dia.apertado { background: color-mix(in srgb, var(--warn) 8%, transparent); border-radius: 10px; }
.tl-cab { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.tl-cab b { font-size: 15px; }
.tl-cab small { color: var(--muted); font-size: 12px; }
.tl-saldo { margin-left: auto; font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-variant-numeric: tabular-nums; }
.tl-saldo.neg { background: color-mix(in srgb, var(--crit) 12%, transparent); color: var(--crit); }
.tl-item { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 3px 0 0; color: var(--text-2); }
.tl-item b { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--text); }
.tl-item b.pos { color: var(--good); }
.ev-txt .pagar { padding: 0 6px; font-size: 12px; color: var(--accent); font-weight: 600; }
.ev-txt .pagar:hover { color: var(--good); }

/* formulários */
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.row label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 550; color: var(--text-2); flex: 1 1 140px; }
input, select { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--edge); border-radius: 11px; padding: 9px 12px; min-width: 0; transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input[type=range] { padding: 0; accent-color: var(--accent); box-shadow: none; }
input[type=checkbox] { accent-color: var(--accent); }
.btn { font: inherit; font-weight: 650; font-size: 14px; border: 1px solid var(--edge); background: var(--btn-bg); color: var(--text); border-radius: 11px; padding: 9px 16px; cursor: pointer; transition: transform .1s, box-shadow .15s, background .15s; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: #fff; box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn.primary:hover { filter: brightness(1.08); }
button.link { border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; font-size: 13px; padding: 4px 6px; border-radius: 6px; }
button.link:hover { color: var(--crit); background: var(--surface-2); }
a { color: var(--accent); }

/* tabelas */
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 11px 10px; border-bottom: 1px solid var(--grid); font-size: 14px; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
tbody tr { transition: background .12s; }
tbody tr:hover { background: var(--surface-2); }
td.num, th.num { text-align: right; white-space: nowrap; }
.tbl-wrap { overflow-x: auto; margin: 0 -10px; }
.it { display: flex; gap: 10px; align-items: center; }
.av-cat { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.pos { color: var(--good); }
.neg { color: var(--crit); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--edge); border-radius: 99px; padding: 1px 9px; white-space: nowrap; vertical-align: 1px; }
.tag.t-bom { color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); border-color: transparent; }
.tag.t-aviso { color: var(--warn); background: color-mix(in srgb, var(--warn) 13%, transparent); border-color: transparent; }
.tag.t-azul { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.tag.t-ruim { color: var(--crit); background: color-mix(in srgb, var(--crit) 11%, transparent); border-color: transparent; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

/* filtro por cartão */
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.chip { display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 14px; font-weight: 600; padding: 7px 14px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); cursor: pointer; box-shadow: var(--shadow); transition: all .15s; }
.chip:hover { color: var(--text); }
.chip.on { background: var(--accent); color: #fff; border-color: transparent; box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 30%, transparent); }

/* resumo por cartão */
.cartao-row { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 10px 8px; border-radius: 12px; cursor: pointer; transition: background .12s; }
.cartao-row:hover { background: var(--surface-2); }
.cartao-ico { width: 34px; height: 24px; border-radius: 6px; background: var(--c); display: grid; place-items: center; color: #fff; }
.cartao-ico svg.i { width: 15px; height: 15px; }
.cartao-row .nome { font-weight: 650; font-size: 14px; }
.cartao-row .mini { height: 6px; border-radius: 99px; background: var(--grid); margin-top: 6px; overflow: hidden; }
.cartao-row .mini i { display: block; height: 100%; border-radius: 99px; background: var(--c); }
.cartao-row .amt { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.cartao-row .amt small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }

/* categorias */
.cat-row { display: grid; grid-template-columns: minmax(90px, 150px) 1fr auto; gap: 14px; align-items: center; padding: 8px 0; }
.cat-row .name { font-size: 14px; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { position: relative; height: 8px; background: var(--grid); border-radius: 99px; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: linear-gradient(90deg, var(--s1), var(--violeta)); }
.limit { position: absolute; top: -4px; bottom: -4px; width: 2px; border-radius: 2px; background: var(--text-2); }
.cat-row .amt { font-size: 13px; color: var(--text-2); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.status { font-size: 12px; font-weight: 700; }
.status.warn { color: var(--warn); }
.status.crit { color: var(--crit); }

/* gráficos */
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-weight: 500; }
.tip { position: absolute; pointer-events: none; background: var(--surface-solid); border: 1px solid var(--edge); border-radius: 12px; padding: 9px 12px; font-size: 13px; box-shadow: 0 10px 30px hsl(var(--sh) / .16); white-space: nowrap; display: none; z-index: 2; }
.tip b { display: block; margin-bottom: 2px; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--text-2); margin-bottom: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.empty { color: var(--muted); text-align: center; padding: 28px 0; }

/* importação de fatura */
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--edge); border-radius: 11px; padding: 2px; gap: 2px; }
.seg button { font: inherit; font-size: 13px; font-weight: 600; border: 0; background: none; color: var(--text-2); padding: 5px 10px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--accent); color: #fff; box-shadow: 0 2px 6px color-mix(in srgb, var(--accent) 30%, transparent); }
.seg button.on.nao { background: var(--text-2); color: var(--surface-solid); box-shadow: none; }
tr.pendente td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
tr.ignorado td { color: var(--muted); }
.sec-title td { background: var(--surface-2); font-weight: 700; font-size: 13px; color: var(--text-2); }
.barra-imp { position: sticky; bottom: 12px; background: var(--surface-solid); border: 1px solid var(--edge); border-radius: var(--radius); padding: 14px 18px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; box-shadow: 0 10px 34px hsl(var(--sh) / .2); }
.barra-imp .tot { font-size: 20px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

dialog#dlg { border: 1px solid var(--edge); border-radius: 22px; padding: 24px; background: var(--surface-solid); color: var(--text); width: min(560px, calc(100vw - 32px)); box-shadow: 0 30px 70px hsl(var(--sh) / .35); }
dialog#dlg::backdrop { background: hsl(var(--sh) / .4); backdrop-filter: blur(4px); }
dialog#dlg h2 { font-size: 17px; margin: 0 0 16px; display: flex; align-items: center; gap: 8px; }
td.num button.link svg.i { width: 15px; height: 15px; vertical-align: -3px; }

/* listas nativas (tipo, cartão, parcelas…) legíveis nos dois temas */
select option, select optgroup { background-color: var(--surface-solid); color: var(--text); }

/* foto de fundo no modo escuro: um véu escurece a imagem para o vidro e o texto continuarem legíveis */
body.fundo-img #fundo::after, body.fundo-img .fv-in::after { content: ""; position: absolute; inset: 0; background: var(--vela); transition: background .4s; }

/* números em destaque */
.big, .tile .val, .lado-card b, .barra-imp .tot, header h1, .marca { font-family: var(--f-num); }
.hero .big { letter-spacing: -.035em; }
.tile .val { font-weight: 800; }

@media (max-width: 1480px) { .mes-btn > svg.i { display: none; } }

/* aviso de informações faltando */
.card.aviso { background: linear-gradient(150deg, color-mix(in srgb, var(--warn) 10%, transparent), transparent 70%), var(--card); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.card.aviso h2 > svg.i { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }

/* toque e foco */
.btn:active, .chip:active, .ibtn:active, nav button:active { transform: scale(.96); }
.chip, .ibtn, nav button { transition: background .2s, color .2s, box-shadow .2s, transform .15s var(--mola); }
.ibtn:hover { background: var(--accent-soft); }
:is(button, a, [role="button"], input, select):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mes-btn:focus-visible, .mes-seta:focus-visible { outline-offset: -2px; }

/* movimento: a tela nova sobe em cascata; trocar de mês desliza de lado; gráficos se desenham */
@keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.96); } }
@keyframes subir { from { opacity: 0; transform: translateY(14px) scale(.985); } }
@keyframes deslizar { from { opacity: 0; transform: translateX(var(--dx, 18px)); } }
@keyframes tracar { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes crescer { from { transform: scaleY(0); } }
@keyframes surgir { from { opacity: 0; } }
#app.entrar > * { animation: subir .55s var(--suave) both; }
#app.entrar-lado > * { animation: deslizar .4s var(--suave) both; }
#app.entrar > :nth-child(2), #app.entrar-lado > :nth-child(2) { animation-delay: .05s; }
#app.entrar > :nth-child(3), #app.entrar-lado > :nth-child(3) { animation-delay: .1s; }
#app.entrar > :nth-child(4), #app.entrar-lado > :nth-child(4) { animation-delay: .15s; }
#app.entrar > :nth-child(5), #app.entrar-lado > :nth-child(5) { animation-delay: .2s; }
#app.entrar > :nth-child(n+6), #app.entrar-lado > :nth-child(n+6) { animation-delay: .25s; }
#app.entrar .tiles > *, #app.entrar .destaque > * { animation: subir .55s var(--suave) both; }

        `${x.fechada ? `<div class="hint" style="margin:2px 0 0">Fechada: <b>${fmt.format(x.vFechada)}</b>${x.maeF >= 0.01 ? ` + ${NOME_OUTRO} ${fmt.format(x.maeF)} = ${fmt.format(r2(x.vFechada + x.maeF))}` : ''} · vence ${ddmm(x.vencFechada)}</div>` : ''}<div class="hint" style="margin:2px 0 0">Aberta: <b>${fmt.format(x.vAberta)}</b>${x.maeA >= 0.01 ? ` + ${NOME_OUTRO} ${fmt.format(x.maeA)}` : ''} até hoje · fecha ${ddmm(x.aberta)}, vence ${ddmm(x.vencAberta)}</div>`)).join('')}
      <p class="hint">A fatura aberta soma as parcelas que caem nela e as compras já feitas. O quanto ela ainda pode crescer fica na aba Previsão.</p>
    </div>` : cartoesUsados().length ? `
    <div class="card"><h2>${ico('cartao')} Por cartão <span class="sub">· sua parte em ${nomeMes(mesSel)}</span></h2>
      ${listaCartoes.map(([c, x]) => linhaCartao(c, `<div class="amt">${fmt.format(x.v)}<small>${x.n} ${x.n === 1 ? 'item' : 'itens'}</small></div>`, `<div class="mini"><i style="width:${x.v / maxCartao * 100}%"></i></div>`)).join('') || '<div class="empty">Nenhuma despesa neste mês.</div>'}
      <p class="hint">Toque num cartão para ver só os gastos dele.</p>
    </div>` : '';

  // mês atual: o que ainda entra e sai até o fim do mês (só o que já existe, sem estimativas)
  const resto = atual && cartaoSel === null ? comModo('conhecido', () => eventos(hoje(), fimDoMes(mesAtual()))) : [];
  const restoR = r2(resto.filter(e => e.valor > 0).reduce((a, e) => a + e.valor, 0)), restoD = r2(-resto.filter(e => e.valor < 0).reduce((a, e) => a + e.valor, 0));
  const fimMes = r2(S.saldoAtual + restoR - restoD);
  const cardResto = resto.length ? `<div class="card"><h2>${ico('repete')} Ainda em ${nomeMes(mesSel)} <span class="sub">· até o dia ${+fimDoMes(mesSel).slice(8)}, sem estimativas</span></h2>
    <div class="feed">${resto.map(e => `<div class="ev">
      <span class="ev-ico" style="--c:${e.valor > 0 ? 'var(--good)' : e.cartao ? corCartao(e.cartao) : 'var(--warn)'}">${ico(e.valor > 0 ? 'sobe' : e.cartao ? 'cartao' : 'repete')}</span>
      <div class="ev-txt"><b title="${esc(e.desc)}">${esc(e.desc)}</b><small>${ddmm(e.data)}${e.cartao ? ' · sua parte' + (e.outros >= 0.01 ? ` (+ ${NOME_OUTRO} ${fmt.format(e.outros)})` : '') : e.tag ? ' · ' + esc(e.tag) : ''}${e.movido ? ` · era ${ddmm(e.movido)}` : ''}${e.ajustado ? ' · ajustado' : ''}${e.fixo ? `<button class="link pagar" data-oc="${e.fixo}|${e.orig}" title="Mudar só esta vez: valor, data ou não acontece">✎ esta vez</button>` : ''}</small></div>
      <div class="ev-val"><b class="${e.valor > 0 ? 'pos' : ''}">${e.valor > 0 ? '+' : '−'} ${fmt.format(Math.abs(e.valor))}</b></div></div>`).join('')}</div>
    <p class="hint">Vai entrar ${fmt.format(restoR)} e sair ${fmt.format(restoD)}. Com o saldo informado, a conta fecha ${nomeMes(mesSel)} em <b>${fmt.format(fimMes)}</b>, antes das compras novas que você ainda fizer.</p>
  </div>` : '';
  const dias = S.saldoData ? Math.round((new Date(hoje()) - new Date(S.saldoData)) / 864e5) : null;
  const hero = cartaoSel === null ? `
  <div class="hero">
    <div class="hero-ico">${ico('carteira')}</div>
    ${atual ? `<div class="lbl">Saldo na conta${dias === null ? '' : dias === 0 ? ' · hoje' : ` · informado ${dias === 1 ? 'ontem' : `há ${dias} dias`}`}</div>
    <div class="big">${fmt.format(S.saldoAtual)}</div>` : `<div class="lbl">${futuro ? 'Previsto para' : 'Resultado de'} ${nomeMes(mesSel)}${futuro ? ' · só o que já existe' : ''}</div>
    <div class="big">${fmt.format(t.saldo)}</div>`}
    <div class="stats">
      <div class="stat" style="--c:var(--good)">${ico('sobe')}<div><small>${futuro ? 'Vai entrar' : `Entrou ${atual ? 'até hoje' : 'no mês'}`}</small><b>${fmt.format(t.r)}</b></div></div>
      <div class="stat" style="--c:var(--crit)">${ico('desce')}<div><small>${futuro ? 'Vai sair' : `Gastei ${atual ? 'até hoje' : 'no mês'}`}</small><b>${fmt.format(t.d)}</b></div></div>
      ${atual && resto.length ? `<div class="stat" style="--c:var(--accent)">${ico('grafico')}<div><small>Fim do mês (previsto)</small><b class="${fimMes < 0 ? 'neg' : ''}">${fmt.format(fimMes)}</b></div></div>` : ''}
      ${atual && !resto.length ? `<div class="stat" style="--c:var(--accent)">${ico('grafico')}<div><small>Resultado até hoje</small><b class="${t.saldo < 0 ? 'neg' : ''}">${fmt.format(t.saldo)}</b></div></div>` : ''}
    </div>
    ${atual ? `<div style="margin-top:16px">${campoSaldo()}</div>` : ''}
    ${orcTotal ? `<div class="orc">Orçamento: ${fmt.format(gastoOrcado)} de ${fmt.format(orcTotal)} (${Math.round(gastoOrcado / orcTotal * 100)}%)${gastoOrcado > orcTotal ? ' · ▲ acima do limite' : ''}
      <div class="bar"><i style="width:${Math.min(100, gastoOrcado / orcTotal * 100)}%"></i></div></div>` : ''}
  </div>` : `
  <div class="hero cor" style="background:linear-gradient(135deg, ${corCartao(cartaoSel)} 0%, color-mix(in srgb, ${corCartao(cartaoSel)} 55%, #1b1530) 100%)">
    <div class="lbl">${esc(nomeCartao(cartaoSel))} · ${viaFatura ? `fatura de ${nomeMes(mesSel)}${vencSel.length ? ' · vence ' + vencSel.map(ddmm).join(' e ') : ''} · sua parte` : `gasto em ${nomeMes(mesSel)}${atual ? ' até hoje' : ''}`}</div>
    <div class="big">${fmt.format(t.d)}</div>
    <div class="stats">
      <div class="stat">${ico('lista')}<div><small>Lançamentos</small><b>${desp.length}</b></div></div>
      ${cats[0] ? `<div class="stat">${ico('pizza')}<div><small>Maior categoria</small><b>${esc(cats[0][0])}</b></div></div>` : ''}
      ${t.d ? `<div class="stat">${ico('carteira')}<div><small>Do total do mês</small><b>${Math.round(t.d / Math.max(1, totais(todos).d) * 100)}%</b></div></div>` : ''}
    </div>
  </div>`;

  const cardCats = `<div class="card"><h2>${ico('pizza')} Onde o dinheiro ${futuro || viaFatura ? 'vai' : 'foi'} <span class="sub">· ${nomeMes(mesSel)}${atual && !viaFatura ? ' até hoje' : ''}</span></h2>
      ${rosca(cats)}
      ${rows || '<div class="empty">Nenhum gasto neste mês ainda.</div>'}
      ${cartaoSel !== null ? '' : Object.keys(S.orc).length ? '<p class="hint">A linha vertical marca o limite do orçamento.</p>' : '<p class="hint">Defina limites na aba Orçamento para acompanhar cada categoria.</p>'}
    </div>`;
  const cardHist = `<div class="card"><h2>${ico('grafico')} Últimos 6 meses ${cartaoSel !== null ? `<span class="sub">· gastos no ${esc(nomeCartao(cartaoSel))}</span>` : '<span class="sub">· o que entrou e o que foi gasto</span>'}</h2><div class="chart" id="hist"></div></div>`;
  // números do mês
  const rot = 'vs ' + nomeMes(mesAnt) + (atual ? ' até o dia ' + +hoje().slice(8) : '');
  const parcelasFuturas = cartaoSel === null && atual ? S.lanc.filter(l => l.tipo === 'despesa' && l.cartao && l.parcela && vencDoLanc(l) && vencDoLanc(l) > hoje()) : [];
  const ultParcela = parcelasFuturas.reduce((m, l) => vencDoLanc(l) > m ? vencDoLanc(l) : m, '');
  const aPagar = faturasAgora ? r2(faturasAgora.reduce((a, x) => a + x.vFechada + x.vAberta, 0)) : 0;
  const kpis = cartaoSel === null ? `<div class="tiles">
    ${tile(`${futuro ? 'Vai entrar' : 'Entrou'} em ${nomeMes(mesSel)}`, fmt.format(t.r), 'sobe', 'var(--good)', comparaAnt ? delta(t.r, tAnt.r, false, rot) : '')}
    ${tile(`${futuro ? 'Vai sair' : 'Gastei'} em ${nomeMes(mesSel)}`, fmt.format(t.d), 'desce', 'var(--violeta)', comparaAnt ? delta(t.d, tAnt.d, true, rot) : '')}
    ${faturasAgora ? tile('Cartões a pagar', fmt.format(aPagar), 'cartao', 'var(--accent)', `<div class="sub2">faturas fechadas + abertas até hoje</div>`) : ''}
    ${parcelasFuturas.length ? tile('Parcelas a vencer', fmt.format(r2(parcelasFuturas.reduce((a, l) => a + l.valor, 0))), 'repete', '#db2777', `<div class="sub2">já compradas · até ${nomeMes(ultParcela.slice(0, 7))}</div>`) : ''}
  </div>` : '';
  // últimas movimentações
  const DIAS_SEM = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  const ultimas = itens.slice().sort((a, b) => futuro ? a.quando.localeCompare(b.quando) : b.quando.localeCompare(a.quando)).slice(0, 9);
  const visual = i => i.tipo === 'receita' ? ['sobe', 'var(--good)'] : i.cartao ? ['cartao', corCartao(i.cartao)] : i.fixo ? ['repete', 'var(--warn)'] : ['pix', 'var(--accent)'];
  const cardUltimas = `<div class="card"><h2>${ico('lista')} ${futuro ? 'Primeiras do mês' : 'Últimas movimentações'}</h2>
    ${ultimas.length ? `<div class="feed">${ultimas.map(i => { const [ic, cor] = visual(i); return `<div class="ev">
      <span class="ev-ico" style="--c:${cor}">${ico(ic)}</span>
      <div class="ev-txt"><b title="${esc(i.desc)}">${esc(i.desc)}</b><small>${ddmm(i.quando)} ${DIAS_SEM[new Date(i.quando + 'T12:00').getDay()]} · ${esc(i.cat)}${i.cartao ? ' · ' + esc(nomeCartao(i.cartao)) : ''}${i.parcInfo ? ` · ${i.parcInfo.N}x` : ''}</small></div>
      <div class="ev-val"><b class="${i.tipo === 'receita' ? 'pos' : ''}">${i.tipo === 'receita' ? '+' : '−'} ${fmt.format(i.valor)}</b></div></div>`; }).join('')}</div>` : '<div class="empty">Nada neste mês ainda.</div>'}
  </div>`;
  return `${chipsCartao()}${cartaoSel === null ? telaPendencias() : ''}${hero}${kpis}${cardResto}
  <div class="g21">${cardCats}${cardCartoes || cardUltimas}</div>
  <div class="g21">${cardHist}${cardCartoes ? cardUltimas : ''}</div>
  <div class="card"><h2>${ico('lista')} Movimentações de ${nomeMes(mesSel)} <span class="sub">· ${itens.length} ${itens.length === 1 ? 'item' : 'itens'}${atual && !viaFatura ? ' até hoje' : ''}</span></h2>${tabelaItens(itens, true)}</div>
  ${futuro ? '<p class="hint">Este mês ainda não começou: aqui está só o que já existe (salários, contas fixas, parcelas e compras que caem nas faturas dele). Os gastos estimados ficam na aba Previsão.</p>' : ''}`;
}

// Cor fixa por categoria (para o círculo com a inicial)
const CORES_AV = ['#2563eb', '#7c3aed', '#0ea5e9', '#db2777', '#d97706', '#059669', '#4f46e5', '#0d9488'];
const corCategoria = c => { let h = 0; for (const ch of String(c)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return CORES_AV[h % CORES_AV.length]; };
// Data em que a compra foi feita. Parcelas guardam em `data` o fechamento da fatura em que caem
// (é o que decide a fatura); a data real vem da compra lançada à mão ou da chave do item da fatura.
function dataDaCompra(l) {
  if (l.compra && l.compra.data) return l.compra.data;
  const k = l.key && l.key.split('|')[2];
  return k && /^\d{4}-\d\d-\d\d$/.test(k) ? k : l.data;
}
const dataBR = d => d.split('-').reverse().join('/');
function tabelaItens(itens, mostraFixo) {
  if (!itens.length) return '<div class="empty">Nada por aqui ainda.</div>';
  const dataItem = i => i.quando || (i.fixo ? i.data || '' : dataDaCompra(i));
  itens = itens.slice().sort((a, b) => dataItem(b).localeCompare(dataItem(a)));
  return `<div class="tbl-wrap"><table class="tabela-mov"><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th class="num">Valor</th><th></th></tr></thead><tbody>` +
    itens.map(i => `<tr><td style="white-space:nowrap">${i.fixo ? (i.data ? dataBR(i.data) + ' ' : '') + '<span class="tag t-azul">fixo</span>' + (i.orig && i.orig !== i.data ? ` <span class="tag t-aviso" title="Data mudada só desta vez">era ${ddmm(i.orig)}</span>` : '') + (i.orig && i.ajustes && i.ajustes[i.orig] != null ? ' <span class="tag t-aviso" title="Valor diferente do normal só desta vez">ajustado</span>' : '') : dataBR(dataDaCompra(i))}</td><td><div class="it"><span class="av-cat" style="--c:${corCategoria(i.cat)}">${esc((i.cat || '?').trim().charAt(0).toUpperCase())}</span><div>${esc(i.desc)}${!i.fixo && i.data > hoje() && !i.parcela ? ' <span class="tag t-azul">planejado</span>' : ''}${i.cartao ? ' ' + tagCartao(i.cartao) : ''}${i.parcInfo ? ` <span class="tag">${i.parcInfo.N}x de ${fmt.format(r2(i.valor / i.parcInfo.N))}</span>` : ''}${!i.fixo && !i.parcInfo && vencDoLanc(i) ? ` <span class="tag" title="Data da compra: ${dataBR(dataDaCompra(i))}. É paga na fatura que vence nesse dia.">paga em ${ddmm(vencDoLanc(i))}</span>` : ''}${i.provisorio ? ' <span class="tag t-aviso" title="Lançado à mão; será trocado pelo da fatura quando ela for importada">a conferir</span>' : ''}${i.agregado ? ' <span class="tag t-aviso" title="Diferença entre o valor do app do banco e o que o app já conhecia; some ao importar o PDF">valor do banco</span>' : ''}</div></div></td><td>${esc(i.cat)}</td>
      <td class="num ${i.tipo === 'receita' || i.valor < 0 ? 'pos' : ''}">${(i.tipo === 'receita') === (i.valor >= 0) ? '+' : '−'} ${fmt.format(Math.abs(i.valor))}</td>
      <td class="num">${i.fixo ? (i.orig && !i.cartao ? `<button class="link" data-oc="${i.id}|${i.orig}" title="Mudar só esta vez: valor, data ou não acontece">${ico('lapis')}</button>` : '') : `<button class="link" data-edit-lanc="${i.id}" title="Editar">${ico('lapis')}</button><button class="link" data-del-lanc="${i.id}" title="Excluir">✕</button>`}</td></tr>`).join('') +
    `</tbody></table></div>`;
}

function telaBusca() {
  if (!filtroBusca) return '';
  const ls = lancsDoFiltro(filtroBusca), desp = somaDesp(ls), rec = r2(ls.reduce((a, l) => a + (l.tipo === 'receita' ? l.valor : 0), 0));
  const meses = [...new Set(ls.map(l => mesDoLanc(l)))];
  return `<div class="card busca-card"><h2>${ico('lupa')} Resultados: ${esc(filtroBusca.rotulo)} <span class="sub">· ${ls.length} ${ls.length === 1 ? 'lançamento' : 'lançamentos'}</span><button class="link acao" data-limpar-busca>Limpar busca ✕</button></h2>
    <div class="tiles" style="margin-bottom:12px">
      ${tile('Gastos encontrados', fmt.format(desp), 'desce', 'var(--violeta)')}
      ${rec ? tile('Receitas encontradas', fmt.format(rec), 'sobe', 'var(--good)') : ''}
      ${meses.length > 1 ? tile('Média por mês', fmt.format(r2(desp / meses.length)), 'grafico', 'var(--accent)', `<div class="sub2">${meses.length} meses</div>`) : ''}
    </div>
    ${tabelaItens(ls.slice(0, 300))}${ls.length > 300 ? '<p class="hint">Mostrando os 300 mais recentes.</p>' : ''}
  </div>`;
}

function telaLanc() {
  const doMes = filtraCartao(S.lanc.filter(l => mesDoLanc(l) === mesSel));
  const dataPadrao = mesSel === mesAtual() ? hoje() : mesSel + '-01';
  return `
  ${telaBusca()}
  <div class="card"><h2>Novo lançamento</h2>
    <form id="f-lanc" class="row">
${camposLanc('f-lanc', dataPadrao, cartaoSel || SEM_CARTAO)}
      <button class="btn primary">Adicionar</button>
    </form>
    <p class="hint sug"></p>
    <p class="hint">Comprou no cartão? Escolha o cartão e as parcelas: cada parcela vai para a fatura em que vai cair e entra na projeção já. Quando você importar a fatura, a compra é reconhecida e não duplica. Em "Sua parte", informe o valor total da conta: o app lança só a sua fração. Use datas futuras para gastos planejados (IPVA, viagem, presente) — eles entram na projeção.</p>
  </div>
  <datalist id="descs">${[...new Set(Object.keys(S.regras).concat(S.lanc.map(l => baseDesc(l.desc))))].sort().slice(0, 400).map(d => `<option value="${esc(d)}">`).join('')}</datalist>
  ${chipsCartao()}
  <div class="card"><h2>${ico('lista')} Lançamentos de ${nomeMes(mesSel)} ${cartaoSel !== null ? `<span class="sub">· ${esc(nomeCartao(cartaoSel))} · ${fmt.format(totais(doMes).d)}</span>` : ''}</h2>${tabelaItens(doMes)}</div>`;
}

// Próxima vez que o item fixo entra ou sai da conta (nos próximos 45 dias)
const proximaOcorrencia = f => agenda(45).find(e => e.fixo === f.id);
function telaFixos() {
  const lista = S.fixos.slice().sort((a, b) => a.tipo.localeCompare(b.tipo) || b.valor - a.valor);
  const ativos = totais(S.fixos.filter(f => fixoAtivo(f, mesAtual())));
  return `
  <div class="tiles">
    ${tile('Receitas fixas / mês', fmt.format(ativos.r), 'sobe', 'var(--good)')}
    ${tile('Despesas fixas / mês', fmt.format(ativos.d), 'desce', 'var(--crit)')}
    ${tile('Sobra antes dos variáveis', `<span class="${ativos.saldo < 0 ? 'neg' : ''}">${fmt.format(ativos.saldo)}</span>`, 'carteira', 'var(--accent)')}
  </div>
  <div class="card"><h2>Novo item fixo (todo mês)</h2>
    <form id="f-fixo" class="row">
      <label>Tipo<select name="tipo"><option value="despesa">Despesa</option><option value="receita">Receita</option></select></label>
      <label style="flex:2 1 200px">Descrição<input name="desc" required placeholder="Ex.: aluguel, salário, Netflix"></label>
      <label>Categoria<input name="cat" list="cats" required></label>
      <label>Valor (R$)<input name="valor" inputmode="decimal" required placeholder="0,00"></label>
      <label>Cartão<select name="cartao">${opcoesCartao()}</select></label>
      <label>Dia(s) do mês<input name="dias" placeholder="ex.: 10 · 15 (R$ 760), 30 · 5º dia útil"></label>
      <label>Começa em<input type="month" name="inicio" value="${mesAtual()}" required></label>
      <label>Termina em<input type="month" name="fim"></label>
      <button class="btn primary">Adicionar</button>
    </form>
    <p class="hint">"Dia(s) do mês" é quando o dinheiro entra ou sai: adiantamento no dia 15 e o resto no 30 = "15 (R$ 760), 30" ou "15 (40%), 30" (o dia sem percentual fica com o que sobra; sem nenhum percentual, divide igual); no 5º dia útil = "5º dia útil" (segunda a sexta, sem feriados nacionais). Assinatura no cartão não precisa de dia: ela entra na fatura. Salário, aluguel, assinaturas, parcelas… Deixe "termina em" vazio se não tem fim. Para parcelas, coloque o mês da última.</p>
  </div>
  <div class="card"><h2>Itens fixos</h2>
  ${lista.length ? `<div class="tbl-wrap"><table><thead><tr><th>Descrição</th><th>Categoria</th><th>Período</th><th class="num">Valor</th><th></th></tr></thead><tbody>` +

// De onde vêm os gastos estimados: a média de cada cartão e do Pix e quanto ela pesa em cada fatura
function cardEstimados() {
  const fator = fatorAjuste(), nomes = m => `${NOMES_MES[+m.slice(5) - 1]}/${m.slice(2, 4)}`;
  const linhaMedia = det => det.length ? det.map(x => `${nomes(x.m)} ${fmt.format(x.v)}`).join(' · ') : 'sem histórico ainda';
  const media = det => det.length ? r2(det.reduce((a, x) => a + x.v, 0) / det.length) : 0;
  const cartoes = cartoesUsados().filter(c => melhorDia(c) && diaVencimento(c)).map(c => {
    const det = detalheMedia(l => l.cartao === c), med = media(det);
    const fats = [];
    for (let i = 0; i <= 2; i++) for (const fech of faturasQueVencem(c, addMes(mesAtual(), i))) {
      if (fech <= hoje()) continue;
      const ant = fechamentoAnterior(c, fech), ini = ant > hoje() ? ant : hoje();
      const frac = Math.min(1, Math.max(0, diasEntre(ini, fech) / Math.max(1, diasEntre(ant, fech))));
      fats.push({ fech, venc: vencimentoDe(c, fech), frac, v: comModo('estimado', () => estimativaFatura(c, fech)) });
    }
    return { c, det, med, fats };
  });
  const detPix = detalheMedia(l => !l.cartao), medPix = media(detPix);
  return `<div class="card" id="estimados"><h2>${ico('alvo')} Gastos estimados <span class="sub">· de onde vêm${comEstimativa() ? '' : ' (desligados agora)'}</span></h2>

    ${cartoes.map(x => `<div class="est">
      <div class="est-cab">${tagCartao(x.c)}<b>${fmt.format(r2(x.med * fator))}<small>/mês</small></b></div>
      <div class="hint" style="margin:2px 0 6px">${linhaMedia(x.det)}</div>
      ${x.fats.map(f => `<div class="cl"><span>Fatura que vence ${ddmm(f.venc)} · fecha ${ddmm(f.fech)} · falta ${Math.round(f.frac * 100)}% do ciclo</span><b>≈ ${fmt.format(f.v)}</b></div>`).join('')}
    </div>`).join('')}
    <div class="est">
      <div class="est-cab"><span class="tag">Pix / débito</span><b>${fmt.format(r2(medPix * fator))}<small>/mês</small></b></div>
      <div class="hint" style="margin:2px 0 0">${linhaMedia(detPix)}. Entra em cada mês da projeção (no mês atual, só a parte que falta).</div>
