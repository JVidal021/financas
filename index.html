let pdfjsPronto;
function carregarPdfjs() {
  return pdfjsPronto ||= new Promise((ok, erro) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok(pdfjsLib); };
    s.onerror = () => { pdfjsPronto = null; erro(new Error('Não consegui carregar o leitor de PDF (precisa de internet).')); };
    document.head.appendChild(s);
  });
}

// Junta os pedaços de texto do PDF em linhas (página inteira, da esquerda para a direita),
// guardando a posição horizontal de cada caractere para saber de que coluna cada compra veio.
async function linhasDoPdf(buf) {
  const lib = await carregarPdfjs();
  let doc;
  try {
    doc = await lib.getDocument({ data: buf.slice(0) }).promise;
  } catch (e) {
    if (e.name !== 'PasswordException') throw e;
    // alguns bancos protegem o PDF (costuma ser parte do CPF do titular)
    const senha = prompt('Esta fatura tem senha. Digite a senha do PDF (geralmente são os primeiros dígitos do CPF do titular):');
    if (!senha) throw new Error('A fatura tem senha e nenhuma foi informada.');
    try { doc = await lib.getDocument({ data: buf, password: senha }).promise; }
    catch (e2) { throw e2.name === 'PasswordException' ? new Error('Senha incorreta.') : e2; }
  }
  const linhas = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p), meio = page.getViewport({ scale: 1 }).width / 2;
    const itens = (await page.getTextContent()).items.filter(i => i.str.trim());
    const grupos = [];
    for (const it of itens) {
      const y = it.transform[5];
      let g = grupos.find(g => Math.abs(g.y - y) < 2.5);
      if (!g) grupos.push(g = { y, itens: [] });
      g.itens.push(it);
    }
    grupos.sort((a, b) => b.y - a.y);
    for (const g of grupos) {
      g.itens.sort((a, b) => a.transform[4] - b.transform[4]);
      let txt = '', xs = [], fim = null;
      for (const it of g.itens) {
        const x = it.transform[4];
        if (fim !== null && x - fim > 1) { txt += ' '; xs.push(x); }
        const s = it.str.replace(/[−–]/g, '-');
        txt += s; xs.push(...Array(s.length).fill(x));
        fim = x + it.width;
      }
      linhas.push({ pagina: p, meio, txt, xs });
    }
  }
  return linhas;
}

const MESES = { jan: 1, fev: 2, mar: 3, abr: 4, mai: 5, jun: 6, jul: 7, ago: 8, set: 9, out: 10, nov: 11, dez: 12 };

// "1.234,56" | "R$ -12,00" | "12,00-" | "-R$ 5,00" → número (negativo = crédito)
function valorDe(s) {
  s = String(s).replace(/[−–]/g, '-').replace(/R\$|\s/g, '');
  const neg = /^-|-$/.test(s);
  const n = parseFloat(s.replace(/-/g, '').replace(/\./g, '').replace(',', '.'));
  return isFinite(n) ? (neg ? -n : n) : NaN;
}
// "05/10", "05/10/2026", "05 OUT", "05 OUT 2026" → {d, m, a?}
function dataDe(s) {
  const m = String(s).match(/(\d{2})(?:\/(\d{2})|\s([A-Za-z]{3}))(?:[\/ ](\d{4}))?/);
  if (!m) return null;
  const mes = m[2] ? +m[2] : MESES[m[3].toLowerCase()];
  if (!mes || mes > 12 || +m[1] < 1 || +m[1] > 31) return null;
  return { d: +m[1], m: mes, a: m[4] ? +m[4] : null };
}
const iso = (a, m, d) => `${a}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

// Parcela no fim da descrição: "LOJA 03/10", "LOJA PARC 03/10", "Loja - Parcela 3/10"
function separarParcela(desc) {
  const m = desc.match(/\s*[-–]?\s*(?:PARC(?:ELA)?\.?\s*)?(\d{1,2})\s*\/\s*(\d{1,2})$/i);
  if (m && +m[1] >= 1 && +m[1] <= +m[2] && +m[2] > 1 && +m[2] <= 48) return { desc: desc.slice(0, m.index).trim(), parc: { n: +m[1], N: +m[2] } };
  return { desc, parc: null };
}

const VALOR = String.raw`-?\s?(?:R\$\s?)?-?(?:\d{1,3}(?:\.\d{3})+|\d+),\d{2}-?`;
const DATA_NUM = String.raw`\d{2}\/\d{2}(?!\/?\d)`;
const DATA_MES = String.raw`\d{2} (?:JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)\b`;

// Um leitor por banco. "secoes": títulos que mudam o que vem abaixo deles, na mesma coluna:
//   compra = importa · ignora = pagamentos/créditos · futuro = parcelas de faturas seguintes
const LEITORES = {
  Santander: {
    detecta: /santander/i,
    data: DATA_NUM, inicio: null,
    secoes: [[/Pagamento e Demais Cr/i, 'ignora'], [/\bParcelamentos\b/i, 'compra'], [/\bDespesas\b(?!\/)/, 'compra']],
    encargos: [/\(\+\)\s*(Juros[^0-9]*?|IOF)\s+((?:\d{1,3}(?:\.\d{3})+|\d+),\d{2})/i],
    vencimento: /(\d{2}\/\d{2}\/\d{4})/,
    fechamento: /realizados[\s\S]{0,80}?at[ée]\s+(\d{2}\/\d{2})/i,
    total: { re: /VALOR TOTAL ((?:\d{1,3}(?:\.\d{3})+|\d+),\d{2})/, inclui: 'compras' },
  },
  Itaú: {
    detecta: /ita[uú] ?unibanco|itaucard|banco ita[uú]/i,
    data: DATA_NUM, inicio: null,
    secoes: [[/Pagamentos efetuados/i, 'ignora'], [/Lan[çc]amentos: compras e saques|Lan[çc]amentos internacionais/i, 'compra'], [/pr[óo]ximas faturas/i, 'futuro'], [/Limites de cr[ée]dito/i, 'ignora']],
    encargos: [/Repasse de (IOF) em R\$\s*((?:\d{1,3}(?:\.\d{3})+|\d+),\d{2})/i, /(Juros do rotativo|Juros de mora|Multa por atraso)\s+[\d,]+\s*%[^0-9]*?((?:\d{1,3}(?:\.\d{3})+|\d+),\d{2})/i],
    vencimento: /Vencimento:\s*(\d{2}\/\d{2}\/\d{4})/i,
    fechamento: /Emiss[ãa]o:\s*(\d{2}\/\d{2}\/\d{4})/i,
    total: { re: /Total dos lan[çc]amentos atuais\s*((?:\d{1,3}(?:\.\d{3})+|\d+),\d{2})/i, inclui: 'tudo' },
  },
  Bradesco: {
    detecta: /bradesco/i,
    data: DATA_NUM, inicio: 'compra',
    secoes: [[/pr[óo]ximas faturas|parcelas a vencer|lan[çc]amentos futuros/i, 'futuro'], [/(Lan[çc]amentos|Hist[óo]rico)\b/i, 'compra']],
    encargos: [],
    vencimento: /Vencimento[:\s]*(\d{2}\/\d{2}\/\d{4})/i,
    fechamento: /fechamento[^\d]{0,20}(\d{2}\/\d{2}(?:\/\d{4})?)/i,
    total: { re: /Total (?:da fatura|desta fatura)[^\d]{0,15}((?:\d{1,3}(?:\.\d{3})+|\d+),\d{2})/i, inclui: 'tudo' },
  },
  Nubank: {
    detecta: /nubank|nu pagamentos/i,
    data: DATA_MES, inicio: 'compra',
    secoes: [[/Pagamentos e Financiamentos/i, 'ignora'], [/^TRANSA[ÇC][ÕO]ES/i, 'compra']],
    encargos: [],
    vencimento: /vencimento[:\s]*(\d{2} [A-Z]{3} \d{4})/i,
    fechamento: /TRANSA[ÇC][ÕO]ES\s+DE\s+\d{2}\s+[A-Z]{3}\s+A\s+(\d{2}\s+[A-Z]{3})/i,
    total: { re: /Total de compras de todos os cart[õo]es[^\d]{0,30}((?:\d{1,3}(?:\.\d{3})+|\d+),\d{2})/i, inclui: 'compras' },
  },
};
const BANCOS_SUPORTADOS = Object.keys(LEITORES).join(', ').replace(/, (?=[^,]*$)/, ' e ');

function lerFatura(linhas) {
  const texto = linhas.map(l => l.txt).join('\n');
  const banco = Object.keys(LEITORES).find(b => LEITORES[b].detecta.test(texto));
  if (!banco) throw new Error(`Não reconheci o banco desta fatura. O app lê faturas em PDF de: ${BANCOS_SUPORTADOS}.`);
  const L = LEITORES[banco];
  const reCompra = new RegExp(`(?<![\\d\\/])(${L.data})\\s*(.+?)\\s+(${VALOR})(?![\\d%,])`, 'gi');

  const brutos = [];
  let futuros = 0;
  const estado = [L.inicio, L.inicio];   // [coluna esquerda, coluna direita]
  const colunaEm = (l, i) => l.xs[i] < l.meio ? 0 : 1;
  for (const l of linhas) {
    // títulos de seção mudam o estado da coluna onde aparecem
    for (const [re, novo] of L.secoes) {
      const g = new RegExp(re.source, re.flags.includes('g') ? re.flags : re.flags + 'g');
      for (const m of l.txt.matchAll(g)) estado[colunaEm(l, m.index)] = novo;
    }
    for (const re of L.encargos) {
      const m = l.txt.match(re);
      if (m && valorDe(m[2]) > 0) brutos.push({ dataObj: null, desc: m[1].trim(), valor: valorDe(m[2]), encargo: true });
    }
    for (const m of l.txt.matchAll(reCompra)) {
      const st = estado[colunaEm(l, m.index)];
      if (st === 'futuro') { futuros++; continue; }
      if (st !== 'compra') continue;
      const d = dataDe(m[1]);
      if (d) brutos.push({ dataObj: d, desc: m[2].trim(), valor: valorDe(m[3]) });
    }
  }

  // vencimento e fechamento
  const achar = re => { const m = texto.match(re); return m ? dataDe(m[1]) : null; };
  const venc = achar(L.vencimento) || (() => { const [a, m, d] = hoje().split('-').map(Number); return { a, m, d }; })();
  const fech = achar(L.fechamento) || venc;
  let ano = fech.a || venc.a;
  if (!fech.a && fech.m > venc.m) ano--;
  const fechamento = iso(ano, fech.m, fech.d);
  const dataISO = o => iso(o.a || (o.m > fech.m ? ano - 1 : ano), o.m, o.d);

  let ignorados = 0;
  const itens = [];
  for (const b of brutos) {
    if (isNaN(b.valor) || b.valor === 0) continue;
    if (b.valor < 0 && /PAGAMENTO|PAGTO/i.test(b.desc)) { ignorados++; continue; }
    const { desc, parc } = separarParcela(b.desc.replace(/\s+/g, ' ').trim());
    const sec = b.encargo || /^(JUROS|IOF|MULTA|ENCARGO|ANUIDADE)/i.test(desc) ? 'encargo' : b.valor < 0 ? 'credito' : parc ? 'parcela' : 'despesa';
    itens.push({ sec, data: b.dataObj ? dataISO(b.dataObj) : fechamento, desc: desc.toUpperCase(), parc, valor: r2(b.valor) });
  }
  if (!itens.length) throw new Error(`Reconheci uma fatura ${banco}, mas não encontrei compras nela.`);

  // conferência com o total impresso na fatura
  const tot = texto.match(L.total.re);
  const soma = r2(itens.filter(i => L.total.inclui === 'tudo' || i.sec !== 'encargo').reduce((a, i) => a + i.valor, 0));
  const totalFatura = tot ? valorDe(tot[1]) : null;

  itens.forEach(it => {
    it.base = `${it.desc}|${it.valor}|${it.data}|${it.parc ? it.parc.N : ''}`;
    it.key = it.sec === 'encargo' ? `${fechamento}|${it.desc}|${it.valor}` : it.base + '|' + (it.parc ? it.parc.n : '');
  });
  marcarItens(itens, banco, fechamento);
  return { banco, fechamento, vencimento: iso(venc.a || ano, venc.m, venc.d), itens, soma, totalFatura, ignorados, futuros, revisao: itens.some(i => i.importado) };
}

// Pré-marca cada item: o que já foi lançado volta como estava (para revisar);
// o resto segue o que você marcou da última vez para o mesmo estabelecimento.
function marcarItens(itens, banco, fechamento) {
  const usados = new Set(), fixosUsados = new Set();
  // compra lançada à mão (ou de uma fatura aberta) que corresponde a cada item: entre as candidatas,
  // fica o par mais parecido (nome, valor e data), para uma compra de R$ 14 não casar com um Uber de R$ 14,94
  const parManual = new Map();
  if (banco) {
    const pares = [];
    itens.forEach(it => { if (S.lanc.some(l => l.key === it.key)) return;
      for (const l of S.lanc) if (casaComFatura(l, it, banco) || casaComAberta(l, it, banco)) { const nota = notaPar(l, it); if (nota < 2) pares.push({ it, l, nota }); } });
    pares.sort((a, b) => a.nota - b.nota);
    const tomados = new Set();
    for (const { it, l } of pares) if (!parManual.has(it) && !tomados.has(l.id)) { parManual.set(it, l); tomados.add(l.id); }
  }
  // item fixo no cartão cobrado em duas linhas no mesmo dia que somam o valor dele (ex.: academia em duas cobranças)
  const fixoEmDois = new Map();
  if (banco && fechamento) {
    const livres = itens.filter(it => it.sec === 'despesa' && !S.lanc.some(l => l.key === it.key));
    for (const f of S.fixos.filter(f => f.cartao === banco && f.tipo === 'despesa' && fixoAtivo(f, fechamento.slice(0, 7)))) {
      const perto = v => Math.abs(f.valor - v) <= Math.max(1, f.valor * 0.05);
      if (livres.some(it => perto(it.valor))) continue;
      for (let a = 0; a < livres.length && !fixoEmDois.size; a++) for (let b = a + 1; b < livres.length; b++)
        if (livres[a].data === livres[b].data && perto(livres[a].valor + livres[b].valor)) { fixoEmDois.set(livres[a], f).set(livres[b], f); break; }
    }
  }
  itens.forEach((it, i) => {
    it.id = i;
    let ja = S.lanc.find(l => l.key === it.key);
    // compra lançada à mão antes da fatura fechar: usa a sua marcação e o seu nome/categoria
    const manual = !ja ? parManual.get(it) : null;
    if (manual) { usados.add(manual.id); it.manual = manual.id; ja = manual; }
    // parcela já prevista por uma fatura anterior, mas com a descrição escrita de outro jeito
    const prev = !ja && banco && it.parc ? S.lanc.find(l => !usados.has(l.id) && parcelaPrevistaIgual(l, it, banco)) : null;
    if (prev) { usados.add(prev.id); it.prevista = prev.id; ja = prev; }
    const regra = S.regras[it.desc];
    it.importado = !!(ja && !ja.prevista && !ja.provisorio);
    it.escolha = ja ? (ja.share === 1 ? 'meu' : ja.share === 0.5 ? 'metade' : 'div')
      : regra ? regra.escolha : null;
    // já tinha sido importada e este item não virou lançamento: foi marcado "não é meu"
    if (!ja && !regra && S.faturas.some(f => f.itens.some(x => x.key === it.key))) it.escolha = 'nao';
    if (it.escolha === 'div') { const fr = ja ? lerFracao(fracaoTxt(ja.share)) : { k: regra.k, n: regra.n }; if (fr) Object.assign(it, fr); else it.meu = r2(Math.abs(ja.valor)); }
    it.cat = ja ? ja.cat : regra && regra.cat ? regra.cat : palpiteCat(it.desc);
    // cobrança que já está em Fixos neste cartão (assinatura): não conta de novo
    if (!ja && banco && fechamento && it.sec === 'despesa') {
      const fx = S.fixos.find(f => !fixosUsados.has(f.id) && f.cartao === banco && f.tipo === 'despesa' && fixoAtivo(f, fechamento.slice(0, 7))
        && Math.abs(f.valor - it.valor) <= Math.max(1, f.valor * 0.05));
      if (fx) { fixosUsados.add(fx.id); it.fixo = fx.desc; it.escolha = 'nao'; it.cat = fx.cat; }
      else if (fixoEmDois.has(it)) { const f2 = fixoEmDois.get(it); it.fixo = f2.desc; it.escolha = 'nao'; it.cat = f2.cat; }
    }
  });
  // estorno/cancelamento ainda sem lançamento: fica com o dono da compra de mesmo valor
  // (nesta fatura ou já lançada neste cartão), em vez de cair na parte da mãe por não estar marcado
  itens.filter(it => it.sec === 'credito' && !it.importado).forEach(it => {
    const v = -it.valor;
    const comp = itens.find(x => x.sec !== 'credito' && Math.abs(x.valor - v) < 0.01 && x.escolha);
    const lc = comp ? null : S.lanc.find(l => l.cartao === banco && l.tipo === 'despesa' && l.valor > 0 && l.share && Math.abs(l.valor / l.share - v) < 0.01);
    if (comp) {
      it.escolha = comp.escolha; it.cat = comp.cat;
      if (comp.escolha === 'div') { it.k = comp.k; it.n = comp.n; if (comp.meu != null) it.meu = -comp.meu; }
    } else if (lc) {
      it.escolha = lc.share === 1 ? 'meu' : lc.share === 0.5 ? 'metade' : 'div'; it.cat = lc.cat;
      if (it.escolha === 'div') it.meu = r2(-lc.valor);
    }
  });
}

// Fatura enviada para revisar sem PDF (ex.: transcrita de prints do app do banco). Aberta = ainda não
// fechou: fecha e vence nas datas que o app calcula para o cartão.
function faturaDePendente(pd) {
  const fechamento = pd.fechamento || fechamentoDaCompra(pd.banco, hoje()), vencimento = pd.vencimento || vencimentoDe(pd.banco, fechamento);
  const itens = pd.itens.map(x => {
    const desc = x.desc.replace(/\s+/g, ' ').trim().toUpperCase(), parc = x.parc ? { n: x.parc.n, N: x.parc.N } : null, valor = r2(x.valor);
    const it = { sec: valor < 0 ? 'credito' : parc ? 'parcela' : 'despesa', data: x.data, desc, parc, valor };
    it.base = `${desc}|${valor}|${it.data}|${parc ? parc.N : ''}`;
    it.key = it.base + '|' + (parc ? parc.n : '');
    return it;
  });
  marcarItens(itens, pd.banco, fechamento);
  return { banco: pd.banco, fechamento, vencimento, itens, soma: r2(itens.reduce((a, i) => a + i.valor, 0)), totalFatura: pd.total ?? null, ignorados: 0, futuros: 0,
    revisao: itens.some(i => i.importado), aberta: !!pd.aberta, pendente: pd.id, origem: pd.origem };
}
function telaFaturasPendentes() {
  const ps = S.faturasPendentes || [];
  if (!ps.length) return '';
  return `<div class="card aviso"><h2>${ico('envia')} Faturas para revisar <span class="sub">· enviadas sem PDF</span></h2>
    ${ps.map(pd => { const soma = r2(pd.itens.reduce((a, i) => a + i.valor, 0)); return `<div class="row" style="align-items:center;justify-content:space-between;padding:6px 0">
      <div><b>${esc(pd.banco)}${pd.aberta ? ' · fatura em aberto' : ''}</b><div class="hint" style="margin:0">${esc(pd.origem || '')} · ${pd.itens.length} itens · ${fmt.format(soma)}${pd.total != null && Math.abs(pd.total - soma) >= .01 ? ` de ${fmt.format(pd.total)} <span class="neg">(faltam ${fmt.format(r2(pd.total - soma))})</span>` : ''}</div></div>
      <button class="btn primary" data-pendente="${esc(pd.id)}" style="flex:0 0 auto">Revisar e marcar</button></div>`; }).join('')}
  </div>`;
}
function reabrirFatura(id) {
  const f = S.faturas.find(f => f.id === id);
  const itens = f.itens.map(x => ({ ...x, parc: x.parc ? { ...x.parc } : null }));
  marcarItens(itens, f.banco, f.fechamento);
  imp = { ...f, itens, revisao: true, totalFatura: f.total ?? null, soma: r2(itens.reduce((a, i) => a + i.valor, 0)) };
}

function desfazerFatura(id) {
  const f = S.faturas.find(f => f.id === id);
  const keys = new Set(f.itens.map(i => i.key)), bases = f.itens.filter(i => i.parc).map(i => i.base + '|');
  S.lanc = S.lanc.filter(l => !keys.has(l.key) && !(l.prevista && bases.some(b => l.key.startsWith(b))));
  S.faturas = S.faturas.filter(x => x.id !== id);
  salvar();
}

const SHARE = { meu: 1, metade: 0.5, nao: 0 };
// "Dividir" guarda a fração (k/n) ou, quando você informa em reais, quanto é seu (meu)
const fracao = it => it.escolha === 'div' ? (it.meu != null ? it.meu / it.valor : it.k / it.n) : SHARE[it.escolha] || 0;
const rotuloFracao = share => share === 1 ? '' : share === 0.5 ? ' · metade' : ` · ${fracaoTxt(share)} seu`;
// 0.6667 → "2/3"
function fracaoTxt(share) {
  for (let n = 2; n <= 12; n++) { const k = Math.round(share * n); if (Math.abs(k / n - share) < 0.001) return `${k}/${n}`; }
  return Math.round(share * 100) + '%';
}
function lerFracao(txt) {
  const m = String(txt || '').trim().match(/^(\d+)\s*\/\s*(\d+)$/);
  return m && +m[1] >= 1 && +m[1] < +m[2] && +m[2] <= 12 ? { k: +m[1], n: +m[2] } : null;
}
const r2 = v => Math.round(v * 100) / 100;

function telaFatura() {
  if (!imp) return `
  <div class="card"><h2>Importar fatura do cartão</h2>
    <p class="hint" style="margin:0 0 12px">Escolha o PDF da fatura do <b>Itaú, Santander, Bradesco ou Nubank</b>. Depois você marca o que é seu, o que é metade, o que é dividido (ex.: 2/3 seu) e o que não é seu. Na próxima fatura, os mesmos estabelecimentos já vêm marcados.</p>
    <label class="btn primary" style="display:inline-block;cursor:pointer">Escolher PDF da fatura<input type="file" id="pdf-fatura" accept="application/pdf,.pdf" hidden></label>
    <p class="hint" id="pdf-status"></p>
    <p class="hint">O PDF é lido aqui mesmo no seu navegador e não é enviado para lugar nenhum. Só o leitor de PDF é baixado da internet na primeira vez.</p>
  </div>
  ${telaFaturasPendentes()}
  ${telaFaturasAbertas()}
  ${telaHistoricoFaturas()}`;

  const pend = imp.itens.filter(i => !i.escolha).length;
  const minha = r2(imp.itens.reduce((a, i) => a + i.valor * fracao(i), 0));
  const meuTotal = r2(imp.itens.filter(i => i.escolha === 'meu').reduce((a, i) => a + i.valor, 0));
  const metadeTotal = r2(imp.itens.filter(i => i.escolha === 'metade').reduce((a, i) => a + i.valor, 0));
  const divididos = imp.itens.filter(i => i.escolha === 'div');
  const nomes = { despesa: 'Compras do mês', parcela: 'Parcelas', credito: 'Estornos e créditos', encargo: 'Juros e IOF' };
  const btn = (it, v, txt) => `<button class="${it.escolha === v ? 'on ' + v : ''}" data-esc="${v}" data-it="${it.id}">${txt}</button>`;
  let corpo = '';
  for (const sec of ['despesa', 'parcela', 'credito', 'encargo']) {
    const lista = imp.itens.filter(i => i.sec === sec);
    if (!lista.length) continue;
    corpo += `<tr class="sec-title"><td colspan="6">${nomes[sec]} · ${lista.length} itens · ${fmt.format(lista.reduce((a, i) => a + i.valor, 0))}</td></tr>`;
    corpo += lista.map(it => `<tr class="${!it.escolha ? 'pendente' : it.escolha === 'nao' ? 'ignorado' : ''}">
      <td>${it.data.slice(8)}/${it.data.slice(5, 7)}</td>
      <td>${esc(it.desc)}${it.parc ? ` <span class="tag">${it.parc.n}/${it.parc.N}</span>` : ''}${it.manual ? ` <span class="tag" title="${esc(S.lanc.find(l => l.id === it.manual)?.desc || '')}">✓ ${S.lanc.find(l => l.id === it.manual)?.aberta ? 'da fatura aberta' : 'lançada à mão'}</span>` : ''}${it.prevista ? ' <span class="tag" title="Parcela que o app já previa de uma fatura anterior">✓ parcela prevista</span>' : ''}${it.fixo ? ` <span class="tag" title="Já conta pelo item fixo; marcado como Não é meu para não contar duas vezes">✓ já está em Fixos: ${esc(it.fixo)}</span>` : ''}</td>
      <td class="num">${fmt.format(it.valor)}</td>
      <td><span class="seg">${btn(it, 'meu', 'Meu')}${btn(it, 'metade', 'Metade')}${btn(it, 'div', it.escolha === 'div' ? (it.meu != null ? `${fmt.format(it.meu)} seu` : `${it.k}/${it.n} seu`) : 'Dividir…')}${btn(it, 'nao', 'Não é meu')}</span></td>
      <td><input list="cats" data-cat-it="${it.id}" value="${esc(it.cat)}" style="width:130px" ${it.escolha === 'nao' ? 'disabled' : ''}></td>
      <td class="num">${it.escolha && it.escolha !== 'nao' ? fmt.format(r2(it.valor * fracao(it))) : ''}</td></tr>`).join('');
  }
  return `
  ${imp.aberta ? `<div class="card" style="border-color:var(--accent)"><h2>${ico('cartao')} Fatura em aberto · ${esc(imp.banco)}</h2>

// Conta fixa paga (ou receita recebida) antes do dia previsto: { data: dia previsto, valor }
const pagoAntes = (f, data) => (f.pagos || []).some(p => p.data === data);
// Ajuste de uma data específica: { 'AAAA-MM-DD': valor } troca o valor normal só naquele dia
const valorNoDia = (f, data, normal) => f.ajustes && f.ajustes[data] != null ? f.ajustes[data] : normal;
function eventos(ini, fim) {
  const dentro = d => d > ini && d <= fim;
  const ev = [];
  const meses = [addMes(ini.slice(0, 7), -1)];
  while (meses[meses.length - 1] < fim.slice(0, 7)) meses.push(addMes(meses[meses.length - 1], 1));
  for (const m of meses) {
    for (const f of S.fixos) {
      if (f.cartao || !(f.dias || f.uteis)) continue;
      const varias = (f.uteis || []).length + (f.dias || []).length > 1 && !(f.valores && Object.values(f.valores).length);
      for (const o of ocorrencias(f, m)) if (dentro(o.data) && !pagoAntes(f, o.orig))
        ev.push({ fixo: f.id, data: o.data, orig: o.orig, desc: f.desc + (varias ? ` (${Math.round(o.parte * 100)}%)` : ''), valor: (f.tipo === 'receita' ? 1 : -1) * o.valor, tag: f.tipo === 'receita' ? 'entrada' : 'conta fixa', ajustado: o.ajustada, movido: o.movida ? o.orig : null });
    }
    for (const c of cartoesUsados()) {
      if (!diaFechamento(c)) continue;
      const fech = fechamentoEm(c, m), venc = vencimentoDe(c, fech);
      if (!venc || !dentro(venc) || (S.faturasPagas || {})[c + '|' + venc]) continue;
      const est = estimativaFatura(c, fech), v = r2(valorFatura(c, fech) + est);
      if (v) ev.push({ data: venc, desc: `Fatura ${c}`, valor: -v, cartao: c, previa: fech > hoje(), estimado: est, outros: parteOutros(c, fech) });
    }
  }
  S.lanc.filter(l => !l.cartao && dentro(l.data)).forEach(l => ev.push({ lanc: l.id, data: l.data, desc: l.desc, valor: (l.tipo === 'receita' ? 1 : -1) * l.valor, tag: 'planejado' }));
  return ev.sort((a, b) => a.data.localeCompare(b.data) || b.valor - a.valor);
}
// Livre pra gastar: o menor saldo previsto nos próximos 45 dias (contas, salários, faturas com a
// estimativa de compras no cartão). Gastar mais que isso em Pix/débito deixa a conta negativa
// nesse dia. O valor por dia divide até o dia mais apertado (ou até a próxima entrada, se o
// mais apertado é hoje).
function livreParaGastar() {
  const ev = agenda(45);
  let menor = { saldo: S.saldoAtual, data: hoje() };
  for (const e of ev) if (e.saldo < menor.saldo) menor = e;
  const entrada = ev.find(e => e.valor > 0);
  const ate = menor.data > hoje() ? menor.data : entrada ? entrada.data : addDia(hoje(), 30);
  const dias = Math.max(1, Math.round(diasEntre(hoje(), ate)));
  return { valor: r2(menor.saldo), ate, dias, apertado: menor.data > hoje(), porDia: r2(Math.max(0, menor.saldo) / dias), ev };
}

// Etiqueta de variação em relação a outro valor. `subirEhRuim` para gastos.
function delta(atual, antes, subirEhRuim, rotulo) {
  if (!(antes > 0)) return '';
  const p = (atual - antes) / antes;
  if (Math.abs(p) < 0.005) return `<span class="delta" style="color:var(--muted)">= <span>${rotulo}</span></span>`;
  return `<span class="delta ${(p > 0) === subirEhRuim ? 'ruim' : 'bom'}">${p > 0 ? '↑' : '↓'} ${Math.round(Math.abs(p) * 100)}% <span>${rotulo}</span></span>`;
}

// Saldo da conta dia a dia (degraus), com área preenchida e o dia mais apertado marcado
// `base` (opcional, na simulação): { ev, saldo } de outro cenário, desenhado tracejado por baixo para comparar
function graficoSaldoDia(el, ev, base) {
  if (!el) return;
  const W = el.clientWidth || 600, H = 250, P = { l: 62, r: 16, t: 22, b: 28 };
  const pts = [{ data: hoje(), saldo: S.saldoAtual, desc: 'Hoje' }].concat(ev);
  const fimDia = pts.filter((p, i) => !pts[i + 1] || pts[i + 1].data !== p.data);   // saldo no fim de cada dia
  const fim = addDia(hoje(), 45);
  const t0 = new Date(hoje()).getTime(), t1 = new Date(fim).getTime();
  const x = d => P.l + (W - P.l - P.r) * ((new Date(d).getTime() - t0) / (t1 - t0));
  const ptsB = base ? [{ data: hoje(), saldo: base.saldo }].concat(base.ev) : [];
  const todos = pts.concat(ptsB);
  const ticks = niceTicks(Math.min(0, ...todos.map(p => p.saldo)), Math.max(1, ...todos.map(p => p.saldo)));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const y = v => P.t + (H - P.t - P.b) * (1 - (v - y0) / (y1 - y0));
  // um ponto por dia com movimento (saldo no fim do dia), ligados por uma curva suave
  const nos = fimDia[0].data === hoje() ? fimDia.slice() : [pts[0]].concat(fimDia);
  const ultimo = nos[nos.length - 1];
  const linha = curva(nos.map(p => [x(p.data), y(p.saldo)]).concat(ultimo.data < fim ? [[x(fim), y(ultimo.saldo)]] : []));
  const baseY = y(Math.max(0, y0));
  const menor = fimDia.reduce((m, p) => p.saldo < m.saldo ? p : m, fimDia[0]);
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Saldo da conta dia a dia">${defsLinha('g-dia')}`;
  s += gradeY(ticks, y, P.l, W - P.r);
  for (let k = 0; k <= 45; k += 7) { const d = addDia(hoje(), k); s += `<text x="${x(d)}" y="${H - 8}" text-anchor="middle">${k ? ddmm(d) : 'hoje'}</text>`; }
  s += `<path d="${linha}L${x(fim)},${baseY}L${x(hoje())},${baseY}Z" fill="url(#g-dia-a)" class="area"/>`;
  if (base) {
    const fimB = ptsB.filter((p, i) => !ptsB[i + 1] || ptsB[i + 1].data !== p.data), nosB = fimB[0].data === hoje() ? fimB : [ptsB[0]].concat(fimB), ultB = nosB[nosB.length - 1];
    s += `<path d="${curva(nosB.map(p => [x(p.data), y(p.saldo)]).concat(ultB.data < fim ? [[x(fim), y(ultB.saldo)]] : []))}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 6" opacity=".75"/>`;
  }
  s += `<path d="${linha}" fill="none" stroke="url(#g-dia-l)" stroke-width="3" stroke-linecap="round" filter="url(#g-dia-f)" class="linha" pathLength="1"/>`;
  s += nos.map(p => `<circle cx="${x(p.data)}" cy="${y(p.saldo)}" r="3.2" fill="var(--surface-solid)" stroke="var(--s1)" stroke-width="2"/>`).join('');
  const cm = menor.saldo < 0 ? 'var(--crit)' : 'var(--warn)';
  s += `<circle cx="${x(menor.data)}" cy="${y(menor.saldo)}" r="10" fill="${cm}" opacity=".18"/><circle cx="${x(menor.data)}" cy="${y(menor.saldo)}" r="5" fill="${cm}" stroke="var(--surface-solid)" stroke-width="2"/>`;
  const lx = Math.min(W - P.r - 60, Math.max(P.l + 60, x(menor.data))), ly = Math.max(P.t + 2, y(menor.saldo) - 34);
  s += `<g transform="translate(${lx},${ly})"><rect x="-58" y="0" width="116" height="22" rx="11" fill="var(--surface-solid)" stroke="var(--edge)"/><text x="0" y="15" text-anchor="middle" style="font-weight:700;fill:var(--text-2)">${fmtCurto(menor.saldo)} em ${ddmm(menor.data)}</text></g>`;
  s += `<line class="xh" y1="${P.t}" y2="${H - P.b}" stroke="var(--s1)" stroke-opacity=".35" stroke-dasharray="3 4" style="display:none"/>${pontoHover}</svg><div class="tip"></div>`;
  el.innerHTML = s;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = svg.querySelector('.xh'), dot = svg.querySelector('.dot'), halo = svg.querySelector('.halo');
  svg.addEventListener('pointermove', evt => {
    const r = svg.getBoundingClientRect(), mx = (evt.clientX - r.left) * (W / r.width);
    const dia = addDia(hoje(), Math.max(0, Math.min(45, Math.round((mx - P.l) / (W - P.l - P.r) * 45))));
    const ant = fimDia.filter(p => p.data <= dia), atual = ant[ant.length - 1], doDia = pts.filter(p => p.data === dia && p !== pts[0]);
    xh.setAttribute('x1', x(dia)); xh.setAttribute('x2', x(dia)); xh.style.display = '';
    for (const c of [dot, halo]) { c.setAttribute('cx', x(dia)); c.setAttribute('cy', y(atual.saldo)); c.style.display = doDia.length || dia === hoje() ? '' : 'none'; }
    tip.innerHTML = `<b>${ddmm(dia)}</b>Saldo: <span class="${atual.saldo < 0 ? 'neg' : ''}">${fmt.format(atual.saldo)}</span>` + doDia.map(e => `<br><span style="color:var(--text-2)">${esc(e.desc)}: <span class="${e.valor > 0 ? 'pos' : ''}">${e.valor > 0 ? '+' : '−'} ${fmt.format(Math.abs(e.valor))}</span></span>`).join('');
    tip.style.display = 'block';
    const px = x(dia) * (r.width / W);
    tip.style.left = Math.max(0, Math.min(px + 14, r.width - tip.offsetWidth)) + 'px';
    tip.style.top = '0px';
  });
  svg.addEventListener('pointerleave', () => { tip.style.display = 'none'; xh.style.display = 'none'; dot.style.display = 'none'; halo.style.display = 'none'; });
}

// Rosca de gastos por categoria: as 5 maiores + o resto
const CORES_CAT_PADRAO = ['#2563eb', '#5b8cff', '#7c5cf6', '#a78bfa', '#38bdf8', '#cbd5f5'];
let CORES_CAT = CORES_CAT_PADRAO;   // trocadas quando as cores seguem o fundo
function rosca(cats) {
  const total = cats.reduce((a, [, v]) => a + v, 0);
  if (!(total > 0)) return '';
  const fatias = cats.slice(0, 5).filter(([, v]) => v > 0);
  const resto = total - fatias.reduce((a, [, v]) => a + v, 0);
  if (resto > 0.005) fatias.push(['Outras', resto]);
  const R = 58, C = 2 * Math.PI * R, VAO = fatias.length > 1 ? 7 : 0;
  let acc = 0, arcos = '';
  fatias.forEach(([c, v], i) => {
    const len = v / total * C;
    arcos += `<circle r="${R}" cx="75" cy="75" fill="none" stroke="${CORES_CAT[i]}" stroke-width="15" stroke-linecap="round" stroke-dasharray="${Math.max(0.1, len - VAO)} ${C}" stroke-dashoffset="${-acc - VAO / 2}" transform="rotate(-90 75 75)"><title>${esc(c)}: ${fmt.format(v)}</title></circle>`;
    acc += len;
  });
  return `<div class="rosca"><svg viewBox="0 0 150 150" role="img" aria-label="Gastos por categoria"><circle r="${R}" cx="75" cy="75" fill="none" stroke="var(--grid)" stroke-width="15"/>${arcos}
    <text x="75" y="71" text-anchor="middle" style="font-size:17px;font-weight:800;fill:var(--text)">${fmtCurto(total)}</text><text x="75" y="89" text-anchor="middle" style="font-size:11px;fill:var(--muted)">total no mês</text></svg>
    <div class="leg">${fatias.map(([c, v], i) => `<div><span class="dot" style="background:${CORES_CAT[i]}"></span><span class="n">${esc(c)}</span><span class="v">${fmt.format(v)}</span><b>${Math.round(v / total * 100)}%</b></div>`).join('')}</div></div>`;
}

// Próximos `dias` dias com o saldo dia a dia a partir do saldo atual
function agenda(dias = 30) {
  const d = new Date(); d.setDate(d.getDate() + dias);
  const ev = eventos(hoje(), d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'));
  let saldo = S.saldoAtual;
  ev.forEach(e => e.saldo = saldo = r2(saldo + e.valor));
  return ev;
}

const ddmm = d => d.split('-').reverse().slice(0, 2).join('/');

// Ao informar o saldo de hoje, compara com o esperado: saldo anterior + o que estava previsto
// entre as duas datas (salários, contas, faturas, Pix planejados). A diferença é o que entrou
// ou saiu sem estar registrado.
function informarSaldo(novo) {
  const c = S.conferencia;
  // corrigindo no mesmo dia: compara de novo a partir da mesma base
  const base = c && c.ate === hoje() ? { saldo: c.anterior, data: c.de }
    : S.saldoData && S.saldoData < hoje() ? { saldo: S.saldoAtual, data: S.saldoData } : null;
  if (base) {
    const ev = eventos(base.data, hoje());
    const entradas = r2(ev.filter(e => e.valor > 0).reduce((a, e) => a + e.valor, 0));
    const saidas = r2(-ev.filter(e => e.valor < 0).reduce((a, e) => a + e.valor, 0));
    const esperado = r2(base.saldo + entradas - saidas);
    S.conferencia = { de: base.data, ate: hoje(), anterior: base.saldo, entradas, saidas, esperado, informado: novo, diff: r2(novo - esperado),
      ev: ev.map(e => ({ data: e.data, orig: e.orig, desc: e.desc, valor: e.valor, fixo: e.fixo, lanc: e.lanc, cartao: e.cartao })) };
  }
  S.saldoAtual = novo; S.saldoData = hoje();
  salvar();
}


// ---------- uma ocorrência de um item fixo, só desta vez ----------
// Ocorrências (pela data original) do mês passado até 4 meses à frente, para escolher
function opcoesOcorrencia(f) {
  const out = [];
  for (let i = -1; i <= 4; i++) for (const o of datasBase(f, addMes(mesAtual(), i))) out.push(o.orig);
  return out;
}
const valorNormal = (f, orig) => { const b = datasBase(f, orig.slice(0, 7)).find(o => o.orig === orig); return b ? r2(f.valor * b.p) : f.valor; };
function abrirOcorrencia(id, orig) {
  const f = S.fixos.find(x => x.id === id); if (!f) return;
  const ops = opcoesOcorrencia(f);
  if (!orig) orig = ops.find(o => ((f.movidos || {})[o] || o) >= hoje()) || ops[0];
  if (!orig) return alert('Este item não tem dia definido no mês.');
  if (!ops.includes(orig)) { ops.push(orig); ops.sort(); }
  const normal = valorNormal(f, orig), aj = (f.ajustes || {})[orig], mov = (f.movidos || {})[orig], receita = f.tipo === 'receita';
  const rot = o => `${dataBR(o)}${(f.movidos || {})[o] ? ' → ' + ddmm(f.movidos[o]) : ''}${(f.ajustes || {})[o] === 0 ? ' (não acontece)' : (f.ajustes || {})[o] != null ? ' · ' + fmt.format(f.ajustes[o]) : ''}${(f.pagos || []).some(p => p.data === o) ? (receita ? ' · já recebido' : ' · já pago') : ''}`;
  const dlg = document.getElementById('dlg');
  dlg.innerHTML = `<form id="f-oc" method="dialog">
    <h2>${ico('lapis')} ${esc(f.desc)} · só esta vez</h2>
    <div class="row">
      <label style="flex-basis:100%">Qual vez<select name="orig" id="oc-orig" data-fixo="${f.id}">${ops.map(o => `<option value="${o}" ${o === orig ? 'selected' : ''}>${rot(o)}</option>`).join('')}</select></label>
      <label>${receita ? 'Entra' : 'Sai'} em<input type="date" name="data" value="${mov || orig}"></label>
      <label>Valor desta vez (R$)<input name="valor" inputmode="decimal" value="${String(aj > 0 ? aj : normal).replace('.', ',')}"></label>
    </div>
    <label class="hint" style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" name="pular" ${aj === 0 ? 'checked' : ''}> Desta vez não acontece</label>
    <p class="hint">O normal é ${fmt.format(normal)} em ${dataBR(orig)}. Só esta vez muda: os outros meses continuam iguais, e a previsão, a agenda e o fim do mês já usam o que você colocar aqui.</p>
    <div class="row" style="justify-content:flex-end;margin-top:16px">
      ${aj != null || mov ? `<button type="button" class="btn" data-oc-normal="${f.id}|${orig}">Voltar ao normal</button>` : ''}
      <button type="button" class="btn" id="edit-cancelar">Cancelar</button>
      <button class="btn primary" value="${f.id}">Salvar</button>
    </div>
  </form>`;
  if (!dlg.open) dlg.showModal();
}
// Muda a ocorrência `orig` do item: valor (0 = não acontece) e data. Valor e data normais apagam a mudança.
function mudarOcorrencia(f, orig, { valor, data, pular }) {
  const normal = valorNormal(f, orig);
  f.ajustes = { ...(f.ajustes || {}) }; f.movidos = { ...(f.movidos || {}) };
  if (pular) f.ajustes[orig] = 0;
  else if (valor != null && Math.abs(valor - normal) >= 0.01) f.ajustes[orig] = r2(valor);
  else if (valor != null) delete f.ajustes[orig];
  if (pular || !data || data === orig) delete f.movidos[orig]; else f.movidos[orig] = data;
  if (!Object.keys(f.ajustes).length) delete f.ajustes;
  if (!Object.keys(f.movidos).length) delete f.movidos;
}
function salvarOcorrencia(fd, id) {
  const f = S.fixos.find(x => x.id === id), orig = fd.orig, v = num(fd.valor), data = fd.data || orig;
  if (!fd.pular && !(v > 0)) return alert('Informe um valor maior que zero (ou marque "Desta vez não acontece").');
  if (Math.abs(diasEntre(orig, data)) > 55) return alert('A nova data precisa ficar a até uns 55 dias da data normal.');
  mudarOcorrencia(f, orig, { valor: v, data, pular: !!fd.pular });
  document.getElementById('dlg').close();
  salvar();
}

// ---------- conferência do saldo: explicar a diferença ----------
// O que estava previsto no período da conferência (guardado na hora em que o saldo foi informado)
const evConf = c => c.ev || eventos(c.de, c.ate).map(e => ({ data: e.data, orig: e.orig, desc: e.desc, valor: e.valor, fixo: e.fixo, lanc: e.lanc, cartao: e.cartao }));
// Lançamentos sem cartão que se repetem nos últimos 4 meses: viram sugestões para explicar a diferença
function sugestoesConf(tipo) {
  const desde = addDia(hoje(), -120), grupos = {};
  for (const l of S.lanc) {
    if (l.cartao || l.tipo !== tipo || l.naoIdentificado || l.pagamentoFatura || l.data < desde || l.data > hoje()) continue;
    const k = l.desc.trim().toLowerCase();
    const g = grupos[k] = grupos[k] || { desc: l.desc.trim(), cat: l.cat, valor: l.valor, n: 0, ult: '' };
    g.n++; if (l.data >= g.ult) { g.ult = l.data; g.valor = l.valor; g.cat = l.cat; }
  }
  return Object.values(grupos).sort((a, b) => b.n - a.n || b.ult.localeCompare(a.ult)).slice(0, 8);
}

function linhasConf() {
  return [...document.querySelectorAll('#f-conf .cf-linha')].map(el => ({
    desc: el.querySelector('.cf-desc').value.trim(), valor: num(el.querySelector('.cf-valor').value), cat: el.querySelector('.cf-cat').value.trim() || 'Outros',
    data: el.querySelector('.cf-data').value || S.conferencia.ate, tipo: el.querySelector('.cf-tipo').value })).filter(x => x.valor > 0 || x.desc);
}
// diff = informado − esperado. Corrigir a previsão muda o esperado; o que é lançado agora também. O resto continua sem explicação.
function contaConf(form) {
  const c = S.conferencia, ev = evConf(c);
  let previsao = 0, lancado = 0;
  ev.forEach((e, k) => {
    const op = form.elements['p' + k] ? form.elements['p' + k].value : 'ok';
    if (op === 'valor') previsao += Math.sign(e.valor) * num(form.elements['pv' + k].value) - e.valor;
    else if (op === 'depois' || op === 'nao') previsao -= e.valor;
  });
  for (const x of linhasConf()) if (x.valor > 0) lancado += (x.tipo === 'receita' ? 1 : -1) * x.valor;
  return { previsao: r2(previsao), lancado: r2(lancado), falta: r2(c.diff - previsao - lancado) };
}
function resumoConf() {
  const form = document.getElementById('f-conf'); if (!form) return;
  form.querySelectorAll('.cf-prev').forEach(el => {
    const op = el.querySelector('select').value, ex = el.querySelector('.cf-extra');
    ex.style.display = op === 'valor' || op === 'depois' ? 'flex' : 'none';
    ex.querySelector('.cf-v').style.display = op === 'valor' ? '' : 'none';
    ex.querySelector('.cf-d').style.display = op === 'depois' ? '' : 'none';
  });
  const c = S.conferencia, r = contaConf(form), ok = Math.abs(r.falta) < 1;
  const L = (t, v) => `<div class="cl"><span>${t}</span><b>${v}</b></div>`;
  document.getElementById('cf-resumo').innerHTML = `<div class="cl-grupo">

    ${r.lancado ? L('Lançado agora', `${r.lancado > 0 ? '+' : '−'} ${fmt.format(Math.abs(r.lancado))}`) : ''}
    <div class="cl"><span><b>${ok ? 'Fechou' : 'Falta explicar'}</b></span><b class="${ok ? 'pos' : r.falta < 0 ? 'neg' : ''}">${ok ? '✓' : `${r.falta < 0 ? 'saiu' : 'entrou'} ${fmt.format(Math.abs(r.falta))}`}</b></div>

}

function salvarConferencia(form) {
  const c = S.conferencia, ev = evConf(c), r = contaConf(form), linhas = linhasConf();
  if (linhas.some(x => !(x.valor > 0) || !x.desc)) return alert('Cada linha do passo 2 precisa de descrição e valor (ou tire a linha com ✕).');
  for (let k = 0; k < ev.length; k++) {

    if (op === 'ok') continue;
    const valor = num(form.elements['pv' + k].value), data = form.elements['pd' + k].value;
    if (op === 'depois' && !(data > hoje())) return alert(`"${e.desc}": informe uma data depois de hoje.`);
    if (op === 'valor' && !(valor >= 0)) return alert(`"${e.desc}": informe o valor.`);
    const f = e.fixo && S.fixos.find(x => x.id === e.fixo), l = e.lanc && S.lanc.find(x => x.id === e.lanc);
    if (f) mudarOcorrencia(f, e.orig || e.data, op === 'valor' ? { valor, data: (f.movidos || {})[e.orig] } : op === 'depois' ? { data } : { pular: true });
    else if (l) { if (op === 'valor') l.valor = r2(valor); else if (op === 'depois') l.data = data; else S.lanc = S.lanc.filter(x => x !== l); }

function pendencias() {

  if (dias === null) p.push({ txt: 'Saldo na conta de hoje nunca foi informado: a agenda e a projeção partem dele.', acao: 'saldo', botao: 'Informar' });
  else if (dias > 3) p.push({ txt: `Saldo atualizado há ${dias} dias.`, acao: 'saldo', botao: 'Atualizar' });
  for (const c of cartoesUsados()) {
    const falta = [!melhorDia(c) && 'melhor dia de compra', !diaVencimento(c) && 'vencimento'].filter(Boolean);
    if (falta.length) p.push({ txt: `${c} sem dia de ${falta.join(' e ')}: a fatura não aparece na agenda nem no "ainda vai sair".`, acao: 'fatura', botao: 'Informar' });
  }
  for (const f of S.fixos) {
    if (f.fim && f.fim < mesAtual()) continue;
    if (f.inicio > mesAtual()) { if (!f.inicioOk) p.push({ txt: `"${f.desc}" só conta a partir de ${nomeMes(f.inicio)}; em ${nomeMes(mesAtual())} ele não entra.`, edit: f.id, botao: 'Editar', certo: f.id }); }

  const semReceita = meses.filter(m => { const t = totais(itensDoMes(m)); return t.d > 0 && t.r === 0; });

  return p;
}

// Quanto da fatura do cartão que fecha em `fech` é de outra pessoa (sua mãe): a parte que não é sua
// das compras divididas, as compras da fatura importada marcadas "não é meu" e a diferença do valor informado.
function parteOutros(c, fech) {
  const venc = vencimentoDe(c, fech);
  let v = 0;
  for (const l of S.lanc) if (l.cartao === c && l.tipo === 'despesa' && l.share && l.share < 1 && vencDoLanc(l) === venc) v += l.valor / l.share - l.valor;
  // contas fixas deste cartão (academia, assinaturas) já entram na sua parte: o item delas na fatura não é da mãe
  const fixosCartao = S.fixos.filter(x => x.cartao === c && x.tipo === 'despesa' && fixoAtivo(x, fech.slice(0, 7)));
  for (const f of S.faturas) {
    if (f.banco !== c || (S.cartaoDiaUtil[c] ? proxDiaUtil(f.vencimento) : f.vencimento) !== venc) continue;
    const soltos = f.itens.filter(it => !S.lanc.some(l => l.key === it.key && !l.prevista));
    const perto = (x, valor) => Math.abs(x.valor - valor) <= Math.max(1, x.valor * 0.05);
    const doFixo = new Set();
    for (const x of fixosCartao) {   // a conta fixa pode vir num item só ou dividida em dois (ex.: duas academias)
      const um = soltos.find(it => !doFixo.has(it) && perto(x, it.valor));
      if (um) { doFixo.add(um); continue; }
      par: for (let a = 0; a < soltos.length; a++) for (let b = a + 1; b < soltos.length; b++) {
        if (doFixo.has(soltos[a]) || doFixo.has(soltos[b]) || soltos[a].data !== soltos[b].data || soltos[a].sec !== 'despesa' || soltos[b].sec !== 'despesa' || !perto(x, soltos[a].valor + soltos[b].valor)) continue;
        doFixo.add(soltos[a]); doFixo.add(soltos[b]); break par;
      }
    }
    for (const it of soltos) if (!doFixo.has(it)) v += it.valor;
  }
  // próximas parcelas das compras parceladas que não são suas (vieram na fatura, marcadas "não é meu");
  // numa fatura já importada elas já estão nos itens dela
  const importada = S.faturas.some(f => f.banco === c && (S.cartaoDiaUtil[c] ? proxDiaUtil(f.vencimento) : f.vencimento) === venc);
  for (const f of importada ? [] : S.faturas) {
    if (f.banco !== c) continue;
    for (const it of f.itens) {
      if (!it.parc || it.parc.n >= it.parc.N || it.valor <= 0 || S.lanc.some(l => l.key === it.key)) continue;
      for (let k = it.parc.n + 1; k <= it.parc.N; k++) {
        const quando = addMes(f.fechamento.slice(0, 7), k - it.parc.n) + f.fechamento.slice(7);
        if (vencimentoDe(c, fechamentoDaCompra(c, quando)) === venc) v += it.valor;
      }
    }
  }
  const info = S.infoFatura[c];
  if (info && info.fech === fech && info.total > info.minha) v += info.total - info.minha;
  return r2(v);
}

          ${prox ? `<div><button class="btn" style="padding:4px 10px;font-size:12px;margin-top:4px" data-info-fatura="${esc(c)}">Informar valor</button></div>` : ''}</td>

          <label class="hint" style="margin:0 0 0 6px" title="Se cair em fim de semana ou feriado, passa para o próximo dia útil"><input type="checkbox" data-util-cartao="${esc(c)}" ${S.cartaoDiaUtil[c] ? 'checked' : ''}> dia útil</label>
          <div style="margin-top:4px">${Object.entries(S.viradaAntecipada[c] || {}).filter(([, f]) => f >= fechamentoAnterior(c, hoje())).map(([ym, f]) => `<span class="tag" title="Compras a partir de ${ddmm(addDia(f, 1))} vão para a fatura seguinte">virada antecipada: fecha ${ddmm(f)} <button class="link" data-desfazer-virada="${esc(c)}|${ym}" title="Desfazer">✕</button></span>`).join('')}

    }).join('')}

    <p class="hint">"Informar valor": digite quanto a fatura está agora no app do banco. O que o app já conhece (parcelas, assinaturas, compras lançadas) é mantido e só a diferença vira um lançamento do cartão; ao informar de novo, ele é substituído, e some quando você importar o PDF da fatura. "Já previsto" soma as parcelas de faturas anteriores que caem nesta, os fixos no cartão (assinaturas) e as compras que você lançou à mão. "Compras a partir do dia" é o melhor dia de compra: desse dia em diante a compra vai para a fatura seguinte (a fatura fecha no dia anterior). Marque "dia útil" se o banco passa o melhor dia e o vencimento para o próximo dia útil quando caem em fim de semana ou feriado.</p>
  </div>`;
}

function confirmarImportacao() {
  let novos = 0, futuras = 0;
  for (const it of imp.itens) {
    // valor em reais vale só para esta compra: não vira regra da loja
    if (it.escolha && !(it.escolha === 'div' && it.meu != null)) S.regras[it.desc] = { escolha: it.escolha, cat: it.cat, ...(it.escolha === 'div' ? { k: it.k, n: it.n } : {}) };
    if (!it.escolha) continue;   // sem marcação: não mexe no que já existe
    const manual = it.manual && S.lanc.find(l => l.id === it.manual);
    if (manual) {
      const c = manual.compra;
      S.lanc = S.lanc.filter(l => l !== manual && !(c && l.provisorio && l.compra.id === c.id && (it.escolha === 'nao' || impFuturas) && l.compra.n > c.n));
    }
    if (it.prevista) S.lanc = S.lanc.filter(l => l.id !== it.prevista);
    if (it.escolha === 'nao') {
      // não é seu: tira o lançamento (se já existia) e as parcelas planejadas dele
      S.lanc = S.lanc.filter(l => l.key !== it.key && !(l.prevista && l.key.startsWith(it.base + '|')));
      continue;
    }
    const share = fracao(it);
    const data = it.sec === 'despesa' && impModo === 'compra' ? it.data : imp.fechamento;
    const desc = it.desc + (it.parc ? ` (${it.parc.n}/${it.parc.N})` : '') + rotuloFracao(share);
    S.lanc = S.lanc.filter(l => l.key !== it.key && !(l.prevista && l.key && it.parc && mesmaParcela(l, { cartao: imp.banco, key: it.key })));
    S.lanc.push({ id: uid(), tipo: 'despesa', data, desc, cat: it.cat || 'Outros', valor: r2(it.valor * share), share, key: it.key, origem: 'fatura', cartao: imp.banco, parcela: !!it.parc, ...(imp.aberta ? { aberta: imp.banco + '|' + imp.fechamento } : {}) });
    novos++;
    if (it.parc && impFuturas) {
      for (let k = it.parc.n + 1; k <= it.parc.N; k++) {
        const key = it.base + '|' + k;
        S.lanc = S.lanc.filter(l => l.key !== key && !parcelaPrevistaIgual(l, { desc: it.desc, valor: it.valor, data: it.data, parc: { n: k, N: it.parc.N } }, imp.banco));
        S.lanc.push({ id: uid(), tipo: 'despesa', data: fechamentoEm(imp.banco, addMes(imp.fechamento.slice(0, 7), k - it.parc.n)) || addMes(imp.fechamento.slice(0, 7), k - it.parc.n) + '-' + imp.fechamento.slice(8), desc: `${it.desc} (${k}/${it.parc.N})` + rotuloFracao(share), cat: it.cat || 'Outros', valor: r2(it.valor * share), share, key, origem: 'fatura', cartao: imp.banco, parcela: true, prevista: true });
        futuras++;
      }
    }
    if (it.cat && !S.cats.includes(it.cat)) S.cats.push(it.cat);
  }
  // a diferença informada pelo app do banco dá lugar às compras detalhadas desta fatura
  const pertoDoFech = d => Math.abs(new Date(d) - new Date(imp.fechamento)) <= 7 * 864e5;
  S.lanc = S.lanc.filter(l => !(l.agregado && l.cartao === imp.banco && pertoDoFech(l.fech)));
  if (S.infoFatura[imp.banco] && pertoDoFech(S.infoFatura[imp.banco].fech)) delete S.infoFatura[imp.banco];
  // guarda a fatura para poder revisar depois sem o PDF
  const id = imp.banco + '|' + imp.fechamento;
  if (!imp.aberta) {
    // a fatura fechada (PDF) substitui a versão aberta dela: o que não casou com nenhum item do PDF sai
    const abertas = new Set(S.faturas.filter(f => f.aberta && f.banco === imp.banco && Math.abs(new Date(f.vencimento) - new Date(imp.vencimento)) <= 7 * 864e5).map(f => f.id));
    S.lanc = S.lanc.filter(l => !(l.aberta && abertas.has(l.aberta) && !l.prevista));
    S.faturas = S.faturas.filter(f => !abertas.has(f.id));
  }
  S.faturas = S.faturas.filter(f => f.id !== id).concat({
    id, banco: imp.banco, fechamento: imp.fechamento, vencimento: imp.vencimento, ...(imp.aberta ? { aberta: true, total: imp.totalFatura } : {}),
    itens: imp.itens.map(({ sec, data, desc, parc, valor, base, key }) => ({ sec, data, desc, parc, valor, base, key })),
  });
  if (imp.pendente) S.faturasPendentes = (S.faturasPendentes || []).filter(x => x.id !== imp.pendente);
  const mes = imp.fechamento.slice(0, 7), revisao = imp.revisao;
  imp = null; aba = 'visao'; mesSel = mes;
  salvar();
  alert(revisao ? `Fatura corrigida: ${novos} lançamentos seus nesta fatura.` : `${novos} lançamentos importados` + (futuras ? ` e ${futuras} parcelas futuras planejadas.` : '.'));
}

// Descrição sem os sufixos que o app acrescenta: " (2/10)" e " · metade" / " · 2/3 seu"
const descBase = d => d.replace(/ · (metade|\d+\/\d+ seu|\d+% seu)$/, '').replace(/ \(\d+\/\d+\)$/, '');
const sufixoParcela = d => (d.replace(/ · (metade|\d+\/\d+ seu|\d+% seu)$/, '').match(/ \(\d+\/\d+\)$/) || [''])[0];
// Outras parcelas da mesma compra (lançada à mão ou vinda da fatura)
function parcelasIrmas(l) {
  if (l.provisorio && l.compra && l.compra.N > 1) return S.lanc.filter(x => x.provisorio && x.compra && x.compra.id === l.compra.id);
  if (l.parcela && l.key) { const base = l.key.slice(0, l.key.lastIndexOf('|') + 1); return S.lanc.filter(x => x.parcela && x.key && x.key.startsWith(base)); }
  return [l];
}
const OPCOES_PARTE = [[1, 'Tudo'], [1 / 2, 'Metade'], [2 / 3, '2/3'], [1 / 3, '1/3'], [3 / 4, '3/4'], [1 / 4, '1/4']];

function abrirEdicao(id) {

      <label>Sua parte<select name="parte">${opcoes.map(([v, t]) => `<option value="${v}" ${Math.abs(v - share) < 0.001 ? 'selected' : ''}>${t}</option>`).join('')}</select></label>

    ${irmas.length > 1 ? `<label class="hint" style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" name="todas" checked> Aplicar a todas as ${irmas.length} parcelas desta compra (a data de cada uma não muda)</label>` : ''}
    ${l.origem === 'fatura' ? `<p class="hint">Veio de uma fatura. Se você revisar a fatura depois, o que for marcado lá substitui esta edição.</p>` : ''}
    <div class="row" style="justify-content:flex-end;margin-top:16px">

      <button class="btn primary" value="${l.id}">Salvar</button>

  </form>`;

function salvarEdicao(f, id) {
  const l = S.lanc.find(l => l.id === id), total = num(f.valor), meu = f.parteValor.trim() ? num(f.parteValor) : null;
  if (!(total > 0)) return alert('Informe um valor maior que zero.');
  if (meu != null && !(meu > 0 && meu <= total)) return alert('"Quanto é seu" precisa ser maior que zero e até o valor total.');
  const share = meu != null ? meu / total : +f.parte;
  const sinal = l.valor < 0 ? -1 : 1, base = f.desc.trim();
  const alvo = f.todas ? parcelasIrmas(l) : [l];
  for (const x of alvo) {
    Object.assign(x, { tipo: f.tipo, cat: f.cat.trim(), share, valor: sinal * r2(total * share), desc: base + sufixoParcela(x.desc) + rotuloFracao(share) });
    if (f.cartao) x.cartao = f.cartao; else delete x.cartao;
    if (x.compra) x.compra.valor = total;
  }
  l.data = f.data;   // a data só muda no lançamento aberto
  document.getElementById('dlg').close();
  salvar();
}

  S.infoFatura[c] = { fech, total, minha, data: hoje(), conhecido };

}

// ---------- render ----------
// ---------- simulação ----------
// Gastos (ou entradas) de mentira que passam pelas mesmas regras de um lançamento de verdade: cartão,
// melhor dia de compra, fatura em que caem, parcelas e sua parte. Ficam só neste aparelho e não entram
// nos dados nem na sincronização até você clicar em "Lançar de verdade".
const SIM_KEY = 'financas.sim';
let SIM = (() => { try { return JSON.parse(localStorage.getItem(SIM_KEY)) || []; } catch (e) { return []; } })();
const gravarSim = () => { try { localStorage.setItem(SIM_KEY, JSON.stringify(SIM)); } catch (e) {} };
// Os lançamentos que um formulário de lançamento gera (o mesmo caminho do "Adicionar")
// Sua parte escolhida no formulário: fração (2/3) ou valor em reais (do mesmo jeito que o Valor: total ou de cada parcela).
// null = valor seu inválido.
function shareDoForm(f, valor) {
  if (f.parte === 'valor') { const v = num(f.parteValor); return v > 0 && v <= valor ? v / valor : null; }
  const fr = lerFracao(f.parte); return fr ? fr.k / fr.n : 1;
}
function lancsDoForm(f, destino = []) {
  const valor = num(f.valor), share = shareDoForm(f, valor) ?? 1;
  if (f.cartao && f.tipo === 'despesa') return lancarCompraCartao(f, valor, share, destino);
  destino.push({ id: uid(), tipo: f.tipo, data: f.data, desc: f.desc.trim() + rotuloFracao(share), cat: f.cat.trim(), valor: r2(valor * share), share, ...(f.cartao ? { cartao: f.cartao } : {}) });
  return destino;
}
// Roda `fn` como se os itens simulados já estivessem lançados. Pix/débito com data até hoje sai do
// saldo de hoje (a agenda só conta o que vem depois de hoje).
function comSimulacao(fn, itens = SIM.filter(s => s.on)) {
  if (!itens.length) return fn();
  const lanc = S.lanc, saldo = S.saldoAtual;
  let hojeAjuste = 0;
  const extra = itens.flatMap(s => lancsDoForm(s.f)).filter(l => {
    if (l.cartao || l.data > hoje()) return true;
    hojeAjuste += l.tipo === 'receita' ? l.valor : -l.valor; return false;
  });
  S.lanc = lanc.concat(extra); S.saldoAtual = r2(saldo + hojeAjuste);
  try { return fn(); } finally { S.lanc = lanc; S.saldoAtual = saldo; }
}
// Quando cada item simulado pesa na conta
function ondeCai(f) {
  const ls = lancsDoForm(f);
  if (!f.cartao || f.tipo !== 'despesa') return f.data <= hoje() ? (f.tipo === 'receita' ? 'entra hoje' : 'sai da conta hoje') : `${f.tipo === 'receita' ? 'entra' : 'sai'} em ${ddmm(f.data)}`;
  const vs = ls.map(vencDoLanc);
  if (vs.some(v => !v)) return `${nomeCartao(f.cartao)} sem dia de fechamento: conta no mês da compra`;
  const p = ls.length > 1 ? `${ls.length}x de ${fmt.format(ls[0].valor)} · ` : '';
  return `${p}fatura ${nomeCartao(f.cartao)} que vence ${ddmm(vs[0])}${vs.length > 1 ? ` (última ${ddmm(vs[vs.length - 1])})` : ''}`;
}
// Sugestões pela loja: regra marcada nas faturas importadas ou o último lançamento com a mesma descrição
const baseDesc = d => String(d).replace(/\s*\(\d+\/\d+\)/, '').replace(/\s*·.*$/, '').trim();
function sugestaoLoja(desc) {
  const k = semAcento(baseDesc(desc));
  if (!k) return null;
  const regra = Object.entries(S.regras).find(([d]) => semAcento(d) === k);
  const ult = S.lanc.filter(l => semAcento(baseDesc(l.desc)) === k).sort((a, b) => b.data.localeCompare(a.data))[0];
  if (!regra && !ult) return null;
  const r = regra && regra[1], parte = !r ? (ult.share && ult.share !== 1 ? fracaoTxt(ult.share) : '1')
    : r.escolha === 'metade' ? '1/2' : r.escolha === 'div' ? `${r.k}/${r.n}` : r.escolha === 'nao' ? null : '1';
  return { cat: (r && r.cat) || (ult && ult.cat), cartao: ult && ult.cartao, parte, nao: r && r.escolha === 'nao', origem: regra ? 'regra das faturas' : 'último lançamento' };
}
function aplicarSugestao(form) {
  const s = sugestaoLoja(form.desc.value), dica = form.parentElement.querySelector('.sug');
  if (dica) dica.innerHTML = '';
  if (!s) return;
  if (s.cat && !form.cat.value) form.cat.value = s.cat;
  if (s.parte && !form.parte.dataset.mexeu && [...form.parte.options].some(o => o.value === s.parte)) form.parte.value = s.parte;
  if (s.cartao && !form.cartao.dataset.mexeu && [...form.cartao.options].some(o => o.value === s.cartao)) form.cartao.value = s.cartao;
  if (dica) dica.innerHTML = `${ico('lapis')} Preenchido pela ${s.origem}: ${esc(s.cat || '')}${s.parte && s.parte !== '1' ? ` · sua parte ${s.parte}` : ''}${s.cartao ? ` · ${esc(nomeCartao(s.cartao))}` : ''}${s.nao ? ' · <b>nas faturas você marca essa loja como "não é meu"</b>' : ''}`;
}
const camposLanc = (id, dataPadrao, cartao) => `

// diferença entre os cenários; `subirEhRuim` para valores de fatura
const difTxt = (a, b, subirEhRuim) => { const d = r2(b - a); return Math.abs(d) < .01 ? '<span class="sim-dif">sem mudança</span>' : `<span class="sim-dif ${(d < 0) !== !!subirEhRuim ? 'neg' : 'pos'}">${d < 0 ? '−' : '+'} ${fmt.format(Math.abs(d))}</span>`; };

function telaSim() {
  const ativos = SIM.filter(s => s.on);

  const fim = base.proj[0], fimS = sim.proj[0], k6 = Math.min(5, base.proj.length - 1);
  const lvTxt = lv => lv.valor < 0 ? `falta ${fmt.format(-lv.valor)} em ${ddmm(lv.ate)}` : `${fmt.format(lv.valor)} · ${fmt.format(lv.porDia)}/dia`;
  // faturas que mudam
  const faturas = [];
  comSimulacao(() => cartoesUsados()).forEach(c => {
    if (!diaFechamento(c) || !diaVencimento(c)) return;
    for (let i = 0; i <= Math.min(12, S.horizonte); i++) for (const fech of faturasQueVencem(c, addMes(mesAtual(), i))) {
      const a = valorFatura(c, fech), b = comSimulacao(() => valorFatura(c, fech));
      if (Math.abs(b - a) >= .01) faturas.push({ c, venc: vencimentoDe(c, fech), a, b });
    }
  });
  // limites do orçamento afetados (no mês em que cada gasto pesa)
  const orc = [];
  for (const s of ativos) {
    const cat = s.f.cat.trim(), lim = S.orc[cat];
    if (!(lim > 0) || s.f.tipo !== 'despesa') continue;
    const m = mesDoLanc(lancsDoForm(s.f)[0]);
    if (orc.some(o => o.cat === cat && o.m === m)) continue;
    const gasto = () => itensDoMes(m).filter(i => i.tipo === 'despesa' && i.cat === cat).reduce((a, i) => a + i.valor, 0);
    orc.push({ cat, m, lim, a: r2(gasto()), b: r2(comSimulacao(gasto)) });
  }
  const descs = [...new Set(Object.keys(S.regras).concat(S.lanc.map(l => baseDesc(l.desc))))].sort().slice(0, 400);
  return `

  </div>

  ${SIM.length ? `
  <div class="tiles sim-tiles">
    <div class="tile"><div><div class="lbl">Na conta no fim de ${nomeMes(fim.m)}</div><div class="val">${fmt.format(fimS.saldo)}</div><div class="sub2">sem simular ${fmt.format(fim.saldo)} · ${difTxt(fim.saldo, fimS.saldo)}</div></div></div>
    <div class="tile ${sim.lv.valor < 0 ? 'sim-ruim' : ''}"><div><div class="lbl">${sim.lv.valor < 0 ? 'Vai faltar' : 'Livre pra gastar'} <span class="sub">· 45 dias</span></div><div class="val ${sim.lv.valor < 0 ? 'neg' : ''}">${fmt.format(Math.abs(sim.lv.valor))}</div><div class="sub2">sem simular ${lvTxt(base.lv)} · ${difTxt(base.lv.valor, sim.lv.valor)}</div></div></div>
    <div class="tile"><div><div class="lbl">Na conta no fim de ${nomeMes(base.proj[k6].m)}</div><div class="val">${fmt.format(sim.proj[k6].saldo)}</div><div class="sub2">sem simular ${fmt.format(base.proj[k6].saldo)} · ${difTxt(base.proj[k6].saldo, sim.proj[k6].saldo)}</div></div></div>
  </div>
  <div class="g21">
    <div class="card"><h2>${ico('grafico')} Saldo na conta <span class="sub">· próximos 45 dias</span><span class="leg-pill sim-leg"><i></i>com a simulação <i class="tr"></i>sem</span></h2><div class="chart" id="sim-dia"></div></div>
    <div class="card"><h2>${ico('lista')} Itens simulados <span class="sub">· ${ativos.length} de ${SIM.length} ligados</span></h2>
      <div class="sim-lista">${SIM.map(s => `<div class="sim-it ${s.on ? '' : 'off'}">
        <label class="sim-on" title="${s.on ? 'Desligar' : 'Ligar'} na simulação"><input type="checkbox" data-sim-on="${s.id}" ${s.on ? 'checked' : ''}></label>
        <div class="sim-txt"><b>${esc(s.f.desc)}</b><small>${esc(ondeCai(s.f))}${s.f.parte === 'valor' ? ` · seu ${fmt.format(num(s.f.parteValor))}` : s.f.parte !== '1' ? ` · sua parte ${esc(s.f.parte)}` : ''}</small></div>
        <div class="sim-val"><b class="${s.f.tipo === 'receita' ? 'pos' : ''}">${s.f.tipo === 'receita' ? '+' : '−'} ${fmt.format(num(s.f.valor))}</b>
          <span><button class="link" data-sim-lancar="${s.id}" title="Virar um lançamento de verdade">lançar</button><button class="link" data-sim-del="${s.id}" title="Tirar da simulação">✕</button></span></div>
      </div>`).join('')}</div>
      <div class="row" style="margin-top:14px"><button class="btn" data-sim-limpar style="flex:0 0 auto">Limpar simulação</button></div>

      </tbody></table></div>

}

// ---------- movimento ----------
const reduzirMovimento = matchMedia('(prefers-reduced-motion: reduce)');
// Valores em destaque sobem do zero até o número certo quando a tela entra
function contarValores(raiz) {
  for (const el of raiz.querySelectorAll('.big, .tile .val')) {
    const txt = el.textContent.trim(), m = txt.match(/^(-?)R\$\s?(-?)([\d.]+,\d{2})$/);
    if (!m || el.children.length) continue;
    const alvo = +(m[3].replace(/\./g, '').replace(',', '.')) * (m[1] || m[2] ? -1 : 1);
    if (!alvo) continue;
    const t0 = performance.now(), dur = 700;
    el.style.minWidth = el.offsetWidth + 'px';
    const passo = agora => {
      if (!el.isConnected) return;
      const k = Math.min(1, (agora - t0) / dur), e = 1 - Math.pow(1 - k, 4);
      el.textContent = k < 1 ? fmt.format(alvo * e) : txt;
      if (k < 1) requestAnimationFrame(passo); else el.style.minWidth = '';
    };
    requestAnimationFrame(passo);
  }
}
// Troca de tema: o novo tema se espalha num círculo a partir do botão (onde o navegador permite)
function trocarTema(origem) {
  const aplicar = () => {
    const escuro = document.documentElement.dataset.theme !== 'dark';
    if (escuro) document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme;
    try { localStorage.setItem('financas.tema', escuro ? 'dark' : 'light'); } catch (e) {}
    aplicarFundo(); render();
  };
  if (!document.startViewTransition || reduzirMovimento.matches) return aplicar();
  const r = origem.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  const raio = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  document.startViewTransition(aplicar).ready.then(() => {
    document.documentElement.animate({ clipPath: [`circle(0 at ${x}px ${y}px)`, `circle(${raio}px at ${x}px ${y}px)`] },
      { duration: 650, easing: 'cubic-bezier(.4, 0, .2, 1)', pseudoElement: '::view-transition-new(root)' });
  }).catch(() => {});
}

// ---------- busca ----------
// Procura em todos os lançamentos (descrição, categoria, cartão, data e valor), nos itens fixos,
// nas categorias, nos cartões e nas telas do app. Todas as palavras precisam aparecer (sem acento,
// sem diferenciar maiúsculas). O índice é refeito a cada render, quando os dados podem ter mudado.
const semAcento = t => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
let _indice = null;
function indiceBusca() {
  if (!_indice) _indice = S.lanc.map(l => ({ l, t: semAcento([l.desc, l.cat, l.cartao || 'pix debito', dataBR(dataDaCompra(l)), fmt.format(l.valor), l.tipo].join(' ')) }));
  return _indice;
}
const ATALHOS = [['Novo lançamento', 'lanc', 'lista', 'adicionar despesa receita compra'], ['Importar fatura', 'fatura', 'envia', 'pdf cartao'],
  ['Informar saldo de hoje', 'saldo', 'carteira', 'conta conferir'], ['Projeção dos próximos meses', 'proj', 'grafico', 'futuro previsao'],
  ['Orçamento e limites', 'orc', 'alvo', 'limite categoria'], ['Itens fixos', 'fixos', 'repete', 'salario conta assinatura'], ['Dados e sincronização', 'dados', 'dados', 'backup github exportar']];
function buscar(q) {
  const tokens = semAcento(q).split(/\s+/).filter(Boolean);
  if (!tokens.length) return null;
  const casa = t => tokens.every(k => t.includes(k));
  const lanc = indiceBusca().filter(x => casa(x.t)).map(x => x.l).sort((a, b) => dataDaCompra(b).localeCompare(dataDaCompra(a)));
  const fixos = S.fixos.filter(f => casa(semAcento([f.desc, f.cat, f.cartao || '', fmt.format(f.valor)].join(' '))));
  const cats = catsUsadas().filter(c => casa(semAcento(c)));
  const cartoes = cartoesUsados().filter(c => casa(semAcento(c)));
  const atalhos = ATALHOS.filter(a => casa(semAcento(a[0] + ' ' + a[3])));
  return { tokens, lanc, fixos, cats, cartoes, atalhos };
}
// Destaca as palavras buscadas no texto (o texto sem acento tem as mesmas posições do original)
function marcar(txt, tokens) {
  const base = semAcento(txt);
  if (base.length !== txt.length) return esc(txt);
  const on = new Array(txt.length).fill(false);
  for (const k of tokens) { let i = base.indexOf(k); while (i >= 0) { for (let j = i; j < i + k.length; j++) on[j] = true; i = base.indexOf(k, i + 1); } }
  let out = '', aberto = false;
  for (let i = 0; i < txt.length; i++) {
    if (on[i] !== aberto) { out += on[i] ? '<mark>' : '</mark>'; aberto = on[i]; }
    out += esc(txt[i]);
  }
  return out + (aberto ? '</mark>' : '');
}
const somaDesp = ls => r2(ls.reduce((a, l) => a + (l.tipo === 'despesa' ? l.valor : 0), 0));
function mostrarBusca(q) {
  const box = document.getElementById('busca-res'), r = buscar(q);
  if (!r) { box.hidden = true; box.innerHTML = ''; return; }
  const grupo = (titulo, extra, itens) => itens ? `<div class="bg"><div class="bg-t">${titulo}${extra ? `<span>${extra}</span>` : ''}</div>${itens}</div>` : '';
  const linha = (alvo, av, titulo, sub, valor) => `<button type="button" class="br" data-br="${esc(alvo)}">${av}<span class="br-t"><b>${titulo}</b><small>${sub}</small></span>${valor ? `<span class="br-v">${valor}</span>` : ''}</button>`;
  const avCat = c => `<span class="av-cat" style="--c:${corCategoria(c)}">${esc((c || '?').charAt(0).toUpperCase())}</span>`;

  const html =
    grupo('Lançamentos', r.lanc.length ? `${r.lanc.length} · ${fmt.format(somaDesp(r.lanc))} em gastos` : '', r.lanc.slice(0, 6).map(l => linha('lanc:' + l.id, avCat(l.cat), marcar(l.desc, r.tokens),
      `${dataBR(dataDaCompra(l))} · ${marcar(l.cat, r.tokens)} · ${esc(nomeCartao(l.cartao || SEM_CARTAO))}`, `<span class="${l.tipo === 'receita' ? 'pos' : ''}">${l.tipo === 'receita' ? '+' : '−'} ${fmt.format(l.valor)}</span>`)).join(''))
    + grupo('Categorias', '', r.cats.slice(0, 4).map(c => { const ls = S.lanc.filter(l => l.cat === c); return linha('cat:' + c, avCat(c), marcar(c, r.tokens), `${ls.length} lançamentos`, fmt.format(somaDesp(ls))); }).join(''))
    + grupo('Cartões', '', r.cartoes.slice(0, 4).map(c => { const ls = S.lanc.filter(l => l.cartao === c); return linha('cartao:' + c, avIco('cartao', corCartao(c)), marcar(c, r.tokens), `${ls.length} lançamentos`, fmt.format(somaDesp(ls))); }).join(''))
    + grupo('Fixos', '', r.fixos.slice(0, 4).map(f => linha('fixo:' + f.id, avIco('repete', f.tipo === 'receita' ? 'var(--good)' : 'var(--warn)'), marcar(f.desc, r.tokens), `${esc(f.cat)} · ${f.tipo === 'receita' ? 'receita' : 'despesa'} fixa`, fmt.format(f.valor))).join(''))
    + grupo('Ir para', '', r.atalhos.slice(0, 4).map(a => linha('ir:' + a[1], avIco(a[2], 'var(--accent)'), marcar(a[0], r.tokens), 'atalho', '')).join(''));
  box.innerHTML = (html || `<div class="busca-vazia">Nada encontrado para “${esc(q)}”.</div>`)

  box.hidden = false;
  const prim = box.querySelector('.br'); if (prim) prim.classList.add('sel');
