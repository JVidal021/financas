<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minhas Finanças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>try { if (localStorage.getItem('financas.tema') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}</script>
<style>
:root {
  color-scheme: light;
  --fundo: linear-gradient(160deg, #0a2cc0 0%, #1748ec 32%, #2f68ff 62%, #6f9bff 88%, #a8c4ff 100%);
  --brilho: radial-gradient(1000px 560px at 50% 45%, rgba(255, 255, 255, .28), transparent 70%);
  --janela: rgba(255, 255, 255, .32);
  --janela-borda: rgba(255, 255, 255, .7);
  --lateral: rgba(255, 255, 255, .45);
  --surface: rgba(255, 255, 255, .6);
  --card: linear-gradient(150deg, rgba(255, 255, 255, .8) 0%, rgba(255, 255, 255, .52) 100%);
  --card-borda: rgba(255, 255, 255, .85);
  --card-sombra: 0 10px 30px rgba(28, 60, 175, .10), inset 0 1px 0 rgba(255, 255, 255, .95);
  --jt: 36px; --jx: max(40px, calc((100vw - 1360px) / 2));
  --stat-bg: rgba(255, 255, 255, .42); --menu-on: rgba(255, 255, 255, .75);
  --surface-2: rgba(255, 255, 255, .55);
  --surface-solid: #ffffff;
  --border: rgba(255, 255, 255, .95);
  --edge: rgba(23, 50, 130, .09);
  --grid: rgba(23, 50, 130, .08);
  --text: #0e1a3d;
  --text-2: #3c4968;
  --muted: #67728f;
  --accent: #2563eb;
  --accent-soft: rgba(37, 99, 235, .10);
  --hero: linear-gradient(135deg, #1d4ed8 0%, #2f74f5 55%, #38bdf8 100%);
  --s1: #3b6cf6;
  --s2: #f97316;
  --violeta: #8b5cf6;
  --good: #10a36b;
  --warn: #c98a00;
  --crit: #e5484d;
  --radius: 18px;
  --shadow: 0 1px 2px rgba(20, 45, 120, .05), 0 8px 24px rgba(20, 45, 120, .07);
  --header-bg: rgba(255, 255, 255, .62);
  --cubo-a: rgba(255, 255, 255, .78); --cubo-b: rgba(170, 200, 255, .38); --cubo-c: rgba(30, 90, 240, .5);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --fundo: linear-gradient(162deg, #030820 0%, #08196b 34%, #12339f 62%, #1c47c4 100%);
  --brilho: radial-gradient(900px 600px at 50% 38%, rgba(80, 130, 255, .22), transparent 70%);
  --janela: rgba(6, 14, 44, .40);
  --janela-borda: rgba(255, 255, 255, .14);
  --lateral: rgba(8, 16, 50, .25);
  --surface: rgba(24, 38, 92, .55); --surface-2: rgba(34, 52, 112, .5); --surface-solid: #111c44;
  --card: linear-gradient(150deg, rgba(44, 66, 140, .55) 0%, rgba(16, 26, 70, .42) 100%);
  --card-borda: rgba(255, 255, 255, .12);
  --card-sombra: 0 10px 30px rgba(0, 0, 0, .25), inset 0 1px 0 rgba(255, 255, 255, .08);
  --stat-bg: rgba(255, 255, 255, .06); --menu-on: rgba(107, 155, 255, .18);
  --border: rgba(255, 255, 255, .08); --edge: rgba(255, 255, 255, .08); --grid: rgba(255, 255, 255, .08);
  --text: #eef2ff; --text-2: #b6c2e2; --muted: #7f8db3;
  --accent: #6b9bff; --accent-soft: rgba(107, 155, 255, .16);
  --s1: #6b9bff; --s2: #fb8a3c; --violeta: #a78bfa;
  --good: #3fd193; --warn: #eab308; --crit: #f87171;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .3);
  --header-bg: rgba(12, 20, 56, .6);
  --cubo-a: rgba(160, 190, 255, .35); --cubo-b: rgba(70, 110, 230, .25); --cubo-c: rgba(10, 30, 120, .55);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: #1f57f5; color: var(--text);
  font: 15px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* fundo: degradê azul com blocos de vidro flutuando */
html { background: #1748ec; }
#fundo, #fundo-vidro { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100lvh; z-index: -2; overflow: hidden; pointer-events: none; }
#fundo, .fv-in { background: var(--brilho), var(--fundo); }
#fundo-vidro { z-index: -1; clip-path: inset(var(--jt) var(--jx) round 30px); }
.fv-in { position: absolute; inset: -80px; filter: blur(30px) saturate(1.35); }
.fv-in .cubo { box-shadow: inset 8px 8px 18px rgba(255, 255, 255, .75), inset -14px -20px 34px rgba(18, 60, 200, .5); }
.cubo { position: absolute; aspect-ratio: 1; border-radius: 24%;
  background: linear-gradient(145deg, var(--cubo-a) 0%, var(--cubo-b) 42%, var(--cubo-c) 100%);
  border: 1.5px solid rgba(255, 255, 255, .75);
  box-shadow: inset 8px 8px 18px rgba(255, 255, 255, .75), inset -14px -20px 34px rgba(18, 60, 200, .45), 30px 46px 80px rgba(8, 30, 140, .38);
  display: grid; place-items: center; }
.cubo::before { content: ""; position: absolute; left: 9%; right: 9%; top: 7%; height: 38%; border-radius: 40% 40% 50% 50% / 60% 60% 40% 40%;
  background: linear-gradient(180deg, rgba(255, 255, 255, .75), rgba(255, 255, 255, 0)); }
.cubo::after { content: ""; position: absolute; inset: -1.5px; border-radius: inherit; background: linear-gradient(135deg, rgba(255, 255, 255, .4), transparent 35%, transparent 70%, rgba(120, 170, 255, .3)); }
.cubo svg { width: 46%; height: 46%; fill: none; stroke: #1f5bff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 4px 8px rgba(30, 90, 255, .5)); position: relative; z-index: 1; }
.c1 { width: 260px; left: -70px; top: -60px; transform: rotate(-18deg); }
.fv-in .c1 { left: 10px; top: 20px; }
.fv-in .c5 { width: 200px; right: 22%; top: 34%; opacity: .9; }
.fv-in .c6 { width: 160px; left: 34%; top: 8%; opacity: .9; }
.fv-in .c7 { width: 240px; left: 48%; bottom: -40px; transform: rotate(18deg); }
.c2 { width: 190px; right: -50px; top: 7%; transform: rotate(22deg); }
.c3 { width: 210px; left: 2%; bottom: -50px; transform: rotate(-10deg); }
.c4 { width: 150px; right: 7%; bottom: 3%; transform: rotate(14deg); opacity: .8; }
.c5 { width: 80px; right: 26%; top: 44%; transform: rotate(32deg); opacity: .5; }
.c6 { width: 64px; left: 30%; top: 4%; transform: rotate(-26deg); opacity: .5; }

/* janela de vidro que envolve o app */
.janela { position: relative; isolation: isolate; width: min(1320px, calc(100% - 112px)); margin: 44px auto; border-radius: 30px; display: grid; grid-template-columns: 1fr; min-height: calc(100vh - 88px); }
.janela::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: var(--janela); border: 1px solid var(--janela-borda);
  box-shadow: 0 40px 110px rgba(6, 28, 120, .38), inset 0 1px 0 rgba(255, 255, 255, .7); }
.conteudo { min-width: 0; }
@media (min-width: 721px) {
  body { overflow: hidden; }
  .janela { position: fixed; top: var(--jt); bottom: var(--jt); left: var(--jx); right: var(--jx); width: auto; margin: 0; min-height: 0; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
  .conteudo { display: flex; flex-direction: column; min-height: 0; }
  .topo { position: relative; flex: none; }
  .topo::before { background: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
  main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(60, 90, 200, .3) transparent; }
  main::-webkit-scrollbar { width: 8px; } main::-webkit-scrollbar-thumb { background: rgba(60, 90, 200, .28); border-radius: 8px; }
}

/* topo */
.topo { position: sticky; top: 0; z-index: 10; }
.topo::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--header-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--edge); border-radius: 30px 30px 0 0; }
header { padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
.logo { width: 38px; height: 38px; border-radius: 12px; background: var(--hero); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 16px rgba(37, 99, 235, .4); flex: none; }
.titulo { flex: 1; min-width: 0; }
header h1 { font-size: 22px; font-weight: 750; letter-spacing: -.02em; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
header h1 .app-nome { display: none; }
.saud { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#sync-st { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 22vw; }
#mes { border-radius: 99px; padding: 8px 14px; font-weight: 600; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); }
.ibtn { position: relative; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow); flex: none; }
.ibtn:hover { color: var(--accent); }
.ibtn .ponto { position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--crit); box-shadow: 0 0 0 2px var(--surface-solid); }
.perfil { display: flex; align-items: center; gap: 10px; padding-left: 6px; }
.perfil .av { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, #2563eb, #8b5cf6); color: #fff; display: grid; place-items: center; font-weight: 700; box-shadow: 0 4px 12px rgba(37, 99, 235, .35); }
.perfil b { display: block; font-size: 14px; line-height: 1.2; }
.perfil small { color: var(--muted); font-size: 12px; }

/* busca */
.busca { position: relative; flex: 0 1 380px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); color: var(--muted); transition: box-shadow .15s, border-color .15s; }
.busca:focus-within { border-color: color-mix(in srgb, var(--accent) 45%, transparent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
.busca input { flex: 1; border: 0; background: none; padding: 0; height: 100%; box-shadow: none !important; font-size: 14px; }
.busca input::-webkit-search-cancel-button { display: none; }
.busca kbd, .br kbd { font: 600 11px "Inter", system-ui, sans-serif; color: var(--muted); background: var(--surface-2); border: 1px solid var(--edge); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
.busca-res { position: absolute; left: 0; right: 0; top: calc(100% + 8px); min-width: 380px; max-height: min(70vh, 560px); overflow-y: auto; background: var(--surface-solid); border: 1px solid var(--edge); border-radius: 18px; box-shadow: 0 24px 60px rgba(10, 30, 110, .22); padding: 8px; z-index: 30; color: var(--text); }
.bg + .bg { border-top: 1px solid var(--grid); margin-top: 6px; padding-top: 6px; }
.bg-t { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px 10px 4px; }
.bg-t span { text-transform: none; letter-spacing: 0; font-weight: 600; }
.br { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: none; color: inherit; font: inherit; padding: 7px 10px; border-radius: 12px; cursor: pointer; }
.br:hover, .br.sel { background: var(--accent-soft); }
.br-t b { display: block; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.br-t small { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.br-v { font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.br .av-cat svg.i { width: 15px; height: 15px; }
.br-todos { display: flex; justify-content: space-between; margin-top: 6px; border-top: 1px solid var(--grid); border-radius: 0 0 12px 12px; color: var(--accent); font-weight: 650; font-size: 13.5px; padding: 11px 12px; }
.busca-vazia { padding: 18px; text-align: center; color: var(--muted); font-size: 14px; }
mark { background: color-mix(in srgb, var(--accent) 18%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
.so-cel { display: none; }
header { position: relative; }
.mes-pill { display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 6px 0 14px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); color: var(--muted); cursor: pointer; }
.mes-pill #mes { border: 0; background: none; box-shadow: none; padding: 0 8px 0 0; height: 100%; font-weight: 600; font-size: 14px; cursor: pointer; }
.leg-pill { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--edge); border-radius: 99px; padding: 3px 10px; }
.leg-pill i { width: 18px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--s1), var(--violeta)); }

/* menu */
nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 12px 18px 0; }
nav::-webkit-scrollbar { display: none; }
nav .curto { display: none; }
nav button { display: flex; align-items: center; gap: 11px; background: none; border: 0; padding: 9px 14px; border-radius: 12px; color: var(--text); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s; }
nav button svg.i { color: var(--text-2); transition: color .15s; }
nav button:hover { background: color-mix(in srgb, var(--surface-solid) 60%, transparent); color: var(--text); }
nav button.on { background: var(--menu-on); color: var(--accent); font-weight: 650; box-shadow: inset 0 0 0 1px rgba(37, 99, 235, .10); }
nav button.on svg.i { color: var(--accent); }
nav .sec, .lado-card { display: none; }
nav .badge { margin-left: auto; font-style: normal; font-size: 11px; font-weight: 700; background: var(--accent); color: #fff; border-radius: 99px; padding: 1px 7px; line-height: 1.5; }
.marca { display: none; }
main { padding: 18px 24px 36px; }

/* cartões de conteúdo */
.card { background: var(--card); border: 1px solid var(--card-borda); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--card-sombra); }
.card h2 { font-size: 15px; font-weight: 650; margin: 0 0 16px; letter-spacing: -.005em; display: flex; align-items: center; gap: 8px; }
.card h2 .sub { font-weight: 500; color: var(--muted); font-size: 13px; }
.card h2 .acao { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--accent); white-space: nowrap; }
.card h2 .leg-pill + .acao { margin-left: 8px; }
.card h2 > svg.i { width: 30px; height: 30px; padding: 7px; border-radius: 9px; color: var(--accent); background: var(--accent-soft); }
.hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 16px; }
.tile { background: var(--card); border: 1px solid var(--card-borda); border-radius: var(--radius); padding: 18px; box-shadow: var(--card-sombra); display: flex; gap: 12px; align-items: flex-start; }
.tile > div:last-child { flex: 1; min-width: 0; }
.tile .ico { order: 2; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 13%, transparent); flex: none; }
.tile .ico svg.i { width: 20px; height: 20px; }
.tile .lbl { color: var(--text-2); font-size: 13px; font-weight: 550; }
.tile .val { font-size: 25px; font-weight: 750; margin-top: 4px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tile .sub2 { font-size: 12px; color: var(--muted); margin-top: 4px; }
.delta { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; margin-top: 6px; }
.delta span { font-weight: 500; color: var(--muted); }
.delta.bom { color: var(--good); }
.delta.ruim { color: var(--crit); }
.cat-row .dl { font-size: 11px; font-weight: 700; margin-left: 4px; }
.cat-row .dl.bom { color: var(--good); } .cat-row .dl.ruim { color: var(--crit); }

/* destaque do mês (cartão branco, cor só nos ícones) */
.hero { background: var(--card); border: 1px solid var(--card-borda); border-radius: var(--radius); padding: 22px; margin-bottom: 16px; box-shadow: var(--card-sombra); position: relative; }
.hero .hero-ico { position: absolute; right: 20px; top: 20px; width: 48px; height: 48px; border-radius: 14px; background: var(--hero); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 18px rgba(37, 99, 235, .35); }
.hero .lbl { font-size: 14px; color: var(--text-2); font-weight: 550; }
.hero .big { font-size: 38px; font-weight: 800; letter-spacing: -.03em; margin: 2px 0 16px; font-variant-numeric: tabular-nums; }
.hero .stats { display: flex; gap: 10px; flex-wrap: wrap; }
.hero .stat { background: var(--stat-bg); border: 1px solid var(--card-borda); border-radius: 14px; padding: 10px 14px; min-width: 150px; flex: 1 1 150px; display: flex; gap: 10px; align-items: center; }
.hero .stat > svg.i { width: 34px; height: 34px; padding: 8px; border-radius: 10px; color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 13%, transparent); }
.hero .stat small { display: block; font-size: 12px; color: var(--muted); }
.hero .stat b { font-size: 16px; font-variant-numeric: tabular-nums; }
.hero .orc { margin-top: 14px; font-size: 13px; color: var(--text-2); }
.hero .orc .bar { height: 7px; border-radius: 99px; background: var(--grid); margin-top: 6px; overflow: hidden; }
.hero .orc .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--violeta)); }
/* destaque de um cartão (mantém a cor do cartão) */
.hero.cor { color: #fff; border-color: rgba(255, 255, 255, .25); box-shadow: 0 14px 34px rgba(20, 40, 120, .25); overflow: hidden; }
.hero.cor .lbl, .hero.cor .stat small { color: rgba(255, 255, 255, .85); }
.hero.cor .stat { background: rgba(255, 255, 255, .15); border-color: rgba(255, 255, 255, .18); }
.hero.cor .stat > svg.i { color: #fff; background: rgba(255, 255, 255, .18); }

.destaque { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
.destaque > .hero, .destaque > .card { margin-bottom: 0; }
.livre .big { font-size: 34px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.livre h2 svg.i { width: 30px; height: 30px; padding: 6px; border-radius: 9px; color: var(--violeta); background: color-mix(in srgb, var(--violeta) 14%, transparent); }
.livre .pill { display: inline-flex; gap: 6px; align-items: center; margin-top: 12px; padding: 6px 12px; border-radius: 99px; font-size: 13px; font-weight: 650; color: var(--accent); background: var(--accent-soft); }
.livre .medidor { height: 8px; border-radius: 99px; background: var(--grid); margin-top: 14px; overflow: hidden; }
.livre .medidor i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--violeta)); }
.livre.aperto .big { color: var(--crit); }
.livre.aperto .pill { color: var(--crit); background: color-mix(in srgb, var(--crit) 11%, transparent); }

/* grades */
.grid2, .g21 { display: grid; gap: 16px; margin-bottom: 16px; }
.grid2 { grid-template-columns: 1fr 1fr; }
.g21 { grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); }
.grid2 > .card, .g21 > .card { margin-bottom: 0; min-width: 0; }

/* rosca de categorias */
.rosca { display: flex; gap: 18px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.rosca svg { width: 150px; height: 150px; flex: none; }
.rosca .leg { flex: 1 1 160px; display: grid; gap: 7px; font-size: 13px; }
.rosca .leg div { display: flex; align-items: center; gap: 8px; }
.rosca .leg b { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 36px; text-align: right; }
.rosca .leg .v { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.rosca .leg span.n { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* atividade (próximos dias) */
.feed { display: grid; gap: 2px; }
.ev { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 8px; border-radius: 12px; }
.ev:hover { background: var(--surface-2); }
.ev.menor { background: color-mix(in srgb, var(--warn) 11%, transparent); }
.ev-ico { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.ev-ico svg.i { width: 17px; height: 17px; }
.ev-txt b { display: block; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* formulários */

<script>
const KEY = 'financas.v1';
const CATS_PADRAO = ['Moradia', 'Alimentação', 'Mercado', 'Transporte', 'Saúde', 'Academia', 'Celular', 'Pets', 'Educação', 'Lazer', 'Compras', 'Assinaturas', 'Encargos', 'Outros', 'Salário', 'Freelance'];

const fmt = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });

const ICONES = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  lista: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  repete: '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
  alvo: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  grafico: '<path d="m3 17 6-6 4 4 8-8"/><path d="M14 7h7v7"/>',
  envia: '<path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/>',
  dados: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  carteira: '<path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/><path d="M21 9h-6a3 3 0 0 0 0 6h6z"/>',
  cartao: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
  pix: '<path d="M12 3 3 12l9 9 9-9z"/><path d="m8 12 4-4 4 4-4 4z"/>',

  lupa: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  lua: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  sol: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  sino: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
  desce: '<path d="M7 7l10 10M17 9v8H9"/>',
  pizza: '<path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>',

};
const ico = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONES[n]}</svg>`;
// [id, nome, ícone, nome curto da barra do celular]
const ABAS = [['visao', 'Visão geral', 'home', 'Início'], ['lanc', 'Lançamentos', 'lista', 'Lançar'], ['fixos', 'Fixos', 'repete', 'Fixos'],
  ['orc', 'Orçamento', 'alvo', 'Limites'], ['proj', 'Projeção', 'grafico', 'Projeção'], ['fatura', 'Importar fatura', 'envia', 'Fatura'], ['dados', 'Dados', 'dados', 'Dados']];

// Cartões: cada lançamento pode ter um cartão (importados da fatura já vêm com o banco).
// Sem cartão = Pix, débito ou dinheiro.
const SEM_CARTAO = '';
const FIXAS = '#fixas';   // itens fixos sem cartão (aluguel, contas em boleto/débito automático)
const CORES_CARTAO = { 'Itaú': '#ec7000', 'Santander': '#d93a3a', 'Nubank': '#8a3ffc', 'Bradesco': '#cc2c74' };
const CORES_EXTRA = ['#2a78d6', '#1baf7a', '#c98500', '#6250d6'];
const corCartao = c => !c ? '#8a8fa3' : c === FIXAS ? '#1baf7a' : CORES_CARTAO[c] || CORES_EXTRA[[...c].reduce((a, ch) => a + ch.charCodeAt(0), 0) % CORES_EXTRA.length];
const nomeCartao = c => c === FIXAS ? 'Contas fixas' : c || 'Pix / débito';
const grupoCartao = i => i.cartao || (i.fixo ? FIXAS : SEM_CARTAO);
const tagCartao = c => `<span class="tag"><span class="dot" style="background:${corCartao(c)}"></span>${esc(nomeCartao(c))}</span>`;
let cartaoSel = null;   // null = todos
function cartoesUsados() {
  const set = new Set();
  S.lanc.concat(S.fixos).forEach(i => { if (i.cartao) set.add(i.cartao); });
  return [...set].sort();
}
// com um cartão selecionado, só despesas: receita (salário etc.) não é gasto de cartão nenhum
const filtraCartao = itens => cartaoSel === null ? itens : itens.filter(i => i.tipo === 'despesa' && grupoCartao(i) === cartaoSel);
function chipsCartao() {
  const cs = cartoesUsados();
  if (!cs.length) return '';
  const chip = (v, txt, cor) => `<button class="chip ${cartaoSel === v ? 'on' : ''}" data-cartao="${v === null ? '*' : esc(v)}">${cor ? `<span class="dot" style="background:${cor}"></span>` : ''}${txt}</button>`;
  return `<div class="chips">${chip(null, 'Todos')}${cs.map(c => chip(c, esc(c), corCartao(c))).join('')}${S.fixos.some(f => f.tipo === 'despesa' && !f.cartao) ? chip(FIXAS, 'Contas fixas', corCartao(FIXAS)) : ''}${chip(SEM_CARTAO, 'Pix / débito', corCartao(SEM_CARTAO))}</div>`;
}
const opcoesCartao = (atual = SEM_CARTAO) => [SEM_CARTAO, ...new Set([...cartoesUsados(), ...Object.keys(LEITORES)])]
  .map(c => `<option value="${esc(c)}" ${c === atual ? 'selected' : ''}>${esc(nomeCartao(c))}</option>`).join('');

const fmtCurto = v => Math.abs(v) >= 1000 ? 'R$ ' + (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil' : fmt.format(v);

// ---------- estado ----------
function novoEstado() {

  return { saldoAtual: 0, lanc: [], fixos: [], orc: {}, cats: CATS_PADRAO.slice(), ajuste: 0, horizonte: 12, regras: {}, faturas: [], diasFechamento: {}, diasVencimento: {}, cartaoDiaUtil: {}, infoFatura: {}, melhorDia: {}, viradaAntecipada: {} };
}
// Ajusta dados salvos por versões antigas do app.
function normalizar(d) {
  const s = Object.assign(novoEstado(), d);
  // a primeira versão do importador só lia Santander e não gravava o cartão
  s.lanc.forEach(l => { if (l.origem === 'fatura' && !l.cartao) l.cartao = 'Santander'; });
  // parcela prevista que já chegou numa fatura com centavos diferentes: fica só a da fatura
  const reais = s.lanc.filter(l => l.parcela && !l.prevista && l.key);
  s.lanc = s.lanc.filter(l => !(l.prevista && l.key && reais.some(r => mesmaParcela(l, r))));

}
// Mesma parcela da mesma compra: mesmo cartão, descrição, número/total de parcelas e valor até R$ 1 de diferença.
// A chave é "descrição|valor|data|total|número".
function mesmaParcela(a, b) {

  const x = a.key.split('|'), y = b.key.split('|');
  return x.length === 5 && y.length === 5 && x[0] === y[0] && x[3] === y[3] && x[4] === y[4] && Math.abs(+x[1] - +y[1]) <= 1;

// ---------- sincronização (arquivo dados.json num repositório privado do GitHub) ----------
const SYNC_KEY = 'financas.sync';
let sync = (() => { try { return JSON.parse(localStorage.getItem(SYNC_KEY)); } catch (e) { return null; } })();
let syncSha = null, timerEnvio = null, syncStatus = '';

function statusSync(s) {
  syncStatus = s;
  const el = document.getElementById('sync-st');
  if (el) el.textContent = s;
}
async function ghArquivo(metodo, corpo) {
  const r = await fetch(`https://api.github.com/repos/${sync.repo}/contents/dados.json`, {
    method: metodo, cache: 'no-store',
    headers: { Authorization: 'Bearer ' + sync.token, Accept: 'application/vnd.github+json' },
    body: corpo && JSON.stringify(corpo),
  });
  if (r.status === 404 && metodo === 'GET') return null;
  if (!r.ok) {
    const e = new Error(r.status === 401 ? 'token inválido ou expirado' : r.status === 403 || r.status === 404 ? 'sem acesso ao repositório ' + sync.repo : 'erro ' + r.status);
    e.status = r.status;

  }
  return r.json();
}
const b64enc = s => { let bin = ''; new TextEncoder().encode(s).forEach(c => bin += String.fromCharCode(c)); return btoa(bin); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0)));

async function lerNuvem() {
  const r = await ghArquivo('GET');

}
// Fica com a versão mais recente: a da nuvem ou a deste aparelho.
async function puxar() {
  if (!sync) return;
  statusSync('☁ sincronizando…');
  try {
    const remoto = await lerNuvem();
    if (remoto && (remoto.atualizado || 0) > (S.atualizado || 0)) {
      S = normalizar(remoto);
      gravarLocal(); render();
    } else if (!remoto || (S.atualizado || 0) > (remoto.atualizado || 0)) {
      return enviar();
    }
    statusSync('☁ sincronizado');
  } catch (e) { statusSync('☁ ' + e.message); }
}
async function enviar(tentarDeNovo = true) {
  if (!sync) return;
  clearTimeout(timerEnvio); timerEnvio = null;
  statusSync('☁ salvando…');
  try {
    const r = await ghArquivo('PUT', { message: 'Atualiza dados', content: b64enc(JSON.stringify(S)), ...(syncSha ? { sha: syncSha } : {}) });
    syncSha = r.content.sha;
    statusSync('☁ sincronizado');
  } catch (e) {
    // outro aparelho salvou no meio do caminho: pega a versão atual do arquivo e grava por cima
    if ((e.status === 409 || e.status === 422) && tentarDeNovo) {
      try { await lerNuvem(); return enviar(false); } catch (e2) { e = e2; }
    }
    statusSync('☁ ' + e.message);
  }
}
function agendarEnvio() {
  if (!sync) return;
  clearTimeout(timerEnvio);
  statusSync('☁ alterações pendentes');
  timerEnvio = setTimeout(enviar, 1500);
}
async function conectarSync(token, repo) {
  sync = { token, repo };
  statusSync('☁ conectando…');
  try {
    const remoto = await lerNuvem();
    const temLocal = S.lanc.length || S.fixos.length;
    if (remoto && temLocal && !confirm(`Já existem dados na nuvem (${(remoto.lanc || []).length} lançamentos).\n\nOK = usar os dados da nuvem neste aparelho\nCancelar = substituir a nuvem pelos dados deste aparelho`)) {
      S.atualizado = Date.now();
      await enviar();
    } else if (remoto) {
      S = normalizar(remoto);
      gravarLocal();
      statusSync('☁ sincronizado');
    } else {
      await enviar();
    }
    try { localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); } catch (e) {}
  } catch (e) {
    sync = null;
    statusSync('');
    alert('Não consegui conectar: ' + e.message);
  }
  render();
}

// ---------- cálculos ----------
const fixoAtivo = (f, m) => f.inicio <= m && (!f.fim || m <= f.fim);

// Vencimento da fatura em que cai um lançamento no cartão (null se o cartão não tem os dias).
// Compras de uma fatura importada usam o vencimento que está no PDF; o resto segue a regra do cartão.
const _venc = new Map();
// Fatura importada é fatura fechada: o que não veio no PDF não entra nela. Compra lançada à mão vai
// para a fatura seguinte; parcela prevista que não veio fica fora de tudo (IGNORADA).
const IGNORADA = '0000-00-00';
let _vencImportado = null, _fechadas = null;
function vencDoLanc(l) {
  if (!l.cartao) return null;

      const v = S.cartaoDiaUtil[f.banco] ? proxDiaUtil(f.vencimento) : f.vencimento;
      _fechadas.add(f.banco + '|' + v);

  if (!melhorDia(l.cartao) || !diaVencimento(l.cartao)) return null;
  const k = l.cartao + '|' + l.data + (l.prevista ? '|p' : '');

// Mês em que o lançamento pesa na conta: compra no cartão no mês do vencimento da fatura
const mesDoLanc = l => (vencDoLanc(l) || l.data).slice(0, 7);
function itensDoMes(m) {
  const fx = S.fixos.filter(f => fixoAtivo(f, m)).map(f => ({ ...f, fixo: true }));
  const lc = S.lanc.filter(l => mesDoLanc(l) === m);
  return fx.concat(lc);
}
function totais(itens) {
  let r = 0, d = 0;
  for (const i of itens) i.tipo === 'receita' ? r += i.valor : d += i.valor;
  return { r, d, saldo: r - d };
}
// Média mensal de compras novas (sem parcelas) dos últimos 3 meses com dados.
// `filtro` escolhe os lançamentos: os de um cartão ou os sem cartão (Pix/débito).
function mediaCompras(filtro) {
  const ls = S.lanc.filter(l => l.tipo === 'despesa' && !l.parcela && !l.agregado && !l.prevista && l.data <= hoje() && filtro(l));
  const meses = [];
  for (let i = 1; i <= 3; i++) { const m = addMes(mesAtual(), -i); if (ls.some(l => l.data.slice(0, 7) === m)) meses.push(m); }
  if (!meses.length) return 0;

const fatorAjuste = () => 1 + S.ajuste / 100;
const diasEntre = (a, b) => (new Date(b) - new Date(a)) / 864e5;
// Compras novas que ainda devem entrar na fatura que fecha em `fech`: a média do cartão
// proporcional à parte do ciclo que ainda não aconteceu (zero se a fatura já fechou).
function estimativaFatura(c, fech) {
  if (!fech || fech <= hoje()) return 0;
  const ant = fechamentoAnterior(c, fech), ini = ant > hoje() ? ant : hoje();

// Datas de fechamento das faturas do cartão que vencem no mês `m`
const faturasQueVencem = (c, m) => [fechamentoEm(c, addMes(m, -1)), fechamentoEm(c, m)].filter(f => f && vencimentoDe(c, f) && vencimentoDe(c, f).slice(0, 7) === m);

// Projeção pelo dinheiro que entra e sai da conta: salários e contas fixas no mês em que caem,

// pela média. O mês atual só conta o que ainda falta (o resto já está no saldo de hoje).
function projecao() {

  let saldo = S.saldoAtual;

    add('Planejados (Pix/débito)', semCartao.filter(l => l.tipo === 'despesa').reduce((a, l) => a + l.valor, 0));
    add('Pix/débito (média)', r2(media.semCartao * fator));

      if (diaFechamento(c) && diaVencimento(c)) {
        for (const fech of faturasQueVencem(c, m)) add(`Fatura ${c} (vence ${ddmm(vencimentoDe(c, fech))})`, r2(valorFatura(c, fech) + estimativaFatura(c, fech)));

// ---------- gráficos ----------
function niceTicks(min, max, n = 4) {
  if (min === max) { max = min + 1; }
  const span = max - min, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(k => k * mag).find(s => s >= step0);
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const t = []; for (let v = lo; v <= hi + step / 2; v += step) t.push(+v.toFixed(2));
  return t;
}

// Curva suave que passa por todos os pontos sem criar picos ou vales que não existem
// (interpolação monotônica de Fritsch–Carlson). `ps` = [[x, y], ...] em ordem de x.
function curva(ps) {
  const n = ps.length;
  if (n < 2) return n ? `M${ps[0][0]},${ps[0][1]}` : '';
  const dx = [], m = [], t = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = ps[i + 1][0] - ps[i][0]; m[i] = dx[i] ? (ps[i + 1][1] - ps[i][1]) / dx[i] : 0; }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (!m[i]) { t[i] = 0; t[i + 1] = 0; continue; }
    const a = t[i] / m[i], b = t[i + 1] / m[i], h = a * a + b * b;
    if (h > 9) { const k = 3 / Math.sqrt(h); t[i] = k * a * m[i]; t[i + 1] = k * b * m[i]; }
  }
  let d = `M${ps[0][0]},${ps[0][1]}`;
  for (let i = 0; i < n - 1; i++) d += `C${ps[i][0] + dx[i] / 3},${ps[i][1] + t[i] * dx[i] / 3} ${ps[i + 1][0] - dx[i] / 3},${ps[i + 1][1] - t[i + 1] * dx[i] / 3} ${ps[i + 1][0]},${ps[i + 1][1]}`;
  return d;
}
// Degradês e brilho usados pelas linhas de saldo
const defsLinha = id => `<defs><linearGradient id="${id}-a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--violeta)" stop-opacity=".26"/><stop offset=".6" stop-color="var(--s1)" stop-opacity=".08"/><stop offset="1" stop-color="var(--s1)" stop-opacity="0"/></linearGradient>
  <linearGradient id="${id}-l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--s1)"/><stop offset="1" stop-color="var(--violeta)"/></linearGradient>
  <filter id="${id}-f" x="-5%" y="-30%" width="110%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4f6bff" flood-opacity=".28"/></filter></defs>`;
const gradeY = (ticks, y, x0, x1) => ticks.map(t => `<line x1="${x0}" x2="${x1}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1" stroke-dasharray="${t === 0 ? '0' : '4 5'}"${t === 0 ? ' style="stroke:var(--muted);opacity:.45"' : ''}/><text x="${x0 - 10}" y="${y(t) + 4}" text-anchor="end">${fmtCurto(t)}</text>`).join('');
const pontoHover = `<circle class="halo" r="11" fill="var(--s1)" opacity=".16" style="display:none"/><circle class="dot" r="5.5" fill="var(--surface-solid)" stroke="var(--s1)" stroke-width="3" style="display:none"/>`;

function linhaSaldo(el, linhas) {
  const W = el.clientWidth || 600, H = 260, P = { l: 64, r: 16, t: 12, b: 28 };
  const vals = linhas.map(l => l.saldo).concat([S.saldoAtual]);
  const ticks = niceTicks(Math.min(0, ...vals), Math.max(0, ...vals));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const pts = [{ m: mesAtual(), saldo: S.saldoAtual, atual: true }].concat(linhas);
  const x = i => P.l + (W - P.l - P.r) * (i / Math.max(1, pts.length - 1));
  const y = v => P.t + (H - P.t - P.b) * (1 - (v - y0) / (y1 - y0));
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Saldo projetado por mês">`;
  s += gradeY(ticks, y, P.l, W - P.r);
  const every = Math.ceil(pts.length / Math.max(2, Math.floor((W - P.l) / 60)));
  pts.forEach((p, i) => { if (i % every === 0) s += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${p.atual ? 'hoje' : nomeMes(p.m)}</text>`; });
  const trilha = curva(pts.map((p, i) => [x(i), y(p.saldo)]));

  s += `<path d="${trilha}L${x(pts.length - 1)},${y(Math.max(0, y0))}L${x(0)},${y(Math.max(0, y0))}Z" fill="url(#g-proj-a)"/>`;
  s += `<path d="${trilha}" fill="none" stroke="url(#g-proj-l)" stroke-width="3" stroke-linecap="round" filter="url(#g-proj-f)"/>`;
  s += pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.saldo)}" r="3.2" fill="var(--surface-solid)" stroke="var(--s1)" stroke-width="2"/>`).join('');
  s += `<line class="xh" y1="${P.t}" y2="${H - P.b}" stroke="var(--s1)" stroke-opacity=".35" stroke-width="1" stroke-dasharray="3 4" style="display:none"/>${pontoHover}`;
  s += `<rect x="${P.l}" y="0" width="${W - P.l - P.r}" height="${H}" fill="transparent" class="hit"/></svg><div class="tip"></div>`;
  el.innerHTML = s;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = svg.querySelector('.xh'), dot = svg.querySelector('.dot'), halo = svg.querySelector('.halo');
  const mover = ev => {
    const r = svg.getBoundingClientRect(), mx = (ev.clientX - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(pts.length - 1, Math.round((mx - P.l) / ((W - P.l - P.r) / Math.max(1, pts.length - 1)))));
    const p = pts[i];
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.style.display = '';
    for (const c of [dot, halo]) { c.setAttribute('cx', x(i)); c.setAttribute('cy', y(p.saldo)); c.style.display = ''; }
    tip.innerHTML = `<b>${p.atual ? 'Hoje' : nomeMes(p.m)}</b>Saldo: ${fmt.format(p.saldo)}` + (p.atual ? '' : `<br><span style="color:var(--text-2)">No mês: <span class="${p.liq < 0 ? 'neg' : 'pos'}">${fmt.format(p.liq)}</span></span>`);
    tip.style.display = 'block';
    const px = x(i) * (r.width / W);
    tip.style.left = Math.min(px + 12, r.width - tip.offsetWidth) + 'px';
    tip.style.top = Math.max(0, y(p.saldo) * (r.height / H) - tip.offsetHeight - 10) + 'px';
  };
  svg.addEventListener('pointermove', mover);
  svg.addEventListener('pointerleave', () => { tip.style.display = 'none'; xh.style.display = 'none'; dot.style.display = 'none'; halo.style.display = 'none'; });
}

function barrasHistorico(el, meses) {
  const W = el.clientWidth || 600, H = 220, P = { l: 64, r: 8, t: 8, b: 26 };

  const soGastos = cartaoSel !== null;
  const dados = meses.map(m => ({ m, ...totais(filtraCartao(itensDoMes(m))) }));
  if (soGastos) dados.forEach(d => d.r = 0);
  const ticks = niceTicks(0, Math.max(1, ...dados.flatMap(d => [d.r, d.d])));
  const y1 = ticks[ticks.length - 1];
  const y = v => P.t + (H - P.t - P.b) * (1 - v / y1);
  const gw = (W - P.l - P.r) / dados.length, bw = Math.min(22, (gw - 18) / 2);
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Receitas e despesas por mês"><defs>
    <linearGradient id="g-rec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f8bff"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="g-desp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>`;
  s += gradeY(ticks, y, P.l, W - P.r);
  const bar = (bx, v, cor) => {
    const top = y(v), h = y(0) - top; if (h <= 0) return '';
    const r = Math.min(7, h, bw / 2);
    return `<path d="M${bx},${y(0)}V${top + r}Q${bx},${top} ${bx + r},${top}H${bx + bw - r}Q${bx + bw},${top} ${bx + bw},${top + r}V${y(0)}Z" fill="${cor.startsWith('--') ? `var(${cor})` : cor}"/>`;
  };
  dados.forEach((d, i) => {
    const cx = P.l + gw * i + gw / 2;
    s += soGastos ? bar(cx - bw / 2, d.d, '--cartao') : bar(cx - bw - 2, d.r, 'url(#g-rec)') + bar(cx + 2, d.d, 'url(#g-desp)');
    s += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${nomeMes(d.m)}</text>`;
    s += `<rect x="${P.l + gw * i}" y="0" width="${gw}" height="${H}" fill="transparent" data-i="${i}"/>`;
  });
  s += `</svg><div class="tip"></div>`;
  el.style.setProperty('--cartao', corCartao(cartaoSel));
  el.innerHTML = (soGastos ? '' : `<div class="legend"><span><i style="background:linear-gradient(#4f8bff,#2563eb)"></i>Receitas</span><span><i style="background:linear-gradient(#c4b5fd,#8b5cf6)"></i>Despesas</span></div>`) + s;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip');
  svg.addEventListener('pointermove', ev => {
    const i = ev.target.dataset && ev.target.dataset.i; if (i == null) return;
    const d = dados[i], r = svg.getBoundingClientRect();
    tip.innerHTML = soGastos ? `<b>${nomeMes(d.m)}</b>${esc(nomeCartao(cartaoSel))}: ${fmt.format(d.d)}`
      : `<b>${nomeMes(d.m)}</b>Receitas: ${fmt.format(d.r)}<br>Despesas: ${fmt.format(d.d)}<br>Saldo: <span class="${d.saldo < 0 ? 'neg' : 'pos'}">${fmt.format(d.saldo)}</span>`;
    tip.style.display = 'block';
    const px = (P.l + gw * i + gw / 2) * (r.width / W);
    tip.style.left = Math.max(0, Math.min(px - tip.offsetWidth / 2, r.width - tip.offsetWidth)) + 'px';
    tip.style.top = (svg.offsetTop - tip.offsetHeight + 20) + 'px';
  });
  svg.addEventListener('pointerleave', () => tip.style.display = 'none');
}

// ---------- telas ----------
function catsUsadas() {
  const set = new Set(S.cats);
  S.lanc.concat(S.fixos).forEach(i => set.add(i.cat));
  return [...set];
}

function telaVisao() {
  const todos = itensDoMes(mesSel), itens = filtraCartao(todos), t = totais(itens);
  const desp = itens.filter(i => i.tipo === 'despesa');
  const porCat = {};
  desp.forEach(i => porCat[i.cat] = (porCat[i.cat] || 0) + i.valor);
  if (cartaoSel === null) Object.keys(S.orc).forEach(c => { if (S.orc[c] > 0 && !(c in porCat)) porCat[c] = 0; });
  const cats = Object.entries(porCat).sort((a, b) => b[1] - a[1]);
  // mês anterior, para comparar
  // (só compara quando o mês anterior tem receitas: antes disso o histórico está incompleto)
  const mesAnt = addMes(mesSel, -1), todosAnt = itensDoMes(mesAnt), tAnt = totais(filtraCartao(todosAnt));
  const porCatAnt = {};
  if (totais(todosAnt).r > 0) filtraCartao(todosAnt).filter(i => i.tipo === 'despesa').forEach(i => porCatAnt[i.cat] = (porCatAnt[i.cat] || 0) + i.valor);
  const maxG = Math.max(1, ...cats.map(([c, v]) => Math.max(v, cartaoSel === null ? S.orc[c] || 0 : 0)));
  const orcTotal = Object.values(S.orc).reduce((a, b) => a + (b || 0), 0);
  const gastoOrcado = Object.keys(S.orc).reduce((a, c) => a + (porCat[c] || 0), 0);
  const rows = cats.map(([c, v]) => {
    const lim = cartaoSel === null ? S.orc[c] || 0 : 0, pct = lim ? v / lim : 0;
    let st = '';
    if (lim && pct > 1) st = `<span class="status crit">▲ Estourou ${fmt.format(v - lim)}</span>`;
    else if (lim && pct >= 0.8) st = `<span class="status warn">● ${Math.round(pct * 100)}% usado</span>`;
    return `<div class="cat-row"><div class="name">${esc(c)}</div>
      <div class="track"><div class="fill" style="width:${(v / maxG) * 100}%;${cartaoSel !== null ? `background:${corCartao(cartaoSel)}` : ''}"></div>${lim ? `<div class="limit" style="left:${(lim / maxG) * 100}%" title="Limite ${fmt.format(lim)}"></div>` : ''}</div>
      <div class="amt">${fmt.format(v)}${lim ? ' de ' + fmt.format(lim) : ''}${porCatAnt[c] > 0 && v > 0 && Math.abs(v / porCatAnt[c] - 1) >= 0.05 ? `<span class="dl ${v > porCatAnt[c] ? 'ruim' : 'bom'}" title="${nomeMes(mesAnt)}: ${fmt.format(porCatAnt[c])}">${v > porCatAnt[c] ? '▲' : '▼'}${Math.round(Math.abs(v / porCatAnt[c] - 1) * 100)}%</span>` : ''} ${st}</div></div>`;
  }).join('');

  // gastos do mês por cartão (só aparece quando há algum cartão)
  const porCartao = {};
  todos.filter(i => i.tipo === 'despesa').forEach(i => {
    const c = grupoCartao(i);
    porCartao[c] = porCartao[c] || { v: 0, n: 0 };
    porCartao[c].v += i.valor; porCartao[c].n++;
  });
  const listaCartoes = Object.entries(porCartao).sort((a, b) => b[1].v - a[1].v);
  const maxCartao = Math.max(1, ...listaCartoes.map(([, x]) => x.v));
  const cardCartoes = cartoesUsados().length ? `
    <div class="card"><h2>${ico('cartao')} Por cartão <span class="sub">· sua parte em ${nomeMes(mesSel)}</span></h2>
      ${listaCartoes.map(([c, x]) => `<div class="cartao-row" data-cartao="${esc(c)}" style="--c:${corCartao(c)}">
        <div class="cartao-ico">${ico(c === FIXAS ? 'repete' : c ? 'cartao' : 'pix')}</div>
        <div><div class="nome">${esc(nomeCartao(c))}</div><div class="mini"><i style="width:${x.v / maxCartao * 100}%"></i></div></div>
        <div class="amt">${fmt.format(x.v)}<small>${x.n} ${x.n === 1 ? 'item' : 'itens'}${(() => { const o = c && diaVencimento(c) ? r2(faturasQueVencem(c, mesSel).reduce((a, f) => a + parteOutros(c, f), 0)) : 0; return o ? ` · ${NOME_OUTRO} ${fmt.format(o)}` : ''; })()}</small></div></div>`).join('') || '<div class="empty">Nenhuma despesa neste mês.</div>'}
      <p class="hint">Toque num cartão para ver só os gastos dele.</p>
    </div>` : '';

  // no mês atual: o que ainda vai entrar/sair daqui até o fim do mês
  const resto = mesSel === mesAtual() ? eventos(hoje(), fimDoMes(mesSel)) : null;
  const faltaEntrar = resto ? r2(resto.filter(e => e.valor > 0).reduce((a, e) => a + e.valor, 0)) : 0;
  const faltaSair = resto ? r2(-resto.filter(e => e.valor < 0).reduce((a, e) => a + e.valor, 0)) : 0;
  const quando = sinal => resto.filter(e => sinal * e.valor > 0).map(e => e.data.slice(8) + '/' + e.data.slice(5, 7)).filter((x, i, a) => a.indexOf(x) === i).slice(0, 3).join(', ');
  // mês atual: dinheiro na conta no fim do mês (saldo de hoje + o que ainda entra − o que ainda sai);
  // meses seguintes: o saldo previsto pela projeção; meses passados: só o resultado do mês
  const proj = cartaoSel === null && mesSel >= mesAtual() ? projecao() : null;
  const linhaProj = proj && proj.linhas.find(l => l.m === mesSel);
  const contaFim = linhaProj ? linhaProj.saldo : null;
  const hero = cartaoSel === null ? `
  <div class="hero">
    <div class="hero-ico">${ico('carteira')}</div>
    ${contaFim !== null ? `<div class="lbl">Na conta no fim de ${nomeMes(mesSel)}${mesSel > mesAtual() ? ' (previsto)' : ''}</div>
    <div class="big">${fmt.format(contaFim)}</div>
    <div class="stats">
      ${resto ? `<div class="stat" style="--c:var(--accent)">${ico('carteira')}<div><small>Saldo hoje</small><b>${fmt.format(S.saldoAtual)}</b></div></div>
      <div class="stat" style="--c:var(--good)">${ico('sobe')}<div><small>Ainda vai entrar${faltaEntrar ? ' · ' + quando(1) : ''}</small><b>${fmt.format(faltaEntrar)}</b></div></div>
      <div class="stat" style="--c:var(--crit)">${ico('desce')}<div><small>Ainda vai sair${faltaSair ? ' · ' + quando(-1) : ''}</small><b>${fmt.format(faltaSair)}</b></div></div>`
      : `<div class="stat" style="--c:var(--good)">${ico('sobe')}<div><small>Entra no mês</small><b>${fmt.format(linhaProj.r)}</b></div></div>
      <div class="stat" style="--c:var(--crit)">${ico('desce')}<div><small>Sai no mês (faturas pelo vencimento)</small><b>${fmt.format(linhaProj.d)}</b></div></div>`}
    </div>
    <div class="orc" title="Receitas do mês menos os gastos do mês; compras no cartão contam no mês em que a fatura vence">Resultado do mês: receitas ${fmt.format(t.r)} − gastos ${fmt.format(t.d)} = <b>${fmt.format(t.saldo)}</b>
      <span style="color:var(--muted)">· cartão no mês do vencimento</span></div>`
    : `<div class="lbl">Resultado de ${nomeMes(mesSel)}</div>
    <div class="big">${fmt.format(t.saldo)}</div>
    <div class="stats">
      <div class="stat" style="--c:var(--good)">${ico('sobe')}<div><small>Receitas</small><b>${fmt.format(t.r)}</b></div></div>
      <div class="stat" style="--c:var(--crit)">${ico('desce')}<div><small>Gastos (cartão no mês do vencimento)</small><b>${fmt.format(t.d)}</b></div></div>
    </div>`}
    ${orcTotal ? `<div class="orc">Orçamento: ${fmt.format(gastoOrcado)} de ${fmt.format(orcTotal)} (${Math.round(gastoOrcado / orcTotal * 100)}%)${gastoOrcado > orcTotal ? ' · ▲ acima do limite' : ''}
      <div class="bar"><i style="width:${Math.min(100, gastoOrcado / orcTotal * 100)}%"></i></div></div>` : ''}
  </div>` : `
  <div class="hero cor" style="background:linear-gradient(135deg, ${corCartao(cartaoSel)} 0%, color-mix(in srgb, ${corCartao(cartaoSel)} 55%, #1b1530) 100%)">
    <div class="lbl">${esc(nomeCartao(cartaoSel))} · ${nomeMes(mesSel)}</div>
    <div class="big">${fmt.format(t.d)}</div>
    <div class="stats">
      <div class="stat">${ico('lista')}<div><small>Lançamentos</small><b>${desp.length}</b></div></div>
      ${cats[0] ? `<div class="stat">${ico('pizza')}<div><small>Maior categoria</small><b>${esc(cats[0][0])}</b></div></div>` : ''}
      ${t.d ? `<div class="stat">${ico('carteira')}<div><small>Do total do mês</small><b>${Math.round(t.d / Math.max(1, totais(todos).d) * 100)}%</b></div></div>` : ''}
    </div>
  </div>`;

  const cardCats = `<div class="card"><h2>${ico('pizza')} Gastos por categoria</h2>
      ${rosca(cats)}
      ${rows || '<div class="empty">Nenhuma despesa neste mês.</div>'}
      ${cartaoSel !== null ? '' : Object.keys(S.orc).length ? '<p class="hint">A linha vertical marca o limite do orçamento.</p>' : '<p class="hint">Defina limites na aba Orçamento para acompanhar cada categoria.</p>'}
    </div>`;
  const cardHist = `<div class="card"><h2>${ico('grafico')} Últimos 6 meses ${cartaoSel !== null ? `<span class="sub">· gastos no ${esc(nomeCartao(cartaoSel))}</span>` : ''}</h2><div class="chart" id="hist"></div></div>`;
  // mês atual: quanto dá para gastar sem a conta ficar negativa
  const lv = cartaoSel === null && mesSel === mesAtual() ? livreParaGastar() : null;
  const cardLivre = lv ? `<div class="card livre ${lv.valor < 0 ? 'aperto' : ''}" title="Menor saldo previsto nos próximos 45 dias, já descontando contas fixas, faturas (com a estimativa de compras no cartão) e somando salários. É o que sobra para Pix/débito e compras fora do previsto.">
      <h2>${ico('alvo')} ${lv.valor < 0 ? 'Vai faltar' : 'Livre pra gastar'}</h2>
      <div class="big">${fmt.format(Math.abs(lv.valor))}</div>
      <p class="hint" style="margin-top:4px">${lv.valor < 0 ? `a conta fica negativa em ${ddmm(lv.ate)}` : lv.apertado ? `sem deixar a conta negativa até ${ddmm(lv.ate)}, o dia mais apertado` : `até a próxima entrada, em ${ddmm(lv.ate)}`}</p>
      ${lv.valor > 0 ? `<div class="pill">≈ ${fmt.format(lv.porDia)} por dia · ${lv.dias} ${lv.dias === 1 ? 'dia' : 'dias'}</div>
      <div class="medidor" title="Parte do saldo de hoje que está livre"><i style="width:${Math.min(100, Math.max(2, S.saldoAtual > 0 ? lv.valor / S.saldoAtual * 100 : 100))}%"></i></div>` : ''}
    </div>` : '';
  // números do mês com a variação em relação ao mês anterior
  const rot = 'vs ' + nomeMes(mesAnt);
  const proxFat = lv && lv.ev.find(e => e.cartao);
  const parcelasFuturas = cartaoSel === null ? S.lanc.filter(l => l.tipo === 'despesa' && l.cartao && l.parcela && vencDoLanc(l) && vencDoLanc(l) > fimDoMes(mesSel)) : [];
  const ultParcela = parcelasFuturas.reduce((m, l) => vencDoLanc(l) > m ? vencDoLanc(l) : m, '');
  const kpis = cartaoSel === null ? `<div class="tiles">
    ${tile('Receitas do mês', fmt.format(t.r), 'grafico', 'var(--accent)', tAnt.r > 0 ? delta(t.r, tAnt.r, false, rot) : '')}
    ${tile('Gastos do mês', fmt.format(t.d), 'desce', 'var(--violeta)', totais(todosAnt).r > 0 ? delta(t.d, tAnt.d, true, rot) : '')}
    ${proxFat ? tile(`Próxima fatura · ${esc(nomeCartao(proxFat.cartao))}`, fmt.format(-proxFat.valor), 'cartao', corCartao(proxFat.cartao), `<div class="sub2">vence ${ddmm(proxFat.data)}${proxFat.estimado ? ` · ≈ ${fmt.format(proxFat.estimado)} estimado` : ''}</div>`) : ''}
    ${parcelasFuturas.length ? tile('Parcelado em aberto', fmt.format(r2(parcelasFuturas.reduce((a, l) => a + l.valor, 0))), 'repete', '#db2777', `<div class="sub2">parcelas depois de ${nomeMes(mesSel)} · até ${nomeMes(ultParcela.slice(0, 7))}</div>`) : ''}
  </div>` : '';
  const agora = cartaoSel === null && mesSel === mesAtual();
  const blocos = agora
    ? `<div class="g21">${cardSaldoDia()}${cardCartoes || cardHist}</div>
      <div class="g21">${cardCats}${cardAtividade()}</div>
      ${cardCartoes ? cardHist : ''}`
    : cardCartoes ? `<div class="grid2">${cardCartoes}${cardCats}</div>${cardHist}` : `<div class="grid2">${cardCats}${cardHist}</div>`;
  return `${chipsCartao()}${cartaoSel === null ? telaPendencias() : ''}${cardLivre ? `<div class="destaque">${hero}${cardLivre}</div>` : hero}${kpis}
  ${blocos}
  <div class="card"><h2>${ico('lista')} Tudo de ${nomeMes(mesSel)} <span class="sub">· ${itens.length} ${itens.length === 1 ? 'item' : 'itens'}</span></h2>${tabelaItens(itens, true)}</div>`;
}

// Cor fixa por categoria (para o círculo com a inicial)
const CORES_AV = ['#2563eb', '#7c3aed', '#0ea5e9', '#db2777', '#d97706', '#059669', '#4f46e5', '#0d9488'];
const corCategoria = c => { let h = 0; for (const ch of String(c)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return CORES_AV[h % CORES_AV.length]; };
function tabelaItens(itens, mostraFixo) {
  if (!itens.length) return '<div class="empty">Nada por aqui ainda.</div>';
  itens = itens.slice().sort((a, b) => (b.data || '').localeCompare(a.data || ''));
  return `<div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th class="num">Valor</th><th></th></tr></thead><tbody>` +
    itens.map(i => `<tr><td style="white-space:nowrap">${i.fixo ? '<span class="tag t-azul">fixo</span>' : i.data.split('-').reverse().join('/')}</td><td><div class="it"><span class="av-cat" style="--c:${corCategoria(i.cat)}">${esc((i.cat || '?').trim().charAt(0).toUpperCase())}</span><div>${esc(i.desc)}${!i.fixo && i.data > hoje() && !i.parcela ? ' <span class="tag t-azul">planejado</span>' : ''}${i.cartao ? ' ' + tagCartao(i.cartao) : ''}${!i.fixo && vencDoLanc(i) ? ` <span class="tag" title="Data da compra: ${i.data.split('-').reverse().join('/')}. É paga na fatura que vence nesse dia.">paga em ${ddmm(vencDoLanc(i))}</span>` : ''}${i.provisorio ? ' <span class="tag t-aviso" title="Lançado à mão; será trocado pelo da fatura quando ela for importada">a conferir</span>' : ''}${i.agregado ? ' <span class="tag t-aviso" title="Diferença entre o valor do app do banco e o que o app já conhecia; some ao importar o PDF">valor do banco</span>' : ''}</div></div></td><td>${esc(i.cat)}</td>
      <td class="num ${i.tipo === 'receita' || i.valor < 0 ? 'pos' : ''}">${(i.tipo === 'receita') === (i.valor >= 0) ? '+' : '−'} ${fmt.format(Math.abs(i.valor))}</td>
      <td class="num">${i.fixo ? '' : `<button class="link" data-edit-lanc="${i.id}" title="Editar">${ico('lapis')}</button><button class="link" data-del-lanc="${i.id}" title="Excluir">✕</button>`}</td></tr>`).join('') +
    `</tbody></table></div>`;
}

function telaBusca() {
  if (!filtroBusca) return '';
  const ls = lancsDoFiltro(filtroBusca), desp = somaDesp(ls), rec = r2(ls.reduce((a, l) => a + (l.tipo === 'receita' ? l.valor : 0), 0));
  const meses = [...new Set(ls.map(l => mesDoLanc(l)))];
  return `<div class="card busca-card"><h2>${ico('lupa')} Resultados: ${esc(filtroBusca.rotulo)} <span class="sub">· ${ls.length} ${ls.length === 1 ? 'lançamento' : 'lançamentos'}</span><button class="link acao" data-limpar-busca>Limpar busca ✕</button></h2>
    <div class="tiles" style="margin-bottom:12px">
      ${tile('Gastos encontrados', fmt.format(desp), 'desce', 'var(--violeta)')}
      ${rec ? tile('Receitas encontradas', fmt.format(rec), 'sobe', 'var(--good)') : ''}
      ${meses.length > 1 ? tile('Média por mês', fmt.format(r2(desp / meses.length)), 'grafico', 'var(--accent)', `<div class="sub2">${meses.length} meses</div>`) : ''}
    </div>
    ${tabelaItens(ls.slice(0, 300))}${ls.length > 300 ? '<p class="hint">Mostrando os 300 mais recentes.</p>' : ''}
  </div>`;
}

function telaLanc() {
  const doMes = filtraCartao(S.lanc.filter(l => mesDoLanc(l) === mesSel));
  const dataPadrao = mesSel === mesAtual() ? hoje() : mesSel + '-01';
  return `
  ${telaBusca()}
  <div class="card"><h2>Novo lançamento</h2>
    <form id="f-lanc" class="row">
      <label>Tipo<select name="tipo"><option value="despesa">Despesa</option><option value="receita">Receita</option></select></label>
      <label>Data<input type="date" name="data" value="${dataPadrao}" required></label>
      <label style="flex:2 1 200px">Descrição<input name="desc" required placeholder="Ex.: mercado, uber, freela…"></label>
      <label>Categoria<input name="cat" list="cats" required placeholder="Alimentação"></label>
      <label>Valor (R$)<input name="valor" inputmode="decimal" required placeholder="0,00"></label>
      <label>Cartão<select name="cartao">${opcoesCartao(cartaoSel || SEM_CARTAO)}</select></label>
      <label>Parcelas<select name="parcelas">${Array.from({ length: 24 }, (_, i) => `<option value="${i + 1}">${i + 1}x</option>`).join('')}</select></label>
      <label>O valor é<select name="valorDe"><option value="total">Total da compra</option><option value="parcela">De cada parcela</option></select></label>
      <label>Sua parte<select name="parte"><option value="1">Tudo</option><option value="1/2">Metade</option><option value="2/3">2/3</option><option value="1/3">1/3</option><option value="3/4">3/4</option><option value="1/4">1/4</option></select></label>
      <button class="btn primary">Adicionar</button>
    </form>
    <p class="hint">Comprou no cartão? Escolha o cartão e as parcelas: cada parcela vai para a fatura em que vai cair e entra na projeção já. Quando você importar a fatura, a compra é reconhecida e não duplica. Em "Sua parte", informe o valor total da conta: o app lança só a sua fração. Use datas futuras para gastos planejados (IPVA, viagem, presente) — eles entram na projeção.</p>
  </div>
  ${chipsCartao()}
  <div class="card"><h2>${ico('lista')} Lançamentos de ${nomeMes(mesSel)} ${cartaoSel !== null ? `<span class="sub">· ${esc(nomeCartao(cartaoSel))} · ${fmt.format(totais(doMes).d)}</span>` : ''}</h2>${tabelaItens(doMes)}</div>`;

let pdfjsPronto;
function carregarPdfjs() {
  return pdfjsPronto ||= new Promise((ok, erro) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok(pdfjsLib); };
    s.onerror = () => { pdfjsPronto = null; erro(new Error('Não consegui carregar o leitor de PDF (precisa de internet).')); };
    document.head.appendChild(s);
  });
}

// Junta os pedaços de texto do PDF em linhas (página inteira, da esquerda para a direita),
// guardando a posição horizontal de cada caractere para saber de que coluna cada compra veio.
async function linhasDoPdf(buf) {
  const lib = await carregarPdfjs();
  let doc;
  try {
    doc = await lib.getDocument({ data: buf.slice(0) }).promise;
  } catch (e) {
    if (e.name !== 'PasswordException') throw e;
    // alguns bancos protegem o PDF (costuma ser parte do CPF do titular)
    const senha = prompt('Esta fatura tem senha. Digite a senha do PDF (geralmente são os primeiros dígitos do CPF do titular):');
    if (!senha) throw new Error('A fatura tem senha e nenhuma foi informada.');
    try { doc = await lib.getDocument({ data: buf, password: senha }).promise; }
    catch (e2) { throw e2.name === 'PasswordException' ? new Error('Senha incorreta.') : e2; }
  }
  const linhas = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p), meio = page.getViewport({ scale: 1 }).width / 2;
    const itens = (await page.getTextContent()).items.filter(i => i.str.trim());
    const grupos = [];
    for (const it of itens) {
      const y = it.transform[5];
      let g = grupos.find(g => Math.abs(g.y - y) < 2.5);
      if (!g) grupos.push(g = { y, itens: [] });
      g.itens.push(it);
    }
    grupos.sort((a, b) => b.y - a.y);
    for (const g of grupos) {
      g.itens.sort((a, b) => a.transform[4] - b.transform[4]);
      let txt = '', xs = [], fim = null;
      for (const it of g.itens) {
        const x = it.transform[4];
        if (fim !== null && x - fim > 1) { txt += ' '; xs.push(x); }
        const s = it.str.replace(/[−–]/g, '-');
        txt += s; xs.push(...Array(s.length).fill(x));
        fim = x + it.width;
      }
      linhas.push({ pagina: p, meio, txt, xs });
    }
  }
  return linhas;
}

const MESES = { jan: 1, fev: 2, mar: 3, abr: 4, mai: 5, jun: 6, jul: 7, ago: 8, set: 9, out: 10, nov: 11, dez: 12 };

// "1.234,56" | "R$ -12,00" | "12,00-" | "-R$ 5,00" → número (negativo = crédito)
function valorDe(s) {
  s = String(s).replace(/[−–]/g, '-').replace(/R\$|\s/g, '');
  const neg = /^-|-$/.test(s);
  const n = parseFloat(s.replace(/-/g, '').replace(/\./g, '').replace(',', '.'));
  return isFinite(n) ? (neg ? -n : n) : NaN;
}
// "05/10", "05/10/2026", "05 OUT", "05 OUT 2026" → {d, m, a?}
function dataDe(s) {
  const m = String(s).match(/(\d{2})(?:\/(\d{2})|\s([A-Za-z]{3}))(?:[\/ ](\d{4}))?/);
  if (!m) return null;
  const mes = m[2] ? +m[2] : MESES[m[3].toLowerCase()];
  if (!mes || mes > 12 || +m[1] < 1 || +m[1] > 31) return null;
  return { d: +m[1], m: mes, a: m[4] ? +m[4] : null };
}
const iso = (a, m, d) => `${a}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

// Parcela no fim da descrição: "LOJA 03/10", "LOJA PARC 03/10", "Loja - Parcela 3/10"
function separarParcela(desc) {
  const m = desc.match(/\s*[-–]?\s*(?:PARC(?:ELA)?\.?\s*)?(\d{1,2})\s*\/\s*(\d{1,2})$/i);
  if (m && +m[1] >= 1 && +m[1] <= +m[2] && +m[2] > 1 && +m[2] <= 48) return { desc: desc.slice(0, m.index).trim(), parc: { n: +m[1], N: +m[2] } };
  return { desc, parc: null };
}

const VALOR = String.raw`-?\s?(?:R\$\s?)?-?(?:\d{1,3}(?:\.\d{3})+|\d+),\d{2}-?`;
const DATA_NUM = String.raw`\d{2}\/\d{2}(?!\/?\d)`;
const DATA_MES = String.raw`\d{2} (?:JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)\b`;

// Um leitor por banco. "secoes": títulos que mudam o que vem abaixo deles, na mesma coluna:
//   compra = importa · ignora = pagamentos/créditos · futuro = parcelas de faturas seguintes
const LEITORES = {
  Santander: {
    detecta: /santander/i,
    data: DATA_NUM, inicio: null,
    secoes: [[/Pagamento e Demais Cr/i, 'ignora'], [/\bParcelamentos\b/i, 'compra'], [/\bDespesas\b(?!\/)/, 'compra']],
    encargos: [/\(\+\)\s*(Juros[^0-9]*?|IOF)\s+((?:\d{1,3}(?:\.\d{3})+|\d+),\d{2})/i],
    vencimento: /(\d{2}\/\d{2}\/\d{4})/,
    fechamento: /realizados[\s\S]{0,80}?at[ée]\s+(\d{2}\/\d{2})/i,
    total: { re: /VALOR TOTAL ((?:\d{1,3}(?:\.\d{3})+|\d+),\d{2})/, inclui: 'compras' },
  },
  Itaú: {
    detecta: /ita[uú] ?unibanco|itaucard|banco ita[uú]/i,
    data: DATA_NUM, inicio: null,
    secoes: [[/Pagamentos efetuados/i, 'ignora'], [/Lan[çc]amentos: compras e saques|Lan[çc]amentos internacionais/i, 'compra'], [/pr[óo]ximas faturas/i, 'futuro'], [/Limites de cr[ée]dito/i, 'ignora']],
    encargos: [/Repasse de (IOF) em R\$\s*((?:\d{1,3}(?:\.\d{3})+|\d+),\d{2})/i, /(Juros do rotativo|Juros de mora|Multa por atraso)\s+[\d,]+\s*%[^0-9]*?((?:\d{1,3}(?:\.\d{3})+|\d+),\d{2})/i],
    vencimento: /Vencimento:\s*(\d{2}\/\d{2}\/\d{4})/i,
    fechamento: /Emiss[ãa]o:\s*(\d{2}\/\d{2}\/\d{4})/i,
    total: { re: /Total dos lan[çc]amentos atuais\s*((?:\d{1,3}(?:\.\d{3})+|\d+),\d{2})/i, inclui: 'tudo' },
  },
  Bradesco: {
    detecta: /bradesco/i,
    data: DATA_NUM, inicio: 'compra',
    secoes: [[/pr[óo]ximas faturas|parcelas a vencer|lan[çc]amentos futuros/i, 'futuro'], [/(Lan[çc]amentos|Hist[óo]rico)\b/i, 'compra']],
    encargos: [],
    vencimento: /Vencimento[:\s]*(\d{2}\/\d{2}\/\d{4})/i,
    fechamento: /fechamento[^\d]{0,20}(\d{2}\/\d{2}(?:\/\d{4})?)/i,
    total: { re: /Total (?:da fatura|desta fatura)[^\d]{0,15}((?:\d{1,3}(?:\.\d{3})+|\d+),\d{2})/i, inclui: 'tudo' },
  },
  Nubank: {
    detecta: /nubank|nu pagamentos/i,
    data: DATA_MES, inicio: 'compra',
    secoes: [[/Pagamentos e Financiamentos/i, 'ignora'], [/^TRANSA[ÇC][ÕO]ES/i, 'compra']],
    encargos: [],
    vencimento: /vencimento[:\s]*(\d{2} [A-Z]{3} \d{4})/i,
    fechamento: /TRANSA[ÇC][ÕO]ES\s+DE\s+\d{2}\s+[A-Z]{3}\s+A\s+(\d{2}\s+[A-Z]{3})/i,
    total: { re: /Total de compras de todos os cart[õo]es[^\d]{0,30}((?:\d{1,3}(?:\.\d{3})+|\d+),\d{2})/i, inclui: 'compras' },
  },
};
const BANCOS_SUPORTADOS = Object.keys(LEITORES).join(', ').replace(/, (?=[^,]*$)/, ' e ');

function lerFatura(linhas) {
  const texto = linhas.map(l => l.txt).join('\n');
  const banco = Object.keys(LEITORES).find(b => LEITORES[b].detecta.test(texto));
  if (!banco) throw new Error(`Não reconheci o banco desta fatura. O app lê faturas em PDF de: ${BANCOS_SUPORTADOS}.`);
  const L = LEITORES[banco];
  const reCompra = new RegExp(`(?<![\\d\\/])(${L.data})\\s*(.+?)\\s+(${VALOR})(?![\\d%,])`, 'gi');

  const brutos = [];
  let futuros = 0;
  const estado = [L.inicio, L.inicio];   // [coluna esquerda, coluna direita]
  const colunaEm = (l, i) => l.xs[i] < l.meio ? 0 : 1;
  for (const l of linhas) {
    // títulos de seção mudam o estado da coluna onde aparecem
    for (const [re, novo] of L.secoes) {
      const g = new RegExp(re.source, re.flags.includes('g') ? re.flags : re.flags + 'g');
      for (const m of l.txt.matchAll(g)) estado[colunaEm(l, m.index)] = novo;
    }
    for (const re of L.encargos) {
      const m = l.txt.match(re);
      if (m && valorDe(m[2]) > 0) brutos.push({ dataObj: null, desc: m[1].trim(), valor: valorDe(m[2]), encargo: true });
    }
    for (const m of l.txt.matchAll(reCompra)) {
      const st = estado[colunaEm(l, m.index)];
      if (st === 'futuro') { futuros++; continue; }
      if (st !== 'compra') continue;
      const d = dataDe(m[1]);
      if (d) brutos.push({ dataObj: d, desc: m[2].trim(), valor: valorDe(m[3]) });
    }
  }

  // vencimento e fechamento
  const achar = re => { const m = texto.match(re); return m ? dataDe(m[1]) : null; };
  const venc = achar(L.vencimento) || (() => { const [a, m, d] = hoje().split('-').map(Number); return { a, m, d }; })();
  const fech = achar(L.fechamento) || venc;
  let ano = fech.a || venc.a;
  if (!fech.a && fech.m > venc.m) ano--;
  const fechamento = iso(ano, fech.m, fech.d);
  const dataISO = o => iso(o.a || (o.m > fech.m ? ano - 1 : ano), o.m, o.d);

  let ignorados = 0;
  const itens = [];
  for (const b of brutos) {
    if (isNaN(b.valor) || b.valor === 0) continue;
    if (b.valor < 0 && /PAGAMENTO|PAGTO/i.test(b.desc)) { ignorados++; continue; }
    const { desc, parc } = separarParcela(b.desc.replace(/\s+/g, ' ').trim());
    const sec = b.encargo || /^(JUROS|IOF|MULTA|ENCARGO|ANUIDADE)/i.test(desc) ? 'encargo' : b.valor < 0 ? 'credito' : parc ? 'parcela' : 'despesa';
    itens.push({ sec, data: b.dataObj ? dataISO(b.dataObj) : fechamento, desc: desc.toUpperCase(), parc, valor: r2(b.valor) });
  }
  if (!itens.length) throw new Error(`Reconheci uma fatura ${banco}, mas não encontrei compras nela.`);

  // conferência com o total impresso na fatura
  const tot = texto.match(L.total.re);
  const soma = r2(itens.filter(i => L.total.inclui === 'tudo' || i.sec !== 'encargo').reduce((a, i) => a + i.valor, 0));
  const totalFatura = tot ? valorDe(tot[1]) : null;

  itens.forEach(it => {
    it.base = `${it.desc}|${it.valor}|${it.data}|${it.parc ? it.parc.N : ''}`;
    it.key = it.sec === 'encargo' ? `${fechamento}|${it.desc}|${it.valor}` : it.base + '|' + (it.parc ? it.parc.n : '');
  });
  marcarItens(itens, banco, fechamento);
  return { banco, fechamento, vencimento: iso(venc.a || ano, venc.m, venc.d), itens, soma, totalFatura, ignorados, futuros, revisao: itens.some(i => i.importado) };
}

// Pré-marca cada item: o que já foi lançado volta como estava (para revisar);
// o resto segue o que você marcou da última vez para o mesmo estabelecimento.
function marcarItens(itens, banco, fechamento) {
  const usados = new Set(), fixosUsados = new Set();
  itens.forEach((it, i) => {
    it.id = i;
    let ja = S.lanc.find(l => l.key === it.key);
    // compra lançada à mão antes da fatura fechar: usa a sua marcação e o seu nome/categoria
    const manual = !ja && banco ? S.lanc.find(l => !usados.has(l.id) && casaComFatura(l, it, banco)) : null;
    if (manual) { usados.add(manual.id); it.manual = manual.id; ja = manual; }
    const regra = S.regras[it.desc];
    it.importado = !!(ja && !ja.prevista && !ja.provisorio);
    it.escolha = ja ? (ja.share === 1 ? 'meu' : ja.share === 0.5 ? 'metade' : 'div')
      : regra ? regra.escolha : null;
    // já tinha sido importada e este item não virou lançamento: foi marcado "não é meu"
    if (!ja && !regra && S.faturas.some(f => f.itens.some(x => x.key === it.key))) it.escolha = 'nao';
    if (it.escolha === 'div') Object.assign(it, ja ? lerFracao(fracaoTxt(ja.share)) : { k: regra.k, n: regra.n });
    it.cat = ja ? ja.cat : regra && regra.cat ? regra.cat : palpiteCat(it.desc);
    // cobrança que já está em Fixos neste cartão (assinatura): não conta de novo
    if (!ja && banco && fechamento && it.sec === 'despesa') {
      const fx = S.fixos.find(f => !fixosUsados.has(f.id) && f.cartao === banco && f.tipo === 'despesa' && fixoAtivo(f, fechamento.slice(0, 7))
        && Math.abs(f.valor - it.valor) <= Math.max(1, f.valor * 0.05));
      if (fx) { fixosUsados.add(fx.id); it.fixo = fx.desc; it.escolha = 'nao'; it.cat = fx.cat; }
    }
  });
}

function reabrirFatura(id) {
  const f = S.faturas.find(f => f.id === id);
  const itens = f.itens.map(x => ({ ...x, parc: x.parc ? { ...x.parc } : null }));
  marcarItens(itens, f.banco, f.fechamento);
  imp = { ...f, itens, revisao: true };
}

function desfazerFatura(id) {
  const f = S.faturas.find(f => f.id === id);
  const keys = new Set(f.itens.map(i => i.key)), bases = f.itens.filter(i => i.parc).map(i => i.base + '|');
  S.lanc = S.lanc.filter(l => !keys.has(l.key) && !(l.prevista && bases.some(b => l.key.startsWith(b))));
  S.faturas = S.faturas.filter(x => x.id !== id);
  salvar();
}

const SHARE = { meu: 1, metade: 0.5, nao: 0 };
const fracao = it => it.escolha === 'div' ? it.k / it.n : SHARE[it.escolha] || 0;
const rotuloFracao = share => share === 1 ? '' : share === 0.5 ? ' · metade' : ` · ${fracaoTxt(share)} seu`;
// 0.6667 → "2/3"
function fracaoTxt(share) {
  for (let n = 2; n <= 12; n++) { const k = Math.round(share * n); if (Math.abs(k / n - share) < 0.001) return `${k}/${n}`; }
  return Math.round(share * 100) + '%';
}
function lerFracao(txt) {
  const m = String(txt || '').trim().match(/^(\d+)\s*\/\s*(\d+)$/);
  return m && +m[1] >= 1 && +m[1] < +m[2] && +m[2] <= 12 ? { k: +m[1], n: +m[2] } : null;
}
const r2 = v => Math.round(v * 100) / 100;

function telaHistoricoFaturas() {

// Dia de fechamento do cartão: o que você informou, ou o da última fatura importada dele.
// Melhor dia de compra: a partir dele (ou do próximo dia útil, se a regra estiver ligada) a compra
// vai para a fatura seguinte. A fatura fecha no dia anterior.
function melhorDia(c) {
  if (S.melhorDia[c]) return S.melhorDia[c];
  if (S.diasFechamento[c]) return S.diasFechamento[c] + 1;   // configuração antiga: dia de fechamento
  const f = S.faturas.filter(f => f.banco === c).sort((a, b) => b.fechamento.localeCompare(a.fechamento))[0];
  return f ? +f.fechamento.slice(8) + 1 : null;
}
const diaFechamento = c => melhorDia(c) ? melhorDia(c) - 1 || 31 : null;
const dataNoMes = (ym, dia) => ym + '-' + String(Math.min(dia, 28)).padStart(2, '0');
// Mesma data se for dia útil; senão, o próximo dia útil (fim de semana ou feriado nacional)
function proxDiaUtil(iso) {
  const d = new Date(iso + 'T12:00');
  for (;;) {
    const s = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    if (d.getDay() !== 0 && d.getDay() !== 6 && !feriados(d.getFullYear()).has(s)) return s;
    d.setDate(d.getDate() + 1);
  }
}
// Data de fechamento do cartão no mês `ym` (com a regra do dia útil, se ligada para ele).
// Virada antecipada: { 'YYYY-MM': 'YYYY-MM-DD' } troca o fechamento normal daquele mês pela data informada.
function fechamentoEm(c, ym) {
  const md = melhorDia(c);
  if (!md) return null;
  const esp = (S.viradaAntecipada[c] || {})[ym];
  if (esp) return esp;
  const inicio = S.cartaoDiaUtil[c] ? proxDiaUtil(dataDia(ym, md)) : dataDia(ym, md);
  const d = new Date(inicio + 'T12:00'); d.setDate(d.getDate() - 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
const addDia = (iso, n) => { const d = new Date(iso + 'T12:00'); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
// Fechamento imediatamente anterior a `fech` (com virada antecipada, pode não ser o do mês anterior)
function fechamentoAnterior(c, fech) {
  const ym = fech.slice(0, 7);
  const antes = [-2, -1, 0, 1].map(k => fechamentoEm(c, addMes(ym, k))).filter(f => f && f < fech).sort();
  return antes.length ? antes[antes.length - 1] : addMes(ym, -1) + fech.slice(7);
}
// Data de fechamento da fatura em que cai uma compra feita em `data`
function fechamentoDaCompra(c, data) {
  if (!fechamentoEm(c, data.slice(0, 7))) return null;
  for (let k = -1; k <= 2; k++) {
    const f = fechamentoEm(c, addMes(data.slice(0, 7), k));
    if (f && data <= f) return f;   // fechamentos em ordem: o primeiro que vem depois da compra
  }
  return fechamentoEm(c, addMes(data.slice(0, 7), 2));
}
// "Antecipei a virada": a partir de `dia` as compras vão para a fatura seguinte; a atual fecha na véspera
function anteciparVirada(c, dia) {
  const normal = fechamentoDaCompra(c, dia);   // fechamento que seria o desta compra sem a antecipação
  const d = new Date(dia + 'T12:00'); d.setDate(d.getDate() - 1);
  const vespera = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  (S.viradaAntecipada[c] = S.viradaAntecipada[c] || {})[normal.slice(0, 7)] = vespera;
}

// Compra no cartão lançada à mão: cada parcela vai para a fatura em que vai cair.
// Fica marcada "a conferir" até a fatura ser importada e trocar pela de verdade.
function lancarCompraCartao(f, valor, share) {
  const N = Math.max(1, +f.parcelas || 1);
  const vParc = r2(f.valorDe === 'parcela' ? valor : valor / N);
  const fech1 = fechamentoDaCompra(f.cartao, f.data);
  const compra = { id: uid(), data: f.data, N, valor: vParc };
  for (let k = 1; k <= N; k++) {
    // à vista fica na data da compra; parcelas, no fechamento de cada fatura (como na importação)
    const data = N === 1 ? f.data : fech1 ? fechamentoEm(f.cartao, addMes(fech1.slice(0, 7), k - 1)) : addMes(f.data.slice(0, 7), k - 1) + f.data.slice(7);
    S.lanc.push({ id: uid(), tipo: 'despesa', data, desc: f.desc.trim() + (N > 1 ? ` (${k}/${N})` : '') + rotuloFracao(share), cat: f.cat.trim(),
      valor: r2(vParc * share), share, cartao: f.cartao, parcela: N > 1, provisorio: true, compra: { ...compra, n: k } });
  }
}

// A compra lançada à mão corresponde a este item da fatura? Mesmo cartão, mesma parcela,
// valor parecido (até 3% ou R$ 1) e data da compra até 5 dias de diferença.
function casaComFatura(l, it, banco) {
  if (!l.provisorio || l.cartao !== banco) return false;
  const c = l.compra, n = it.parc ? it.parc.n : 1, N = it.parc ? it.parc.N : 1;
  if (c.n !== n || c.N !== N) return false;
  if (Math.abs(c.valor - it.valor) > Math.max(1, it.valor * 0.03)) return false;
  return Math.abs(new Date(c.data) - new Date(it.data)) <= 5 * 864e5;
}

// "15, 30" | "15 e 30" | "5" → [15, 30]
const lerDias = t => [...new Set(String(t || '').split(/[^\d]+/).map(Number).filter(d => d >= 1 && d <= 31))].sort((a, b) => a - b);
const textoDias = ds => 'dia ' + ds.join(ds.length === 2 ? ' e ' : ', ');
// Campo "Dia(s) do mês": dias fixos e/ou "Nº dia útil" ("5º dia útil", "5du").
// Cada parte pode ter percentual: "15 (40%), 30" = 40% no dia 15 e o resto no 30.
// pct guarda os percentuais informados: { d15: 40, u5: 60 } (d = dia do mês, u = dia útil).
const RE_UTIL = /(\d{1,2})\s*[ºo°]?\s*(?:du\b|d\.u\.?|dias?\s+[úu]t(?:il|eis)\b|[úu]t(?:il|eis)\b)/i;
function lerAgenda(t) {
  const dias = [], uteis = [], pct = {}, valores = {};
  // vírgula decimal do valor ("R$ 760,50") não pode separar as partes
  const txt = String(t || '').replace(/R\$\s*([\d.]+),(\d{1,2})\b/gi, 'R$ $1.$2');

function diaVencimento(c) {

const fimDoMes = ym => dataDia(ym, 31);

// Etiqueta de variação em relação a outro valor. `subirEhRuim` para gastos.

// Saldo da conta dia a dia (degraus), com área preenchida e o dia mais apertado marcado

// Rosca de gastos por categoria: as 5 maiores + o resto
const CORES_CAT = ['#2563eb', '#5b8cff', '#7c5cf6', '#a78bfa', '#38bdf8', '#cbd5f5'];
function rosca(cats) {

  if (!(total > 0)) return '';
  const fatias = cats.slice(0, 5).filter(([, v]) => v > 0);
  const resto = total - fatias.reduce((a, [, v]) => a + v, 0);
  if (resto > 0.005) fatias.push(['Outras', resto]);

    acc += len;

  return `<div class="rosca"><svg viewBox="0 0 150 150" role="img" aria-label="Gastos por categoria"><circle r="${R}" cx="75" cy="75" fill="none" stroke="var(--grid)" stroke-width="15"/>${arcos}
    <text x="75" y="71" text-anchor="middle" style="font-size:17px;font-weight:800;fill:var(--text)">${fmtCurto(total)}</text><text x="75" y="89" text-anchor="middle" style="font-size:11px;fill:var(--muted)">total no mês</text></svg>

// Próximos `dias` dias com o saldo dia a dia a partir do saldo atual
function agenda(dias = 30) {
  const d = new Date(); d.setDate(d.getDate() + dias);
  const ev = eventos(hoje(), d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'));
  let saldo = S.saldoAtual;
  ev.forEach(e => e.saldo = saldo = r2(saldo + e.valor));

}

const ddmm = d => d.split('-').reverse().slice(0, 2).join('/');

// Ao informar o saldo de hoje, compara com o esperado: saldo anterior + o que estava previsto
// entre as duas datas (salários, contas, faturas, Pix planejados). A diferença é o que entrou
// ou saiu sem estar registrado.
function informarSaldo(novo) {
  const c = S.conferencia;
  // corrigindo no mesmo dia: compara de novo a partir da mesma base
  const base = c && c.ate === hoje() ? { saldo: c.anterior, data: c.de }
    : S.saldoData && S.saldoData < hoje() ? { saldo: S.saldoAtual, data: S.saldoData } : null;
  if (base) {
    const ev = eventos(base.data, hoje());
    const entradas = r2(ev.filter(e => e.valor > 0).reduce((a, e) => a + e.valor, 0));
    const saidas = r2(-ev.filter(e => e.valor < 0).reduce((a, e) => a + e.valor, 0));
    const esperado = r2(base.saldo + entradas - saidas);
    S.conferencia = { de: base.data, ate: hoje(), anterior: base.saldo, entradas, saidas, esperado, informado: novo, diff: r2(novo - esperado) };
  }
  S.saldoAtual = novo; S.saldoData = hoje();
  salvar();
}

function campoSaldo() {
